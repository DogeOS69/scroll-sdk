name: Test AWS access chart
on:
  pull_request:
    paths:
      - charts/aws-access/**
      - examples/Makefile.example
      - .github/workflows/test-aws-access.yaml
  push:
    paths:
      - charts/aws-access/**
      - examples/Makefile.example
      - .github/workflows/test-aws-access.yaml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: helm lint --strict charts/aws-access
      - run: python -m unittest discover -s charts/aws-access/tests -v

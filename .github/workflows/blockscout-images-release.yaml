name: Build and publish Blockscout images

# Push a tag such as blockscout-scroll-8.0.2-alpine3.24.1 or
# blockscout-frontend-v1.38.2-alpine3.24.1. The text after the image name
# becomes the image tag.
on:
  push:
    tags:
      - 'blockscout-scroll-*'
      - 'blockscout-frontend-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select image
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            blockscout-scroll-*)
              image=blockscout-scroll
              platforms=linux/amd64,linux/arm64
              ;;
            blockscout-frontend-*)
              image=blockscout-frontend
              # The upstream frontend image is published for amd64 only.
              platforms=linux/amd64
              ;;
            *)
              echo "Unsupported tag: $ref" >&2
              exit 1
              ;;
          esac
          version="${ref#"$image"-}"
          if [ -z "$version" ] || [ "$version" = "$ref" ]; then
            echo "Tag $ref has no version" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "IMAGE=$image"
            echo "REGISTRY_IMAGE=ghcr.io/$owner/$image"
            echo "VERSION=$version"
            echo "PLATFORMS=$platforms"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: custom-images/${{ env.IMAGE }}
          file: custom-images/${{ env.IMAGE }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}

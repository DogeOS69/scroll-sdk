name: Build and publish Blockscout images

# Push a tag such as blockscout-scroll-8.0.2-alpine3.24.1 or
# blockscout-frontend-v1.38.2-alpine3.24.1. The text after the image name
# becomes the image tag.
on:
  push:
    tags:
      - 'blockscout-scroll-*'
      - 'blockscout-frontend-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select image
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            blockscout-scroll-*)
              image=blockscout-scroll
              platforms=linux/amd64,linux/arm64
              ;;
            blockscout-frontend-*)
              image=blockscout-frontend
              # Built from upstream source plus the patch named in upstream.env.
              platforms=linux/amd64
              ;;
            *)
              echo "Unsupported tag: $ref" >&2
              exit 1
              ;;
          esac
          version="${ref#"$image"-}"
          if [ -z "$version" ] || [ "$version" = "$ref" ]; then
            echo "Tag $ref has no version" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          context="custom-images/$image"
          if [ -f "$context/upstream.env" ]; then
            # shellcheck disable=SC1091
            . "$context/upstream.env"
            {
              echo "UPSTREAM_REPOSITORY=$UPSTREAM_REPOSITORY"
              echo "UPSTREAM_REF=$UPSTREAM_REF"
              echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT"
              echo "UPSTREAM_PATCH=$context/$UPSTREAM_PATCH"
            } >> "$GITHUB_ENV"
            context=upstream
          fi
          {
            echo "IMAGE=$image"
            echo "BUILD_CONTEXT=$context"
            echo "REGISTRY_IMAGE=ghcr.io/$owner/$image"
            echo "VERSION=$version"
            echo "PLATFORMS=$platforms"
          } >> "$GITHUB_ENV"

      - name: Check out upstream source
        if: env.UPSTREAM_COMMIT != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Apply patch to upstream source
        if: env.UPSTREAM_COMMIT != ''
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          git -C upstream apply --verbose "$GITHUB_WORKSPACE/$UPSTREAM_PATCH"
          echo "UPSTREAM_SHORT=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.UPSTREAM_SHORT }}
            GIT_TAG=${{ env.UPSTREAM_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ env.VERSION }}

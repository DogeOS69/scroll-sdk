name: Test capacity manager integration
on:
  pull_request:
    paths:
      - charts/capacity-manager/**
      - charts/withdrawal-processor/**
      - examples/capacity-manager*
      - examples/values/capacity-manager-production.yaml
      - examples/values/withdrawal-processor-production.yaml
      - examples/tests/test_capacity_manager.py
      - .github/workflows/test-capacity-manager.yaml
  push:
    paths:
      - charts/capacity-manager/**
      - charts/withdrawal-processor/**
      - examples/capacity-manager*
      - examples/values/capacity-manager-production.yaml
      - examples/values/withdrawal-processor-production.yaml
      - examples/tests/test_capacity_manager.py
      - .github/workflows/test-capacity-manager.yaml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: helm dependency build charts/withdrawal-processor
      - run: helm lint --strict charts/capacity-manager -f charts/capacity-manager/ci/render-values.yaml
      - run: python3 -m unittest examples/tests/test_capacity_manager.py

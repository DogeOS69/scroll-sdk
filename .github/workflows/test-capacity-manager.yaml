name: Test capacity manager integration
on:
  pull_request:
    paths:
      - charts/capacity-manager/**
      - charts/withdrawal-processor/**
      - examples/capacity-manager*
      - examples/values/capacity-manager*.yaml
      - examples/values/withdrawal-processor-production.yaml
      - examples/tests/test_capacity_manager*.py
      - .github/workflows/test-capacity-manager.yaml
  push:
    paths:
      - charts/capacity-manager/**
      - charts/withdrawal-processor/**
      - examples/capacity-manager*
      - examples/values/capacity-manager*.yaml
      - examples/values/withdrawal-processor-production.yaml
      - examples/tests/test_capacity_manager*.py
      - .github/workflows/test-capacity-manager.yaml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2 'dstack==0.21.5'
      - run: helm dependency build charts/withdrawal-processor
      - run: helm lint --strict charts/capacity-manager -f charts/capacity-manager/ci/render-values.yaml
      - run: helm lint --strict charts/capacity-manager -f examples/values/capacity-manager-devnet-rtx3090.yaml
      - run: helm lint --strict charts/capacity-manager -f examples/values/capacity-manager-devnet-aws-a10g.yaml
      - run: helm lint --strict charts/capacity-manager -f examples/values/capacity-manager-devnet-aws-l40s.yaml --set prepared=true
      - run: python3 -m unittest discover -s examples/tests -p 'test_capacity_manager*.py'
      - run: python3 -m unittest discover -s charts/capacity-manager/tests -p 'test_*.py'

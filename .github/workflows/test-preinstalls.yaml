name: Test preinstalls readiness

on:
  pull_request:
    paths:
      - charts/preinstalls-deployer/**
      - examples/Makefile.example
      - examples/tests/test_preinstalls_readiness.py
      - .github/workflows/test-preinstalls.yaml
  push:
    paths:
      - charts/preinstalls-deployer/**
      - examples/Makefile.example
      - examples/tests/test_preinstalls_readiness.py
      - .github/workflows/test-preinstalls.yaml

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: helm dependency build charts/preinstalls-deployer
      - run: helm lint charts/preinstalls-deployer
      - name: Test rendered readiness scripts in their runtime image
        run: python3 -m unittest discover -s examples/tests -p 'test_preinstalls_readiness.py' -v
        env:
          PREINSTALLS_READINESS_DOCKER_TEST: '1'

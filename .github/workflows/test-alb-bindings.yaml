name: Test existing ALB bindings
on:
  pull_request:
    paths:
      - charts/blockscout/**
      - charts/frontends/**
      - charts/l2-reth/**
      - charts/proof-coordinator/**
      - charts/tso-service/**
      - .github/tests/test_existing_alb.py
      - examples/Makefile.example
      - examples/values/blockscout-production.yaml
      - examples/tests/test_blockscout_frontend.py
      - .github/workflows/test-alb-bindings.yaml
  push:
    paths:
      - charts/blockscout/**
      - charts/frontends/**
      - charts/l2-reth/**
      - charts/proof-coordinator/**
      - charts/tso-service/**
      - .github/tests/test_existing_alb.py
      - examples/Makefile.example
      - examples/values/blockscout-production.yaml
      - examples/tests/test_blockscout_frontend.py
      - .github/workflows/test-alb-bindings.yaml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - name: Build application chart dependencies
        run: |
          helm repo add blockscout https://blockscout.github.io/helm-charts
          for chart in blockscout frontends l2-reth proof-coordinator tso-service; do
            helm dependency build "charts/$chart" --skip-refresh
          done
      - run: python3 -m unittest discover -s .github/tests -p test_existing_alb.py -v
      - run: python3 -m unittest discover -s charts/frontends/tests -v
      - run: python3 -m unittest discover -s examples/tests -p test_blockscout_frontend.py -v

name: Test existing ALB bindings
on:
  pull_request:
    paths:
      - charts/alb-bindings/**
      - examples/Makefile.example
      - .github/workflows/test-alb-bindings.yaml
  push:
    paths:
      - charts/alb-bindings/**
      - examples/Makefile.example
      - .github/workflows/test-alb-bindings.yaml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: helm lint --strict charts/alb-bindings -f charts/alb-bindings/ci/render-values.yaml
      - run: python3 -m unittest discover -s charts/alb-bindings/tests

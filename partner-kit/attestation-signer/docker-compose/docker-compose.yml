# Partner-operated DogeOS attestation-signer (docker-compose reference
# deployment). See ../README.md for the full runbook.
#
# Files expected next to this compose file:
#   attestation-signer.env  — key backend, network, and optional production
#                             release pins; generated by scripts/init-keys.sh
#                             or the CLI-assisted signer init workflow
#   attestation-signer.toml — partner-owned V2 RPC trust domains and rotation
#                             allowlists; generated once by signer init
#   transport.key           — SECRET 32-byte hex transport key (mode 0600),
#                             created once by scripts/init-keys.sh or Phase A;
#                             signs every request this signer sends to the TSO
#   signer-policy.env       — post-genesis policy bundle from the bridge
#                             operator (mode, context, artifact origin, verifier)
#   policy/                 — canonical context and optional production AggVK
services:
  attestation-signer:
    # SIGNER_IMAGE accepts an approved immutable repo@sha256 reference.
    image: ${SIGNER_IMAGE:-dogeos69/attestation-signer:${ATTESTATION_SIGNER_IMAGE_TAG:-v0.3.0-beta.6}}
    command: ["-c", "/etc/dogeos-partner/attestation-signer.toml"]
    restart: unless-stopped
    env_file:
      - attestation-signer.env
      - signer-policy.env
    environment:
      PORT: "4040"
      # Metrics-only listener. It deliberately does not expose POST /sign.
      ATTESTATION_SIGNER_METRICS_PORT: "9100"
      ATTESTATION_SIGNER_DB_PATH: /app/data/attestation-signer.sqlite
    ports:
      # Pull delivery: the signer dials out to the TSO and accepts nothing
      # inbound. 4040 stays on loopback for local preflight only.
      # Set these host ports to 0 for an OS-assigned port when old/new signers
      # coexist. Discover it with `docker compose port attestation-signer 4040`.
      - "127.0.0.1:${SIGNER_HTTP_PORT:-4040}:4040"
      # Local monitoring by default; remote scrapes are an explicit private-network choice.
      - "127.0.0.1:${SIGNER_METRICS_PORT:-9100}:9100"
    volumes:
      - signer-data:/app/data
      - ./attestation-signer.toml:/etc/dogeos-partner/attestation-signer.toml:ro
      # ATTESTATION_SIGNER_TSO_TRANSPORT_KEY_FILE in attestation-signer.env.
      - ./transport.key:/etc/dogeos-partner/transport.key:ro
      - ./policy:/etc/dogeos:ro
    healthcheck:
      # The image ships no curl; bash /dev/tcp + $PORT keeps this correct
      # regardless of the container port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-4040}; printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  signer-data:

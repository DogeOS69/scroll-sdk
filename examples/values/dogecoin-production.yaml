replicaCount: 1

# Recreate updates wait for the old Pod to exit; allow chainstate/wallet flushes.
# Tune from observed shutdown time. This is a maximum, not a startup delay.
terminationGracePeriodSeconds: 300

# No fixed startup delay: a fast regtest node can become ready immediately.
# Startup/readiness use local authenticated getblockchaininfo (not full sync).
# Liveness checks the RPC socket only after startup succeeds, avoiding IBD restarts.
probes:
  startup:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 720  # About 1 hour for loading/reindexing; increase if needed.
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

fullnameOverride: dogecoin

dogecoinConf:
  rpcuser: user
  testnet: 1
  txindex: 1
  server: 1
  disablewallet: 0
  rpcworkqueue: 256
  rpcallowip:
    # Option 1: Allow all (NOT recommended for production)
    - 0.0.0.0/0
  # ZMQ configuration for real-time blockchain data streaming
  zmqpubrawblock: "tcp://0.0.0.0:28332"
  zmqpubrawtx: "tcp://0.0.0.0:28333"
  zmqpubhashtx: "tcp://0.0.0.0:28334"
  zmqpubhashblock: "tcp://0.0.0.0:28335"

service:
  port: 44556             # 44556 for testnet, 22556 for mainnet
  rpcPort: 44555          # 44555 for testnet, 22555 for mainnet
  # ZMQ ports for real-time blockchain data streaming
  zmqRawBlockPort: 28332
  zmqRawTxPort: 28333
  zmqHashTxPort: 28334
  zmqHashBlockPort: 28335

# Resource configuration
resources:
  requests:
    memory: "16Gi"
    cpu: "500m"
  limits:
    memory: "30Gi"
    cpu: "2000m"

# Storage
storage:
  # Set this only when a single-replica deployment must reuse an existing synced datadir PVC.
  # For example, use dogecoin-testnet-data when migrating an old dogecoin-testnet release.
  existingClaim: ""
  size: 100Gi             # Should be > 200Gi for mainnet
  retainPvcOnUninstall: true
# Internal access by default. Enable ingress only for an explicit operator choice.
ingress:
  enabled: false
  className: alb
  tls: [] # Override the legacy packaged chart TLS Secret default.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # JSON-RPC GET may return 400/401/405; 5xx and timeouts remain unhealthy.
    alb.ingress.kubernetes.io/success-codes: "200-499"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: <TODO>
  hosts:
  - host: dogecoin.testnet.dogeos.com
    paths:
    - path: /
      pathType: Prefix

externalSecrets:
  dogecoin-secret-env:
    provider: aws
    serviceAccount: external-secrets
    refreshInterval: 2m
    data:
      - remoteRef:
          key: scroll/dogecoin-production/rpc-credentials
          property: DOGECOIN_RPC_PASSWORD
        secretKey: password

# Devnet/staging template. `scrollsdk setup prep-charts` expands the instance
# placeholder into one values file per attestation key.
#
# `scrollsdk setup proof-config` rewrites the proof projection here and in every
# expanded instance file: envelopePolicy.allowedProofTriples is derived from the
# released program manifests, envelopePolicy.maxProofArtifacts is raised to a
# working cap when still at the deny-by-default 0, and proofArtifact.fetchMode
# is switched to http. Re-run `make install-attestation-signers` afterwards.

image:
  repository: dogeos69/attestation-signer
  pullPolicy: IfNotPresent
  tag: latest # Pin to a release tag for shared environments.

attestationSigner:
  profile: staging-local
  network: testnet
  port: 4040
  logFilter: info,attestation_signer=info
  tso:
    url: http://tso-service:3000
    callbackPhase: attestation
  database:
    path: /app/data/attestation-signer.sqlite
  local:
    wifSecretRef:
      key: ATTESTATION_SIGNER_WIF
  envelopePolicy:
    maxProofArtifacts: 4
    allowedProofTriples: ""
  proofArtifact:
    fetchMode: disabled

persistence:
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    # Per signer. The durable audit DB grows without automatic retention.
    size: 5Gi
    retain: true

externalSecrets:
  # Logical key only. The Chart renders the Kubernetes SecretStore,
  # ExternalSecret, and target Secret as <release-fullname>-env.
  signer-env:
    provider: aws
    data:
      - remoteRef:
          key: dogeos/attestation-signer-__INSTANCE_INDEX__-env
          property: ATTESTATION_SIGNER_WIF
        secretKey: ATTESTATION_SIGNER_WIF
    refreshInterval: 2m
    serviceAccount: external-secrets
    secretRegion: us-west-2

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m

serviceMonitor:
  main:
    enabled: false

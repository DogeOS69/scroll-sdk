grafana:
  # Email requires an SMTP transport. Create grafana-smtp with keys user and
  # password, then uncomment smtp below and smtp settings in grafana.ini.
  # smtp:
  #   existingSecret: grafana-smtp
  grafana.ini:
    # smtp:
    #   enabled: true
    #   host: smtp.example.com:587
    #   from_address: alerts@example.com
    #   from_name: Scroll Monitor
    #   startTLS_policy: MandatoryStartTLS
    server:
      domain: grafana.scrollsdk
      root_url: "https://grafana.scrollsdk"
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    size: 10Gi
    annotations:
      "helm.sh/resource-policy": keep

# Application alerts are editable in Grafana. Configure Slack and email in
# Alerting > Contact points, using the built-in Grafana Alertmanager.
dashboards:
  bundled:
    enabled: true
grafanaAlerting:
  enabled: true
prometheusRules:
  enabled: true # Fallback when Grafana alerting is disabled.

# Balance settings consumed by the configuration generator. Public addresses
# and RPC URLs become SCROLL_BALANCE_* environment variables in the exporter.
# No private key is required. Replace <TODO> before deployment.
balanceMonitoring:
  enabled: true
  feeWallet:
    enabled: true
    minimumDoge: 100
    jobRegex: ".*withdrawal-processor.*"
  ethereum:
    feeOracle:
      address: "<TODO>"
      rpcUrl: http://l2-rpc:8545
      expectedChainId: "" # Set to the deployed L2 chain ID.
      minimumEth: 5
    ethDaSubmitter:
      address: "<TODO>"
      rpcUrl: "<TODO>" # Same Ethereum network used for DA publication.
      expectedChainId: "" # Set to that Ethereum network's chain ID.
      minimumEth: 0.1
  exporter:
    enabled: true
    envFromSecret: "" # Optional Secret with SCROLL_BALANCE_* keys for RPC credentials.

serviceAlerts:
  enabled: true
  paused: true

businessAlerts:
  enabled: true
  # Populate from the active bridge policy for exact per-role quorum checks.
  requiredSignersByRole: {}

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    limits_config:
      retention_period: 14d
    compactor:
      retention_enabled: true
      compaction_interval: 10m
      delete_request_store: filesystem
      retention_delete_delay: 2h
    schemaConfig:
      configs:
        - from: '2024-01-01'
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    persistence:
      enabled: true
      size: 200Gi
      enableStatefulSetAutoDeletePVC: false
      accessModes:
        - ReadWriteOnce
  gateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  read:
    replicas: 0
  backend:
    replicas: 0
  write:
    replicas: 0
  lokiCanary:
    enabled: false
  test:
    enabled: false
  resultsCache:
    enabled: false
  chunksCache:
    enabled: false

alloy:
  alloy:
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 30d
      enableRemoteWriteReceiver: true
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 8Gi
  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  kube-state-metrics:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 300m
        memory: 400Mi
  # Legacy fixed-address Scroll balance-checker rules were retired. Application
  # notifications are configured in Grafana; add only current custom rules here.
  additionalPrometheusRules: []

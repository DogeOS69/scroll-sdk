---
# Production environment overrides for withdrawal-processor.
#
# Application configuration is NOT defined here: it lives in the native
# withdrawal-processor/WithdrawalProcessor.toml, maintained by
# `scrollsdk setup prep-charts`, and is passed to Helm through the generated
# deployment contract. This values file carries only Kubernetes shape, secrets
# wiring, and the proof activation switch.
global:
  nameOverride: withdrawal-processor
  fullnameOverride: withdrawal-processor

image:
  repository: dogeos69/withdrawal-processor
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

# The image entrypoint is retained; args select the checked-in native config.
command: []

# The main API remains on 3000. The external proof-coordinator talks to the
# dedicated WP proof-work authority API on the deployment-standard port 9300.
service:
  main:
    enabled: true
    annotations: {}
    ports:
      http:
        enabled: true
        port: 3000
        targetPort: 3000
        protocol: TCP
      proof-work:
        enabled: true
        port: 9300
        targetPort: 9300
        protocol: TCP

probes:
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz/live, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 2
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz/live, port: http}
      initialDelaySeconds: 0
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 2
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz/ready, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 2

args:
  - --config
  - /app/config/WithdrawalProcessor.toml

# prep-charts embeds the compiler-rendered native TOML here so this values file
# is a complete Helm input. The template only keeps the ConfigMap enabled.
configMaps:
  config:
    enabled: true
    data: {}

# The common chart already checksums generic configMaps (including the main
# TOML). tsoSigners uses a chart-specific ConfigMap, so checksum it explicitly.
podAnnotations:
  checksum/tso-signers: '{{ .Values.tsoSigners | toJson | sha256sum }}'

# CLI-owned proof activation state. `setup prep-charts` updates provingMode,
# preserves enabled unless explicitly activated, and atomically projects both
# into the explicit env entries below. The generic chart does not interpret
# these fields or any proof business semantics.
withdrawalProof:
  enabled: false
  provingMode: production
  # Required by `setup prep-charts`: use `irsa` for EKS, or explicitly use
  # `ambient` only when credentials are supplied by another controlled path.
  # `setup proof-aws-init` records the provisioned role in
  # `.data/proof-aws.json`; `setup prep-charts` projects it below.
  s3AuthMode: irsa

# Proof artifact S3 access is fail-closed in IRSA mode until a real role ARN
# is supplied. This identity is independent from proof activation.
serviceAccount:
  create: true
  name: withdrawal-processor
  annotations: {}

env:
  # CLI-owned atomic proof activation projection. Default posture is disabled;
  # setup prep-charts replaces the proof-system entries together.
  # The temporary Issue #843 pre-Tsuki direct-sign pin is owned by the native
  # WithdrawalProcessor.toml managed block, not by a partial Figment env table.
  - name: DOGEOS_WITHDRAWAL_PROOF_SYSTEM__MODE
    value: "disabled"
  - name: DOGEOS_WITHDRAWAL_PROOF_SYSTEM__REQUIRE_SCROLL_EXECUTION
    value: "false"
  - name: DOGEOS_WITHDRAWAL_PROOF_SYSTEM__REQUIRE_BRIDGE_STATE
    value: "false"
  # Logging
  - name: RUST_LOG
    value: "info,withdrawal_processor=info"

envFrom:
  - secretRef:
      name: withdrawal-processor-secret-env

externalSecrets:
  withdrawal-processor-secret-env:
    provider: aws
    secretRegion: "<TODO>" # Region of the service credentials, not the KMS key.
    data:
      - remoteRef:
          key: dogeos/withdrawal-processor
          property: DOGEOS_WITHDRAWAL_DOGECOIN_RPC_USER
        secretKey: DOGEOS_WITHDRAWAL_DOGECOIN_RPC_USER
      - remoteRef:
          key: dogeos/withdrawal-processor
          property: DOGEOS_WITHDRAWAL_DOGECOIN_RPC_PASS
        secretKey: DOGEOS_WITHDRAWAL_DOGECOIN_RPC_PASS
      - remoteRef:
          key: dogeos/withdrawal-processor
          property: DOGEOS_WITHDRAWAL_FEE_SIGNER_KEY
        secretKey: DOGEOS_WITHDRAWAL_FEE_SIGNER_KEY
      - remoteRef:
          key: dogeos/withdrawal-processor
          property: DOGEOS_WITHDRAWAL_SEQUENCER_SIGNER_KEY
        secretKey: DOGEOS_WITHDRAWAL_SEQUENCER_SIGNER_KEY
    refreshInterval: 2m
    serviceAccount: external-secrets
  # Keep compiler/proof-owned tokens separate from ordinary service secrets:
  # push-secrets must not manage them, and their AWS regions may differ.
  withdrawal-proof-token:
    provider: aws
    secretRegion: "<TODO>" # prep-charts projects .data/proof-aws.json.
    data:
      # Same remote secret/property as proof-coordinator; prep-charts replaces
      # the conventional path below with the provisioned proof secret name.
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: proof-work-token
        secretKey: proof-work-token
    refreshInterval: 2m
    serviceAccount: external-secrets
# TSO Signers Configuration for local K8s testing
# This will be used by the Helm template to create a ConfigMap
# which is then mounted as /app/config/signers.toml
tsoSigners:
  - network: "<TODO>"
    uri: "http://cubesigner-signer:3000"
    role: "Correctness"
    # prep-charts derives the canonical compressed key from doge-config. It is
    # required by the production bridge-proof-reference transport.
    publicKeyOverride: "<TODO>"
    signatureMode: "ecdsa"

# Persistence Configuration
persistence:
  # The compiler uses bearer_token_file. Do not also inject bearer_token via env.
  proof-work-token:
    enabled: true
    type: secret
    name: withdrawal-proof-token
    mountPath: /app/secrets/proof-work-token
    subPath: proof-work-token
    readOnly: true
  data:
    enabled: true
    name: withdrawal-processor-data-pvc # Ensure this aligns with your PVC naming strategy
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    annotations: {}
    size: 1000Gi
    retain: true
    # storageClass: "your-production-storage-class" # FIXME: Uncomment and set if you use a specific storage class for production
  protocol-context:
    enabled: true
    type: configMap
    name: protocol-context-config
    mountPath: /app/protocol_context.json
    subPath: protocol_context.json
    items:
      - key: protocol_context.json
        path: protocol_context.json
    readOnly: true
  withdrawal-processor-config:
    enabled: true
    type: configMap
    name: '{{ include "withdrawal-processor.fullname" . }}-config'
    mountPath: /app/config/WithdrawalProcessor.toml
    subPath: WithdrawalProcessor.toml
    items:
      - key: WithdrawalProcessor.toml
        path: WithdrawalProcessor.toml
    readOnly: true
  tso-signers-config:
    enabled: true
    type: configMap
    name: "{{ include \"withdrawal-processor.fullname\" . }}-tso-signers"
    mountPath: /app/config/signers.toml
    subPath: signers.toml
    items:
      - key: signers.toml
        path: signers.toml
    readOnly: true

# Resource configuration for production
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1500m"

serviceMonitor:
  main:
    enabled: true
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 1m
        scrapeTimeout: 10s

defaultProbes:
  enabled: false

# `tsoSigners` is rendered by the chart as /app/config/signers.toml. The Rust
# loader merges that file after the main WithdrawalProcessor.toml.
# Database: the current binary uses SqliteConnection, not PostgreSQL.
# Keep database_url (or DOGEOS_WITHDRAWAL_DATABASE_URL) on the /app/data PVC;
# changing the URL cannot switch the binary to a PostgreSQL backend.

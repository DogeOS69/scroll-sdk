# Production proof-coordinator values. `scrollsdk setup prep-charts` validates
# released proof artifacts and updates only the marked verifier block in
# proof-coordinator/ProofCoordinator.toml.
global:
  nameOverride: proof-coordinator
  fullnameOverride: proof-coordinator

proofCoordinator:
  config:
    content: ""
    existingConfigMap: ""
    key: ProofCoordinator.toml
    required: true

# The generated deployment contract supplies the native config at deploy time.
image:
  repository: dogeos69/proof-coordinator
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

# Application process and arguments are deployment policy. Keep them in the
# production values rather than introducing a chart revision for this rollout.
command:
  - sh
  - -ec
  - exec proof-coordinator --config /app/conf/ProofCoordinator.toml

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 9400
        targetPort: 9400
        protocol: TCP

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /readyz, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz, port: http}
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24

persistence:
  config:
    enabled: true
    type: configMap
    name: proof-coordinator-config
    mountPath: /app/conf/
    readOnly: true
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    size: 10Gi
    retain: true
  secrets:
    enabled: true
    type: secret
    name: proof-coordinator-secrets
    mountPath: /app/secrets
    readOnly: true
  protocol-context:
    enabled: true
    type: configMap
    name: protocol-context-config
    mountPath: /app/protocol_context.json
    subPath: protocol_context.json
    items:
      - key: protocol_context.json
        path: protocol_context.json
    readOnly: true
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
    sizeLimit: 1Gi

# Deployment policy, not chart behavior. `scrollsdk setup prep-charts`
# replaces this entry with every coordinator-owned writable directory derived
# from ProofCoordinator.toml and validates that all paths stay under /app/data.
initContainers:
  prepare-proof-data-directories:
    image: busybox:1.36.1
    command:
      - /bin/sh
      - -ec
    args:
      - mkdir -p '/app/data/proof-artifacts'
    volumeMounts:
      - name: data
        mountPath: /app/data

serviceAccount:
  create: true
  name: proof-coordinator
  annotations: {}

resources:
  requests: {memory: 256Mi, cpu: 100m}
  limits: {memory: 1Gi, cpu: 500m}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceMonitor:
  main:
    enabled: false

ingress:
  main:
    enabled: false

configMaps:
  config:
    enabled: false
    data: {}

env:
  - name: DOGEOS_PROOF_COORDINATOR_PROTOCOL_CONTEXT_JSON
    value: /app/protocol_context.json
  - name: DOGEOS_PROOF_COORDINATOR_PROOF_WORK_BASE_URL
    value: http://withdrawal-processor:9300
  - name: DOGEOS_PROOF_COORDINATOR_ALLOW_INSECURE_HTTP
    value: "true"
  - name: DOGEOS_PROOF_COORDINATOR_COORDINATOR_ID
    value: proof-coordinator-main
  - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__BUCKET
    value: "<TODO>"
  - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__REGION
    value: us-west-2
  - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__KEY_PREFIX
    value: proof-topology
  # Omit the internal endpoint for AWS regional S3. Uncomment for MinIO or
  # another S3-compatible store.
  # - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__ENDPOINT_URL
  #   value: https://s3-internal.example
  # Public worker/signer endpoint. Uncomment and set for remote workers.
  # - name: DOGEOS_PROOF_COORDINATOR_PROVER_API__PUBLIC_S3_ENDPOINT_URL
  #   value: https://s3-public.example

envFrom: []

externalSecrets:
  secrets:
    provider: aws
    secretRegion: "us-west-2"
    refreshInterval: 2m
    serviceAccount: external-secrets
    data:
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: proof-work-token
        secretKey: proof-work-token
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: prover-worker-token
        secretKey: prover-worker-token

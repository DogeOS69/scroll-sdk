# Production proof-coordinator values. `scrollsdk setup prep-charts` reconciles
# the marked deployment-derived runtime and verifier blocks in
# proof-coordinator/ProofCoordinator.toml while preserving operator-owned
# configuration outside those blocks.
global:
  nameOverride: proof-coordinator
  fullnameOverride: proof-coordinator

proofCoordinator:
  config:
    content: ""
    existingConfigMap: ""
    key: ProofCoordinator.toml
    required: true

# prep-charts embeds the compiler-rendered native config in content above.
image:
  repository: dogeos69/proof-coordinator
  pullPolicy: IfNotPresent
  tag: v0.3.0-beta.6

# Application process and arguments are deployment policy. Keep them in the
# production values rather than introducing a chart revision for this rollout.
command:
  - sh
  - -ec
  - exec proof-coordinator --config /app/conf/ProofCoordinator.toml

service:
  main:
    enabled: true
    ports:
      # Disable the unused HTTP port inherited from the shared chart.
      http:
        enabled: false
        port: 80
        targetPort: 80
        protocol: TCP
      prover:
        enabled: true
        primary: true
        port: 7788
        targetPort: 7788
        protocol: TCP

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz, port: prover}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /readyz, port: prover}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz, port: prover}
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24

persistence:
  config:
    enabled: true
    type: configMap
    name: proof-coordinator-config
    mountPath: /app/conf/
    readOnly: true
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    # For a fresh-database cutover, provision a new claim and select it here.
    # Never point the new release at an incompatible previous-generation DB.
    # existingClaim: "<TODO_NEW_PROOF_COORDINATOR_PVC>"
  secrets:
    enabled: true
    type: secret
    name: proof-coordinator-secrets
    mountPath: /app/secrets
    readOnly: true
  genesis:
    enabled: true
    type: configMap
    name: genesis-config
    mountPath: /app/genesis/genesis.json
    subPath: genesis.json
    readOnly: true
  protocol-context:
    enabled: true
    type: configMap
    name: protocol-context-config
    mountPath: /app/protocol_context.json
    subPath: protocol_context.json
    items:
      - key: protocol_context.json
        path: protocol_context.json
    readOnly: true
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
    sizeLimit: 1Gi

# dogeos-core owns this fixed layout below the Kubernetes proof data root.
# These paths are deployment conventions, not operator-configurable fields.
initContainers:
  prepare-proof-data-directories:
    image: busybox:1.36.1
    command:
      - /bin/sh
      - -ec
    args:
      - >-
        mkdir -p
        '/app/data/proof-artifacts'
        '/app/data/proof-artifacts/runtime/coordinator-staging'
        '/app/data/proof-artifacts/runtime/bridge-prepared-bundles'
        '/app/data/proof-artifacts/runtime/scroll-batch-materializer-output'
        '/app/data/proof-artifacts/runtime/scroll-chunk-sidecar-scratch'
        '/app/data/proof-artifacts/runtime/scroll-batch-subprocess-scratch'
        '/app/data/proof-artifacts/runtime/scroll-batch-da-cache/blobs'
        '/app/data/proof-artifacts/runtime/bridge-da/blobs'
    volumeMounts:
      - name: data
        mountPath: /app/data

serviceAccount:
  create: true
  name: proof-coordinator
  annotations: {}

resources:
  # Starting allocation for active real witness materialization, including its
  # child processes. Review against workload/backlog rather than idle Pod usage.
  requests: {memory: 1Gi, cpu: 500m}
  limits: {memory: 4Gi, cpu: 2000m}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceMonitor:
  main:
    enabled: false

ingress:
  main:
    # Public Worker access is opt-in; mock generation needs no external Worker.
    # When prover workers run outside the cluster, prep-charts enables this
    # and fills the host, keeping the class and annotations below. Mainnet
    # gives the coordinator its own ALB (no group.name), separate from the
    # TSO's, for independent config, security-group source rules and idle
    # timeout; bearer-token auth still applies.
    # For ingress-nginx, set ingressClassName: nginx and drop the alb.*
    # annotations.
    enabled: false
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/certificate-arn: "<TODO>"
      alb.ingress.kubernetes.io/wafv2-acl-arn: "<TODO>"
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      # The longest-held request is a Worker's result/fail POST: the
      # coordinator answers only after its WP prove call, bounded at 60 s
      # (WP_PROVE_REQUEST_TIMEOUT_MS, dogeos-core proof_coordinator
      # src/prover_api/wp_prove_client.rs), and the Worker allows it 90 s
      # (PROVER_WORKER_COMPLETION_HTTP_TIMEOUT_MS, dogeos_proof_worker_contract
      # src/reliability.rs). Claims are not long-polls. The ALB default (60 s)
      # would cut that request, so idle timeout is above the Worker's 90 s.
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
      # Optional source allowlist for this ALB's security group (comma-separated
      # CIDRs, e.g. the external Workers' egress); unset = open. Bearer-token
      # auth is the access control.
      # alb.ingress.kubernetes.io/inbound-cidrs: ""

configMaps:
  config:
    enabled: false
    data: {}

# The compiler-generated ProofCoordinator.toml owns ALL runtime configuration,
# including coordinator identity, endpoints, S3 and token-file paths. Figment
# environment overrides take precedence and can replace strict nested tables;
# do not duplicate DOGEOS_PROOF_COORDINATOR_* settings here. Configure proof
# intent/proof-aws inputs and rerun prep-charts instead.
env:
  # Keep startup, proof verification and eager locate-hit telemetry available.
  - name: RUST_LOG
    value: info

envFrom: []

externalSecrets:
  secrets:
    provider: aws
    secretRegion: "<TODO>" # prep-charts projects .data/proof-aws.json.
    refreshInterval: 2m
    serviceAccount: external-secrets
    data:
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: proof-work-token
        secretKey: proof-work-token
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: prover-worker-token
        secretKey: prover-worker-token

---
role: bootnode

controller:
  replicas: 1
  strategy: RollingUpdate
  type: statefulset

image:
  repository: dogeos69/rollup-node
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

waitForL1:
  image: scrolltech/scroll-alpine:v0.0.1

env:
  - name: RUST_BACKTRACE
    value: "1"

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "8"
    memory: 32Gi

service:
  main:
    type: ClusterIP
    annotations: {}

reth:
  networkId: "<TODO>"
  l1Url: "http://l1-interface:8545"
  l1LivenessThreshold: "2147483647"
  l1LivenessCheckInterval: "3600"
  blobS3Url: ""
  trustedPeers: ""
  builderGasLimit: "10000000"
  engineSyncAtStartup: "true"
  engineLegacyStateRoot: true
  ipcPath: /tmp/reth.ipc
  ipcPermissions: "0600"
  logFormat: log-fmt
  verbosity: 3
  extraArgs:
    - "--network.legacy-geth-header-transform"
    - "true"

  ports:
    http: 8545
    ws: 8546
    metrics: 6060
    p2p: 30303

  genesis:
    configMapName: genesis-config
    chainPath: /app/genesis/genesis.json
    mountPath: /app/genesis/genesis.json
    subPath: genesis.json

  data:
    size: 1000Gi
    mountPath: /data
    accessMode: ReadWriteOnce
    retain: true

  nodeKey:
    mode: secret

  signer:
    type: none
    awsKmsKeyId: ""
    localFile:
      path: /signer/sequencer-key
      secretName: ""
      secretKey: RETH_SEQUENCER_SIGNER_PRIVATE_KEY

  sequencer:
    enabled: false
    autoStart: true
    allowEmptyBlocks: false
    blockTimeMs: "3000"
    payloadBuildingDurationMs: "800"
    l1InclusionMode: finalized:2
    feeRecipient: "<TODO>"

  rpc:
    trustedOnly: false
    maxOutboundPeers: ""
    maxInboundPeers: ""
    disableTransactionsBackup: false
    rollupNode: false
    rollupNodeAdmin: false
    maxConnections: ""
    maxRequestSize: ""
    maxResponseSize: ""
    maxSubscriptionsPerConnection: ""
    maxBlocksPerFilter: ""
    maxLogsPerResponse: ""
    maxTracingRequests: ""

  http:
    enabled: true
    addr: 0.0.0.0
    corsDomain: "*"
    api: net,web3,rpc,admin,debug,trace,txpool,eth,ots

  ws:
    enabled: false
    addr: 0.0.0.0
    api: net,web3,rpc,admin,debug,trace,txpool,eth,ots

  service:
    # Internal ClusterIP P2P ports on the main Service, for in-cluster peering.
    p2p:
      enabled: true
    extra: {}

  # External P2P is opt-in and off until its activation checklist is complete
  # (charts/l2-reth/README.md, "External P2P (opt-in)"). When enabled, the chart
  # renders one P2P-only internet-facing NLB Service (TCP 30303 only) for pod
  # <fullname>-<ordinal>, on the deployment-owned Elastic IP and reachable only
  # from sourceRanges. To expose this bootnode, set enabled and fill the TODOs.
  p2pExternal:
    enabled: false
    ordinal: 0
    # Approved partner CIDRs, enforced by the NLB security group.
    sourceRanges:
      - "<TODO partner CIDR>"
    allowOpenPeering: false
    # One EIP allocation per subnet, in the same order. The subnet must be in the
    # AZ of this node's EBS volume (or enable cross-zone load balancing).
    subnets:
      - "<TODO subnet-id>"
    eipAllocations:
      - "<TODO eipalloc-id>"
    annotations: {}

serviceMonitor:
  main:
    enabled: true
    labels:
      release: scroll-sdk
    serviceName: '{{ include "scroll.common.lib.chart.names.fullname" $ }}'
    endpoints:
      - port: metrics
        interval: 1m
        scrapeTimeout: 10s
        path: /debug/metrics/prometheus

externalSecrets:
  # Logical local resource key; rendered as <release-fullname>-secret-env.
  secret-env:
    provider: aws
    data:
      - remoteRef:
          key: scroll/l2-reth-bootnode-__INSTANCE_INDEX__-secret-env
          property: RETH_NODEKEY
        secretKey: RETH_NODEKEY
    refreshInterval: 2m
    secretRegion: us-west-2
    serviceAccount: external-secrets

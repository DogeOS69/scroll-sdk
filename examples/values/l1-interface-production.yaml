---
# Production overrides for l1-interface. Deployment-specific fields are filled
# by scrollsdk from DeploymentSpec/doge-config and generated artifacts.
global:
  nameOverride: l1-interface
  fullnameOverride: l1-interface

image:
  repository: dogeos69/l1-interface
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

command:
  - /usr/local/bin/l1_interface

service:
  main:
    enabled: true
    ports:
      jsonrpc: {enabled: true, port: 8545, targetPort: 8545, protocol: TCP}
      beacon: {enabled: true, port: 5052, targetPort: 5052, protocol: TCP}
      http: {enabled: true, port: 9090, targetPort: 9090, protocol: TCP}
      admin: {enabled: true, port: 9091, targetPort: 9091, protocol: TCP}

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /api/v1/health/live, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /api/v1/health/ready, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /api/v1/health/ready, port: http}
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 60

env:
  - name: RUST_LOG
    value: info

configMaps:
  env:
    enabled: true
    data:
      DOGEOS_L1_INTERFACE_NETWORK_STR: "<TODO>"
      DOGEOS_L1_INTERFACE_DATABASE_URL: sqlite:///data/l1-interface.sqlite
      DOGEOS_L1_INTERFACE_API_BIND_ADDRESS: 0.0.0.0:8545
      DOGEOS_L1_INTERFACE_BEACON_API_LISTEN_ADDRESS: 0.0.0.0:5052
      DOGEOS_L1_INTERFACE_HEALTH_LISTEN_ADDRESS: 0.0.0.0:9090
      DOGEOS_L1_INTERFACE_L1_GENESIS_BLOCK: "<TODO>"
      DOGEOS_L1_INTERFACE_L1_GAS_LIMIT: "30000000"
      DOGEOS_L1_INTERFACE_L1_BASE_FEE_PER_GAS: "1000000000"
      DOGEOS_L1_INTERFACE_GENESIS_JSON_PATH: /app/genesis/genesis.json
      DOGEOS_L1_INTERFACE_SEQUENCER_GENESIS_MODE: "false"
      DOGEOS_L1_INTERFACE_DOGECOIN_RPC__URL: http://dogecoin:44555
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__START_HEIGHT: "<TODO>"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__CONFIRMATIONS: "6"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__INDEX_UTXOS: "false"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__INDEX_DEPOSITS: "false"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__POLL_INTERVAL_MS: "10000"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__BRIDGE_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__FEE_WALLET_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__SEQUENCER_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_REPLAY_READ__ENABLED: "true"
      DOGEOS_L1_INTERFACE_REPLAY_READ__SQLITE_PATH: /data/replay.sqlite
      # Host replay compatibility policy. 0 means every P2PKH withdrawal uses
      # the versioned recipient envelope; P2SH is always versioned.
      DOGEOS_L1_INTERFACE_REPLAY_READ__P2PKH_VERSIONED_ENVELOPE_START_WITHDRAW_INDEX: "0"
      DOGEOS_L1_INTERFACE_REPLAY_READ__MAINTAINER_ENABLED: "true"
      DOGEOS_L1_INTERFACE_REPLAY_READ__REQUIRE_FULL_VALIDATION: "false"
      DOGEOS_L1_INTERFACE_REPLAY_READ__PROTOCOL_CONTEXT_JSON: /app/protocol_context.json
      # Cutover/snapshot deployments only; prep-charts fills this from the
      # deployment's first real L2 height when one is configured.
      # DOGEOS_L1_INTERFACE_REPLAY_READ__L2_BOOTSTRAP_NEXT_STARTING_BLOCK_HEIGHT: "<TODO>"

      # Optional pre-genesis event-plane artifact. Configure both fields
      # together and mount the matching SQLite artifact under /data.
      # DOGEOS_L1_INTERFACE_EVENT_PLANE_ARTIFACT_PATH: /data/event-plane.sqlite
      # DOGEOS_L1_INTERFACE_EVENT_PLANE_GENESIS_BOUNDARY: "<TODO>"

      DOGEOS_L1_INTERFACE_ETHEREUM_DA__L1_RPC_URL: "<TODO>"
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__TIMEOUT_MS: "10000"
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__BEACON_NODE__URL: "<TODO>"
      # Optional provider-local timeout; otherwise the parent timeout is used.
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__BEACON_NODE__TIMEOUT_MS: "10000"
      # Additional production providers may be configured alongside Beacon.
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__BLOB_SCAN__URL: "<TODO>"
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__BLOCK_NATIVE__URL: "<TODO>"
      # S3 archive routing is filled by prep-charts when enabled. Timeout and
      # forbidden-as-missing remain template/operator policy.
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__AWS_S3__URL: "<TODO>"
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__AWS_S3__KEY_PREFIX: ""
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__AWS_S3__TIMEOUT_MS: "10000"
      # DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__AWS_S3__TREAT_FORBIDDEN_AS_MISSING: "false"

envFrom:
  - secretRef:
      name: l1-interface-secret-env
  - configMapRef:
      name: l1-interface-env

externalSecrets:
  l1-interface-secret-env:
    provider: aws
    data:
      - remoteRef:
          key: dogeos/l1-interface-secret-env
          property: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__USER
        secretKey: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__USER
      - remoteRef:
          key: dogeos/l1-interface-secret-env
          property: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__PASS
        secretKey: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__PASS
    refreshInterval: 2m
    serviceAccount: external-secrets

persistence:
  data:
    enabled: true
    type: pvc
    name: l1-interface-data-pvc
    mountPath: /data
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
  genesis:
    enabled: true
    type: configMap
    name: genesis-config
    mountPath: /app/genesis/genesis.json
    subPath: genesis.json
    items:
      - key: genesis.json
        path: genesis.json
    readOnly: true
  protocol-context:
    enabled: true
    type: configMap
    name: protocol-context-config
    mountPath: /app/protocol_context.json
    subPath: protocol_context.json
    items:
      - key: protocol_context.json
        path: protocol_context.json
    readOnly: true

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

serviceMonitor:
  main:
    enabled: true
    endpoints:
      - port: http
        scheme: http
        path: /api/v1/metrics
        interval: 10s
        scrapeTimeout: 5s

---
# Production overrides for l1-interface. Deployment-specific fields are filled
# by scrollsdk from DeploymentSpec/doge-config and generated artifacts.
image:
  repository: dogeos69/l1-interface
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

env:
  - name: RUST_LOG
    value: info

configMaps:
  env:
    enabled: true
    data:
      DOGEOS_L1_INTERFACE_NETWORK_STR: "<TODO>"
      DOGEOS_L1_INTERFACE_DATABASE_URL: sqlite:///data/l1-interface.sqlite
      DOGEOS_L1_INTERFACE_API_BIND_ADDRESS: 0.0.0.0:8545
      DOGEOS_L1_INTERFACE_BEACON_API_LISTEN_ADDRESS: 0.0.0.0:5052
      DOGEOS_L1_INTERFACE_HEALTH_LISTEN_ADDRESS: 0.0.0.0:9090
      DOGEOS_L1_INTERFACE_L1_GENESIS_BLOCK: "<TODO>"
      DOGEOS_L1_INTERFACE_L2_MOAT_CONTRACT_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_L2_MESSENGER_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_L1_GAS_LIMIT: "30000000"
      DOGEOS_L1_INTERFACE_L1_BASE_FEE_PER_GAS: "1000000000"
      DOGEOS_L1_INTERFACE_GENESIS_JSON_PATH: /app/genesis/genesis.json
      DOGEOS_L1_INTERFACE_SEQUENCER_GENESIS_MODE: "false"
      DOGEOS_L1_INTERFACE_DOGECOIN_RPC__URL: http://dogecoin:44555
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__START_HEIGHT: "<TODO>"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__CONFIRMATIONS: "6"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__INDEX_UTXOS: "false"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__INDEX_DEPOSITS: "false"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__POLL_INTERVAL_MS: "10000"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__BRIDGE_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__FEE_WALLET_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_DOGECOIN_INDEXER__SEQUENCER_ADDRESS: "<TODO>"
      DOGEOS_L1_INTERFACE_REPLAY_READ__ENABLED: "true"
      DOGEOS_L1_INTERFACE_REPLAY_READ__SQLITE_PATH: /data/replay.sqlite
      DOGEOS_L1_INTERFACE_REPLAY_READ__MAINTAINER_ENABLED: "true"
      DOGEOS_L1_INTERFACE_REPLAY_READ__REQUIRE_FULL_VALIDATION: "false"
      DOGEOS_L1_INTERFACE_REPLAY_READ__PROTOCOL_CONTEXT_JSON: /app/protocol_context.json
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__L1_RPC_URL: "<TODO>"
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__ETH_CHAIN_ID: "<TODO>"
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__L2_CHAIN_ID: "<TODO>"
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__TIMEOUT_MS: "10000"
      DOGEOS_L1_INTERFACE_ETHEREUM_DA__BLOB_SOURCE__BEACON_NODE__URL: "<TODO>"

envFrom:
  - secretRef:
      name: l1-interface-secret-env
  - configMapRef:
      name: l1-interface-env

externalSecrets:
  l1-interface-secret-env:
    provider: aws
    data:
      - remoteRef:
          key: dogeos/l1-interface-secret-env
          property: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__USER
        secretKey: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__USER
      - remoteRef:
          key: dogeos/l1-interface-secret-env
          property: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__PASS
        secretKey: DOGEOS_L1_INTERFACE_DOGECOIN_RPC__PASS
    refreshInterval: 2m
    serviceAccount: external-secrets

persistence:
  data:
    enabled: true
    type: pvc
    name: l1-interface-data-pvc
    mountPath: /data
    size: 100Gi
    retain: true
  genesis:
    enabled: true
    type: configMap
    name: genesis-config
    mountPath: /app/genesis/genesis.json
    subPath: genesis.json
    readOnly: true
  protocol-context:
    enabled: true
    type: configMap
    name: protocol-context-config
    mountPath: /app/protocol_context.json
    subPath: protocol_context.json
    readOnly: true

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

# Generated worker command and policy come from setup prep-charts (or setup render).
# Installing this independent release can allocate paid GPUs; install-all excludes it.
fullnameOverride: capacity-manager
prepared: false
image:
  repository: dogeos69/capacity-manager
  # TODO: digest of a capacity-manager image that includes dogeos-core #1598
  # (--worker-credential-master-file). develop-50653e7b predates it; the
  # placeholder fails preparation instead of starting an incompatible manager.
  digest: "<TODO>"
wpAuth:
  existingSecret: proof-coordinator-secrets
  key: proof-work-token
dstackAuth:
  existingSecret: dstack-controller-auth
  key: admin-token
persistence:
  size: 1Gi
  retain: true
manager:
  scaleDownOnShutdown: false

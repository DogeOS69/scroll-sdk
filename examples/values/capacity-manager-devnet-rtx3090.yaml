  policy: |
    # Continuous full-mode, one Vast RTX3090 worker; estimates remain provisional.
    # Chunk estimate uses observed DevNet parent totals; other families remain provisional.
    [global]
    target_drain_seconds = 600
    liveness_floor = 1
    steady_state_floor = 1
    max_workers = 1
    scale_down_ttl_seconds = 300

    [pool]
    provider = "vastai"
    gpu_class = "RTX3090"
    vram_gib = 24
    max_workers = 1
    hourly_cost_usd_per_worker = 0.8
    max_hourly_cost_usd = 0.8
    provider_diversity_min = 1

    [families.scroll_chunk]
    runtime_seconds = 240
    min_workers = 0
    max_workers = 1
    min_vram_gib = 16

    [families.scroll_batch]
    runtime_seconds = 300
    min_workers = 0
    max_workers = 1
    min_vram_gib = 16

    [families.l2_range_aggregation]
    runtime_seconds = 1800
    min_workers = 0
    max_workers = 1
    min_vram_gib = 16

    [families.bridge_state]
    runtime_seconds = 1800
    min_workers = 0
    max_workers = 1
    min_vram_gib = 16
  pollIntervalMs: 10000
  provisioningTimeoutSeconds: 780
  failureCooldownSeconds: 120
  scaleDownOnShutdown: true
  dstack:
    serverUrl: https://dstack.devnet.doge.xyz
    project: main
    fleets:
    - devnet-capacity-manager-active-rtx3090
    regions:
    - nl-thenetherlands
    instanceTypes:
    - '55816748'
    maxPricePerHourUsd: 0.8
# Recorded pre-dogeos-core #1591 snapshot: legacy shared worker token. Migrate
# to workerCredentialMaster with a #1598 manager image during the master
# rotation (see ../capacity-manager.md#worker-credentials).
workerCredentialMaster: null
wpAuth:
  existingSecret: devnet-capacity-manager-active-wp-token
  key: proof-work-token
dstackAuth:
  existingSecret: dstack-controller-auth
  key: admin-token
persistence:
  existingClaim: devnet-capacity-manager-active-state
  size: 1Gi
  storageClass: gp3
  retain: true
terminationGracePeriodSeconds: 1800
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

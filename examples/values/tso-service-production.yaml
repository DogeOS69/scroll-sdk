global:
  nameOverride: tso-service
  fullnameOverride: tso-service

image:
  repository: dogeos69/tso-service
  pullPolicy: IfNotPresent
  tag: v0.3.0-beta.6

service:
  main:
    enabled: true
    ports:
      http: {enabled: true, port: 3000, targetPort: 3000, protocol: TCP}

# The current TSO binary exposes /health, not a separate /ready endpoint.
probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /health, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /health, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /health, port: http}
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 12

env:
  - name: PORT
    value: "3000"
  - name: DOGE_NETWORK
    value: "testnet"
  - name: WITHDRAWAL_PROCESSOR_URL
    value: "http://withdrawal-processor:3000"
  - name: TIMEOUT_CHECK_INTERVAL_SECONDS
    value: "60"
  # Keep both TSO PSBT admission paths aligned with the tested large-PSBT
  # deployment capacity. The Ingress limit below includes additional room for
  # the complete JSON callback body.
  - name: TSO_CORRECTNESS_MAX_PSBT_BASE64_LEN
    value: "4194304"
  - name: TSO_CUBESIGNER_MAX_PSBT_BASE64_LEN
    value: "4194304"
  # dogeos-core requires the transaction journal path explicitly. This path
  # must survive Pod restarts; do not place it on the container filesystem.
  - name: TSO_JOURNAL_DB_PATH
    value: "/app/data/tso-journal/tso_journal.sqlite3"
  # Temporary Issue #843 testnet recovery only. Do not enable by default.
  # scrollsdk prep-charts adds/removes this from deployment proof intent and
  # binds the same reviewed height in WP and the Rust signer policy bundle.
  # - name: TSO_PRE_TSUKI_DIRECT_SIGN_MAX_END_BATCH_HEIGHT
  #   value: "<TSUKI_BOUNDARY_L2_BATCH_HEIGHT>"
  - name: RUST_LOG
    value: "debug"

ingress:
  main:
    # Public edge for external signers: /health and the transport-signed
    # /signer/* routes only (poll, submit-attestation-signatures,
    # reject-signatures). /propose, /register-*, /status, /metrics and the
    # unprefixed callbacks stay in-cluster. prep-charts fills the host.
    #
    # Mainnet uses its own AWS ALB (AWS Load Balancer Controller; no
    # group.name), separate from the proof coordinator's, for independent
    # config, security-group source rules and idle timeout. TLS from ACM;
    # optional WAF web ACL with a per-IP rate rule (oversize handling =
    # continue, see the chart README). ALB has no request-body limit of its
    # own; the TSO's 4 MiB application limit applies. To use ingress-nginx instead, set
    # ingressClassName: nginx, replace the alb.* annotations with
    #   nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # (plus cert-manager.io/cluster-issuer), and add tls[0].secretName.
    enabled: true
    primary: true
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/certificate-arn: "<TODO>"
      alb.ingress.kubernetes.io/wafv2-acl-arn: "<TODO>"
      alb.ingress.kubernetes.io/healthcheck-path: /health
      # Optional source allowlist for this ALB's security group (comma-separated
      # CIDRs); unset = open. The TSO's security is the signed requests, not the
      # allowlist: operators may have no static IPs.
      # alb.ingress.kubernetes.io/inbound-cidrs: ""
    labels: {}
    ingressClassName: "alb"
    hosts:
      - host: ""
        paths:
          - path: /health
            pathType: Exact
          - path: /signer
            pathType: Prefix

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# scroll-monitor owns the default TSO metrics scrape. Enable this only when
# its additionalServiceMonitors.tso entry is disabled.
serviceMonitor:
  main:
    enabled: false
    endpoints:
      - {port: http, scheme: http, path: /metrics, interval: 1m, scrapeTimeout: 10s}

persistence:
  journal:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /app/data/tso-journal
    # Preserve accepted signing work across an accidental Helm uninstall.
    retain: true

defaultProbes:
  enabled: false

# Restrict the unauthenticated TSO API port to the pods that legitimately call
# it. Replace the placeholder selectors with your own labels.
# Opt in after configuring monitoring and every ingress caller. Beta.6
# serves metrics on the API port; a monitoring peer can reach all API routes.

networkPolicy:
  enabled: false
  port: 3000
  allowFrom:
    withdrawalProcessor:
      - podSelector: {matchLabels: {app.kubernetes.io/name: withdrawal-processor}}
    signers:
      - podSelector: {matchLabels: {app.kubernetes.io/name: cubesigner-signer}}
    # ALB target-type ip: the ALB connects from its subnets. List each public
    # subnet CIDR the ALB uses (ingress-nginx: its pods instead).
    edge:
      - ipBlock: {cidr: "<TODO>"}
    operators: []
    monitoring: []   # Prometheus peers can reach every route on the API port

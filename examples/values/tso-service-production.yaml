image:
  repository: dogeos69/tso-service
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

env:
  - name: PORT
    value: "3000"
  - name: DOGE_NETWORK
    value: "testnet"
  - name: WITHDRAWAL_PROCESSOR_URL
    value: "http://withdrawal-processor:3000"
  - name: TIMEOUT_CHECK_INTERVAL_SECONDS
    value: "60"
  - name: TSO_CORRECTNESS_MAX_PSBT_BASE64_LEN
    value: "130048"
  - name: TSO_CUBESIGNER_MAX_PSBT_BASE64_LEN
    value: "130048"
  # Temporary Issue #843 testnet recovery only. Do not enable by default.
  # scrollsdk prep-charts adds/removes this from deployment proof intent and
  # binds the same reviewed height in WP and the Rust signer policy bundle.
  # - name: TSO_PRE_TSUKI_DIRECT_SIGN_MAX_END_BATCH_HEIGHT
  #   value: "<TSUKI_BOUNDARY_L2_BATCH_HEIGHT>"
  - name: RUST_LOG
    value: "debug"

ingress:
  main:
    ingressClassName: "nginx"
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

serviceMonitor:
  main:
    enabled: true

defaultProbes:
  enabled: false

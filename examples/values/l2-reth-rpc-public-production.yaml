---
role: rpc

controller:
  replicas: 1
  strategy: RollingUpdate
  type: statefulset

image:
  repository: dogeos69/rollup-node
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

waitForL1:
  image: scrolltech/scroll-alpine:v0.0.1

nodeKeyGenerator:
  image: scrolltech/scroll-alpine:v0.0.1

env:
  - name: RUST_BACKTRACE
    value: "1"

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "8"
    memory: 32Gi

service:
  main:
    type: ClusterIP
    annotations: {}

reth:
  networkId: "<TODO>"
  l1Url: "http://l1-interface:8545"
  l1LivenessThreshold: "2147483647"
  l1LivenessCheckInterval: "3600"
  blobS3Url: ""
  trustedPeers: "<TODO>"
  builderGasLimit: "10000000"
  engineSyncAtStartup: "true"
  engineLegacyStateRoot: true
  ipcPath: /tmp/reth.ipc
  ipcPermissions: "0600"
  logFormat: log-fmt
  verbosity: 3
  extraArgs:
    - "--network.legacy-geth-header-transform"
    - "true"

  ports:
    http: 8545
    ws: 8546
    metrics: 6060
    p2p: 30303

  genesis:
    configMapName: genesis-config
    chainPath: /app/genesis/genesis.json
    mountPath: /app/genesis/genesis.json
    subPath: genesis.json

  data:
    size: 1000Gi
    mountPath: /data
    accessMode: ReadWriteOnce
    retain: true

  nodeKey:
    mode: pvcAutoGenerate
    path: /keys/nodekey
    generatedPath: /data/nodekey
    secretName: ""
    secretKey: RETH_NODEKEY

  signer:
    type: none
    awsKmsKeyId: ""
    localFile:
      path: /signer/sequencer-key
      secretName: ""
      secretKey: RETH_SEQUENCER_SIGNER_PRIVATE_KEY

  sequencer:
    enabled: false
    autoStart: true
    allowEmptyBlocks: false
    blockTimeMs: "3000"
    payloadBuildingDurationMs: "800"
    l1InclusionMode: finalized:2
    feeRecipient: "<TODO>"

  rpc:
    trustedOnly: false
    maxOutboundPeers: ""
    maxInboundPeers: ""
    disableTransactionsBackup: false
    rollupNode: true
    rollupNodeAdmin: false
    maxConnections: ""
    maxRequestSize: ""
    maxResponseSize: ""
    maxSubscriptionsPerConnection: ""
    maxBlocksPerFilter: ""
    maxLogsPerResponse: ""
    maxTracingRequests: ""

  http:
    enabled: true
    addr: 0.0.0.0
    corsDomain: "*"
    api: eth,net,web3,rpc

  ws:
    enabled: true
    addr: 0.0.0.0
    api: eth,net,web3,rpc

  service:
    p2p:
      enabled: false
    extra: {}

ingress:
  main:
    enabled: true
    primary: true
    annotations: {}
    labels: {}
    ingressClassName: nginx
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
  websocket:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
            service:
              port: 8546

serviceMonitor:
  main:
    enabled: true
    labels:
      release: scroll-sdk
    serviceName: '{{ include "l2-reth.serviceName" $ }}'
    endpoints:
      - port: metrics
        interval: 1m
        scrapeTimeout: 10s
        path: /debug/metrics/prometheus

externalSecrets: {}

---
global:
  fullnameOverride: l1-devnet

network:
  chainId: 32382
  networkId: 32382

storageClass: local-path

genesis:
  storage: 2Gi

geth:
  storage: 20Gi
  resources:
    limits:
      memory: "4Gi"
      cpu: "2"
    requests:
      memory: "1Gi"
      cpu: "500m"

lighthouse:
  storage: 20Gi
  readinessProbe:
    timeoutSeconds: 10
  resources:
    limits:
      memory: "4Gi"
      cpu: "2"
    requests:
      memory: "1Gi"
      cpu: "500m"

validator:
  resources:
    limits:
      memory: "2Gi"
      cpu: "1"
    requests:
      memory: "512Mi"
      cpu: "250m"

ingress:
  main:
    # Internal devnet clients use the Service; enable only for public access.
    enabled: false
    ingressClassName: alb
    hosts:
    - host: ''
      paths:
      - path: /
        pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      # JSON-RPC GET may return 400/401/405; 5xx and timeouts remain unhealthy.
      alb.ingress.kubernetes.io/success-codes: "200-499"
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: <TODO>

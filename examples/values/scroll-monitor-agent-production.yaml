# Install this chart independently only when Grafana, Prometheus, and Loki are
# managed by another Helm release. These short Service names assume the agent
# and backends run in the same namespace. For cross-namespace deployments, use
# names such as loki.monitoring.svc.cluster.local.
logs:
  enabled: true
  namespaces: []
  podLabels: {}
  loki:
    url: http://loki:3100/loki/api/v1/push
    tenantId: "1"

metrics:
  otlp:
    enabled: true
  prometheusRemoteWrite:
    url: http://prometheus-prometheus:9090/api/v1/write
    jobPrefix: scroll-sdk

alloy:
  alloy:
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m

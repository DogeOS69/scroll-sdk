---
# Example production values for the Ethereum-DA fee oracle.
global:
  nameOverride: fee-oracle
  fullnameOverride: fee-oracle

image:
  repository: dogeos69/fee-oracle
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

command: ["/usr/local/bin/fee_oracle"]
args: []

service:
  main:
    enabled: true
    ports:
      http: {enabled: true, port: 8080, targetPort: 8080, protocol: TCP}
      metrics: {enabled: true, port: 9090, targetPort: 9090, protocol: TCP}

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /health, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /ready, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /ready, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 30

ingress:
  main:
    enabled: false

env:
  - name: RUST_LOG
    value: info

configMaps:
  env:
    enabled: true
    data:
      DOGEOS_FEE_ORACLE_DATABASE__SQLITE_PATH: /data/fee_oracle.db
      DOGEOS_FEE_ORACLE_DATABASE__CONNECTION_POOL_SIZE: "10"
      DOGEOS_FEE_ORACLE_MONITORING__METRICS_PORT: "9090"
      DOGEOS_FEE_ORACLE_MONITORING__HEALTH_CHECK_PORT: "8080"
      DOGEOS_FEE_ORACLE_MONITORING__HEALTH_BIND_ADDRESS: 0.0.0.0
      DOGEOS_FEE_ORACLE_L2__RPC_URL: http://l2-rpc:8545
      DOGEOS_FEE_ORACLE_L2__CHAIN_ID: "<TODO>"
      DOGEOS_FEE_ORACLE_L2__GAS_ORACLE_CONTRACT: "<TODO>"
      DOGEOS_FEE_ORACLE_L2__CONFIRMATIONS: "3"
      DOGEOS_FEE_ORACLE_L2__MAX_GAS_PRICE: "1000000000000"
      DOGEOS_FEE_ORACLE_L2__PRIORITY_FEE: "1000000000"

      # Static Ethereum-DA sampling/write policy. Deployment-specific RPC and
      # signer material are filled by scrollsdk; these policy values remain
      # template-owned and are deliberately not rewritten by prep-charts.
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__CONTRACT_WRITE_MODE: live
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__ETH_RPC_URL: "<TODO>"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__SAMPLE_INTERVAL_SECONDS: "30"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__SAMPLE_STALE_AFTER_SECONDS: "90"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__TARGET_BLOBS_PER_TX: "2"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__MAX_BLOBS_PER_TX: "6"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__EXECUTION_GAS_SOURCE: conceptual_floor
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__EXECUTION_GAS_FLOOR: "21000"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__PRIORITY_FEE_SOURCE: configured_min
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__MIN_PRIORITY_FEE_PER_GAS_WEI: "0"
      # estimate_modes uses the application default:
      # [conservative, expected_configured_target].
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__CONFIRMATION_LAG_BLOCKS: "0"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__PRICES__MIN_SOURCE_QUORUM: "2"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__PRICES__MAX_QUOTE_AGE_SECONDS: "60"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__ADVANCE_L2_ACCOUNTING__ENABLED: "false"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__ORACLE_VALUE_WINDOW_SECONDS: "300"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__ORACLE_VALUE_STAT: median
      # Live mode must hold the first single-sample window.
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__FIRST_VALID_ORACLE_VALUES: hold
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__FORCE_UPDATE_AFTER_SECONDS: "3600"
      # Catastrophic-error ceiling, not a normal-market target. Tune and alert
      # from observed DOGE-denominated values before production rollout.
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__BLOB_FEE_SPIKE_CAP_DOGEWEI_DEC: "500000000000000000"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__RELATIVE_DELTA_THRESHOLD_PPM__BASE_FEE_PER_GAS: "0"
      DOGEOS_FEE_ORACLE_ETHEREUM_DA__UPDATE_POLICY__RELATIVE_DELTA_THRESHOLD_PPM__BLOB_BASE_FEE_PER_BLOB_GAS: "0"

      # Cached quotes must remain strictly younger than MAX_QUOTE_AGE_SECONDS.
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__CACHE_DURATION: "30"
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__KRAKEN_ENABLED: "true"
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__COINBASE_ENABLED: "true"
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__COINGECKO_ENABLED: "false"
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__GATEIO_ENABLED: "true"
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__REQUEST_TIMEOUT: "30"
      DOGEOS_FEE_ORACLE_PRICE_ORACLE__MAX_RETRIES: "3"
      # Optional when COINGECKO_ENABLED=false. Keep the key absent unless a
      # secret-backed API key is intentionally configured.
      # DOGEOS_FEE_ORACLE_PRICE_ORACLE__COINGECKO_API_KEY: "<TODO>"
      DOGEOS_FEE_ORACLE_WALLET__SIGNER_BACKEND: local
      DOGEOS_FEE_ORACLE_WALLET__PRIVATE_KEY_ENV: DOGEOS_FEE_ORACLE_PRIVATE_KEY
      # AWS KMS mode is populated by prep-charts from the managed signer. The
      # local PRIVATE_KEY_ENV entry is removed atomically when these are set.
      # DOGEOS_FEE_ORACLE_WALLET__KMS_KEY_ID: "<TODO>"
      # DOGEOS_FEE_ORACLE_WALLET__KMS_REGION: "<TODO>"
      # DOGEOS_FEE_ORACLE_WALLET__KMS_EXPECTED_ADDRESS: "<TODO>"
      # DOGEOS_FEE_ORACLE_WALLET__KMS_ENDPOINT_URL: "<TODO>"

# Local signer profile. For aws_kms, prep-charts creates this service account
# with the managed signer's IRSA role and removes the private-key Secret and
# envFrom reference below. The KMS key region may differ from the EKS region.
serviceAccount:
  create: false
  name: "" # Use the namespace default in local mode; prep-charts selects KMS SA.
  annotations: {}

envFrom:
  - configMapRef:
      name: fee-oracle-env
  - secretRef:
      name: fee-oracle-secret-env

externalSecrets:
  fee-oracle-secret-env:
    provider: aws
    secretRegion: "<TODO>" # Secrets Manager region, not necessarily KMS_REGION.
    data:
      - remoteRef:
          key: dogeos/fee-oracle-secret-env
          property: DOGEOS_FEE_ORACLE_PRIVATE_KEY
        secretKey: DOGEOS_FEE_ORACLE_PRIVATE_KEY
    refreshInterval: 2m
    serviceAccount: external-secrets

persistence:
  data:
    enabled: true
    type: pvc
    mountPath: /data
    accessMode: ReadWriteOnce
    size: 1Gi
    retain: true

serviceMonitor:
  main:
    enabled: true
    endpoints:
      - {port: metrics, scheme: http, path: /metrics, interval: 30s, scrapeTimeout: 10s}

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: "1"

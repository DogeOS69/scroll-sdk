image:
  repository: dogeos69/scroll-sdk-frontends
  pullPolicy: IfNotPresent
  # Replace with a published Activity-enabled image (scroll-sdk-frontends #16).
  # Older images read REACT_APP_BRIDGE_API_URI and cannot use the history config.
  tag: "TODO_ACTIVITY_TAG_TO_REPLACE"

# Container-only proxy upstream; never an Ethereum RPC or public browser URL.
env:
  L1_INTERFACE_UPSTREAM: l1-interface:9090

persistence:
  frontends:
    enabled: true
    type: configMap
    mountPath: /app/conf/
    name: frontends-config

command:
  - /bin/sh
  - -ec
  - |
    grep -v '^#' /app/conf/frontend-config | awk -F' = ' 'NF==2 {printf "export %s=\"%s\"\n", $1, $2}' | sed 's/""/"/g' > /usr/share/nginx/html/.env
    . /usr/share/nginx/html/.env
    exec /usr/local/bin/entrypoint.sh

ingress:
  main:
    ingressClassName: alb
    hosts:
    - host: portal.scrollsdk
      paths:
      - path: /
        pathType: Prefix
    annotations:
      # Shared with dogeos-bridge-history's /api/history/v1 Ingress (group.order 10),
      # so both rules land on one ALB and the history API is same-origin.
      alb.ingress.kubernetes.io/group.name: <TODO>
      alb.ingress.kubernetes.io/group.order: "100"
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: <TODO>

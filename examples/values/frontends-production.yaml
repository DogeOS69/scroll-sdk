image:
  repository: dogeos69/scroll-sdk-frontends
  pullPolicy: IfNotPresent
  tag: 0.3.0-test.20261011.4

# Container-only proxy upstream; never an Ethereum RPC or public browser URL.
env:
  L1_INTERFACE_UPSTREAM: l1-interface:9090

persistence:
  frontends:
    enabled: true
    type: configMap
    mountPath: /app/conf/
    name: frontends-config

command:
  - /bin/sh
  - -ec
  - |
    grep -v '^#' /app/conf/frontend-config | awk -F' = ' 'NF==2 {printf "export %s=\"%s\"\n", $1, $2}' | sed 's/""/"/g' > /usr/share/nginx/html/.env
    . /usr/share/nginx/html/.env
    exec /usr/local/bin/entrypoint.sh

ingress:
  main:
    enabled: true
    ingressClassName: alb
    hosts:
    - host: portal.scrollsdk
      paths:
      - path: /
        pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: <TODO>

# This file is a deployment template. scrollsdk replaces the image, argv,
# environment, mounts, probes, topology annotation, and replica count from the
# validated dogeos-core compiler contract.
controller:
  replicas: 0
  strategy: Recreate

image:
  repository: dogeos69/prover-worker
  pullPolicy: IfNotPresent
  tag: latest
  digest: ""

automountServiceAccountToken: false
serviceAccount:
  create: true
  name: prover-worker
  annotations: {}

termination:
  gracePeriodSeconds: 420

command: []
args: []
env: []
envFrom: []

podAnnotations: {}
probes:
  liveness: {enabled: false, spec: {}}
  readiness: {enabled: false, spec: {}}
  startup: {enabled: false, spec: {}}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
runtimeClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

configMaps: {}
persistence: {}

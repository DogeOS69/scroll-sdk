# Human-maintained production configuration. scrollsdk only replaces the
# explicitly marked verifier block; all other sections are preserved verbatim.
#
# A first version of this file can be generated from the prepared
# withdrawal-processor values (after prep-charts, no <TODO>s left) with:
#   scrollsdk setup proof-config --scaffold-coordinator-config ...
# The scaffold is only written when this file does not exist yet.
poll_interval_ms = 1000
lease_ttl_ms = 60000

[auth]
bearer_token_file = "/run/secrets/proof-work-token"

[artifact_store]
kind = "s3"
key_prefix = "proof-topology"
force_path_style = false

[materializer]
artifact_store_root = "/app/data/proof-materializer-staging"

[materializer.scroll_chunk_segmentation]
enabled = true

[materializer.scroll_batch]
enabled = true
dev_sentinel = false
materializer_output_root = "/app/data/scroll-batch-materializer"

[materializer.scroll_batch.subprocess]
binary_path = "/usr/local/bin/scroll-runtime-materializer"
statement_namespace_config_path = "/app/data/manifests/statement-namespace.json"
scratch_root = "/app/data/scroll-batch-scratch"
# setup proof-config injects the validated raw commitment through the
# DOGEOS_PROOF_COORDINATOR_* environment overlay.
chunk_program_commitment_hex = "overridden-by-scrollsdk"
l2_rpc_url = "<TODO>"
subprocess_timeout_ms = 3600000

[materializer.scroll_batch.subprocess.ethereum_da]
l1_rpc_url = "<TODO>"
eth_chain_id = 11155111
l2_chain_id = 1
artifact_store_root = "/app/data/scroll-batch-eth-da/blobs"
artifact_metadata_sqlite_path = "/app/data/scroll-batch-eth-da/meta.sqlite"

[materializer.scroll_batch.subprocess.ethereum_da.blob_source]
timeout_ms = 10000

[materializer.scroll_batch.subprocess.ethereum_da.blob_source.aws_s3]
url = "<TODO>"
key_prefix = "<TODO>"

[materializer.bridge]
enabled = true
advance_l1 = true
advance_l2 = true

[materializer.bridge.dogecoin_rpc]
url = "http://dogecoin:22555"
network = "<TODO>"

[materializer.bridge.ethereum_da]
l1_rpc_url = "<TODO>"
eth_chain_id = 11155111
l2_chain_id = 1
artifact_store_root = "/app/data/bridge-eth-da/blobs"
artifact_metadata_sqlite_path = "/app/data/bridge-eth-da/meta.sqlite"

[materializer.bridge.ethereum_da.blob_source]
timeout_ms = 10000

[materializer.bridge.ethereum_da.blob_source.aws_s3]
url = "<TODO>"
key_prefix = "<TODO>"

# BEGIN scrollsdk managed verifier configuration
[verifier]
verifier_import_mode = "production"

[verifier.scroll_chunk_verifier_identity]
expected_proof_system_id = "<AUTO>"
expected_circuit_id = "<AUTO>"
expected_circuit_version = "<AUTO>"
expected_verification_key_hash_hex = "<AUTO>"
expected_program_commitment_hash_hex = "<AUTO>"
program_manifest_path = "/app/data/manifests/scroll-chunk.json"
verifier_id = "<AUTO>"

[verifier.scroll_batch_verifier_identity]
expected_proof_system_id = "<AUTO>"
expected_circuit_id = "<AUTO>"
expected_circuit_version = "<AUTO>"
expected_verification_key_hash_hex = "<AUTO>"
expected_program_commitment_hash_hex = "<AUTO>"
program_manifest_path = "/app/data/manifests/scroll-batch.json"
verifier_id = "<AUTO>"

[verifier.scroll_bridge_verifier_identity]
expected_proof_system_id = "<AUTO>"
expected_circuit_id = "<AUTO>"
expected_circuit_version = "<AUTO>"
expected_verification_key_hash_hex = "<AUTO>"
expected_program_commitment_hash_hex = "<AUTO>"
program_manifest_path = "/app/data/manifests/bridge-transition.json"
verifier_id = "<AUTO>"

[verifier.scroll_real_verifier]
agg_verifying_key_path = "/app/data/verifier/agg-vk.bin"
chunk_program_commitment_hex = "<AUTO>"
batch_program_commitment_hex = "<AUTO>"
bridge_program_commitment_hex = "<AUTO>"
# END scrollsdk managed verifier configuration

[prover_api]
enabled = true
bind_addr = "0.0.0.0:9400"
worker_auth_token_file = "/run/secrets/prover-worker-token"
max_lease_ttl_ms = 300000
transport = "s3"

[artifact_write]
signed_put_expiry_ms = 3600000
staging_prefix = "staging/proofs"
accepted_prefix = "accepted/proofs"
max_proof_bytes = 536870912
max_public_output_bytes = 10485760

# Native Proof Coordinator base configuration.
#
# For compiler-backed deployments this file supplies only stable process
# defaults. dogeos-proof-topology replaces the complete proof-specific
# verifier, materializer, artifact, auth, and topology projection for the
# selected mode. Do not add parallel mock/production profiles here.
#
# beta.5c defaults [prover_api].eager_chunk_proving to true. It only acts with
# real generation and the chunk materializer/segmentation prerequisites. The
# compiler owns the complete [prover_api] table and renders false for real
# materialization topologies without the eager materializer or explicit opt-out.
# Keep that projection compiler-owned; see ../core-beta5c-configuration.md.

proof_work_base_url = "http://withdrawal-processor:9300"
protocol_context_json = "/app/protocol_context.json"
coordinator_id = "proof-coordinator"
# The runner drains available work continuously, then waits this long when idle
# (or uses failure backoff). This is not a per-job processing delay.
poll_interval_ms = 1000
lease_ttl_ms = 60000
# Required for the non-loopback http:// proof_work_base_url above. Core rejects
# this URL with false; non-loopback access also requires configured bearer auth.
# Revisit this setting together with the URL if the service link moves to HTTPS.
allow_insecure_http = true

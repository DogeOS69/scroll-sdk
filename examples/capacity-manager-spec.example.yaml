# Merge this section into deployment-spec.yaml and REMOVE proofWorkers.
# The normal setup plan/apply prepares configuration; it does not rent GPUs.
# Imported dstack server configuration creates this project/backend.
# make install-capacity-manager prepares the empty fleet before installing the manager.
capacityManager:
  image:
    repository: dogeos69/capacity-manager
    # dogeos69/capacity-manager:v0.3.0-beta.8 (Core a0bc76bb)
    digest: sha256:c7eb7beb5a4425db3e9f9a80218bd1ac460eebf27ac08f1191f69e4f843e0036
  provider: aws
  gpu: L4
  project: dogeos-aws-provers
  fleets: [dogeos-aws-l4]
  fleet:
    action: create          # reuse checks an existing matching fleet without modifying it
    cpus: 16
    memoryGiB: 64
    diskSizeGiB: 200
    idleDurationSeconds: 600
  regions: [us-east-1]
  instanceTypes: [g6.4xlarge]
  minWorkers: 1
  maxWorkers: 2
  targetDrainSeconds: 600
  scaleDownTtlSeconds: 300
  maxPricePerHourUsd: 1.50
  maxHourlyCostUsd: 3.00
# Vast alternative: provider: vastai, gpu: RTX4090, an isolated Vast project/fleet,
# regions: [us-texas], instanceTypes: [], prices 0.80 / 1.60 respectively.
# These prices are policy limits, not quotations or total-invoice guarantees.

# Merge these fields into the existing blocks; do not duplicate YAML keys.
dstackController:
  enabled: true
  defaultCredentialsEnabled: true
  serviceAccount:
    annotations:
      # Existing controller role with dstack EC2 provisioning permissions.
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/REPLACE_WITH_DSTACK_ROLE
preparation:
  dstack:
    mode: import
    providers: [aws]
    # project is derived from capacityManager.project; do not repeat it here.
    aws:
      # Existing VPC IDs from your AWS inventory; no default-VPC fallback.
      vpcIds:
        us-east-1: vpc-REPLACE_WITH_EXISTING_VPC_ID
      # Private subnets need outbound access and controller-to-worker reachability.
      publicIps: false

# For Vast, replace preparation.dstack with:
#   mode: import
#   providers: [vastai]
#   vastaiApiKeyEnv: VASTAI_API_KEY
# Disable dstackController.defaultCredentialsEnabled and remove the AWS role
# annotation if no AWS backend is used. Do not retain preparation.dstack.aws.
# Set capacityManager.provider/gpu/regions/prices to the Vast alternative above.

# Optional automatic AWS -> Vast fallback (Core #1612, chart 0.1.5+).
# First replace capacityManager.image with a published digest containing Core #1612;
# the beta.8 example above does not support fallback. Both GPU architectures must
# be present in the checked worker image. Merge under capacityManager:
#   fallback:
#     provider: vastai
#     fleet: dogeos-vast-fallback
#     gpu: RTX4090
#     regions: [us-texas]
#     maxPricePerHourUsd: 0.80  # Must not exceed primary maxPricePerHourUsd.
#     minReliability: 0.95
# Also set preparation.dstack.providers: [aws, vastai] and
# preparation.dstack.vastaiApiKeyEnv: VASTAI_API_KEY (value in private deployment.env).
# Keep the AWS backend/IRSA fields. Fleet CPU/RAM/disk/node bounds and create/reuse
# action are inherited from the primary configuration; no initial instances rented.

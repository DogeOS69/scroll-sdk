global:
  nameOverride: ""
  fullnameOverride: ""

controller:
  type: statefulset
  replicas: 1
  strategy: RollingUpdate

image:
  repository: dogeos69/attestation-signer
  pullPolicy: Always
  tag: latest

# Structured application configuration. The chart renders non-secret values
# into /etc/dogeos/attestation-signer.toml; WIF key material and release
# identity fields remain environment overrides. KMS key IDs are identifiers,
# not secret key material, so they remain in structured configuration.
# Profiles own security-sensitive combinations so production cannot
# accidentally inherit scaffold policy or a local key backend.
attestationSigner:
  profile: production-kms
  network: testnet
  port: 4040
  logFilter: info,attestation_signer=info
  signatureDelaySeconds: 0
  tso:
    url: http://tso-service:3000
    callbackPhase: attestation
  database:
    path: /app/data/attestation-signer.sqlite
  local:
    wifSecretRef:
      # Empty derives <release-fullname>-env. Set only to reference a
      # deliberately pre-existing Secret with a stable external name.
      name: ""
      key: ATTESTATION_SIGNER_WIF
  kms:
    keyId: "<TODO>"
    region: "<TODO>"
    expectedSignerId: "<TODO>"
    endpointUrl: ""
  productionPolicy:
    protocolInstanceId: "<TODO>"
    bridgeNamespaceId: "<TODO>"
    activeBridgeKeyHash: "<TODO>"
    supportedSigningPolicyVersions: "1"
    verifierRegistryToml: /etc/dogeos/verifier-registry.toml
    teeAllowedSignerIds: "<TODO>"
    sourceSetToml: /etc/dogeos/source-set.toml
  envelopePolicy:
    allowedProofTriples: ""
    allowedTeeSignerIds: ""
    maxProofArtifacts: 0
    maxRefStringBytes: 512
    maxFetchUrlBytes: 2048
  proofArtifact:
    fetchMode: http
    maxBytes: "536870912"
  allowRotateKeySigningInScaffold: false
  releasePolicy:
    allowedReleaseVersion: "<TODO>"
    allowedGitCommit: "<TODO>"
    allowedSigningPolicyVersion: "1"
    allowedContainerDigest: ""
    containerDigest: ""

# Additional environment variables that are not part of the application
# contract above. Generated application variables take precedence.
env: []

args:
  - -c
  - /etc/dogeos/attestation-signer.toml

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 4040
        protocol: TCP

defaultProbes: &default_probes
  enabled: true
  custom: true
  spec:
    httpGet:
      path: "/health"
      port: http

probes:
  liveness:
    <<: *default_probes
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: "/ready"
        port: http
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: "/ready"
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 24
      timeoutSeconds: 2

# Production policy files are mounted separately because the binary genuinely
# reads these files. Scalar application settings stay in structured values.
configMaps:
  config:
    enabled: true
    data:
      # Generated by templates/common.yaml from attestationSigner.*.
      attestation-signer.toml: ""
      verifier-registry.toml: |
        # Configure the production verifier allowlist.
      source-set.toml: |
        # Configure the production source-set topology.

persistence:
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    # The SQLite audit store and anti-double-sign ledger have no automatic
    # retention. Keep operational headroom for WAL and long-lived history.
    size: 5Gi
    retain: true
  config:
    enabled: true
    type: configMap
    mountPath: /etc/dogeos/
    readOnly: true

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

serviceMonitor:
  main:
    enabled: true

ingress:
  main:
    enabled: false

externalSecrets: {}

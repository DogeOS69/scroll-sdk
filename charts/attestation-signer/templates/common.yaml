---
{{- include "scroll.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: {{ .Release.Name | quote }}
{{- end }}
service:
  main:
    ports:
      http:
        port: {{ .Values.attestationSigner.port }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{- $fullname := include "scroll.common.lib.chart.names.fullname" . -}}
{{- $createServiceAccount := .Values.serviceAccount.create | default false -}}
{{- if $createServiceAccount -}}
  {{- $_ := set .Values.serviceAccount "name" (default $fullname .Values.serviceAccount.name) -}}
  {{- /* common 1.5.1 creates a legacy long-lived token Secret. Render the SA
        here and let Kubernetes/IRSA use projected short-lived tokens. */ -}}
  {{- $_ := set .Values.serviceAccount "create" false -}}
{{- end -}}
{{- with .Values.attestationSigner.expectedReleaseName -}}
  {{- if ne . $.Release.Name -}}
    {{- fail (printf "this values file belongs to Helm release %s, not %s" . $.Release.Name) -}}
  {{- end -}}
{{- end -}}
{{- if eq .Values.attestationSigner.profile "production-kms" -}}
  {{- if eq (toString .Values.image.tag) "latest" -}}
    {{- fail "production-kms requires an immutable image tag; latest is forbidden" -}}
  {{- end -}}
  {{- $required := dict
    "attestationSigner.kms.keyId" .Values.attestationSigner.kms.keyId
    "attestationSigner.kms.region" .Values.attestationSigner.kms.region
    "attestationSigner.kms.expectedSignerId" .Values.attestationSigner.kms.expectedSignerId
    "attestationSigner.productionPolicy.protocolInstanceId" .Values.attestationSigner.productionPolicy.protocolInstanceId
    "attestationSigner.productionPolicy.bridgeNamespaceId" .Values.attestationSigner.productionPolicy.bridgeNamespaceId
    "attestationSigner.productionPolicy.activeBridgeKeyHash" .Values.attestationSigner.productionPolicy.activeBridgeKeyHash
    "attestationSigner.productionPolicy.teeAllowedSignerIds" .Values.attestationSigner.productionPolicy.teeAllowedSignerIds
    "attestationSigner.releasePolicy.allowedReleaseVersion" .Values.attestationSigner.releasePolicy.allowedReleaseVersion
    "attestationSigner.releasePolicy.allowedGitCommit" .Values.attestationSigner.releasePolicy.allowedGitCommit
    "serviceAccount.annotations.eks.amazonaws.com/role-arn" (dig "serviceAccount" "annotations" "eks.amazonaws.com/role-arn" "" .Values)
  -}}
  {{- range $name, $value := $required -}}
    {{- if or (not $value) (contains "<TODO" $value) -}}
      {{- fail (printf "production-kms requires a real value for %s" $name) -}}
    {{- end -}}
  {{- end -}}
  {{- if not (regexMatch "^0[23][0-9a-f]{64}$" .Values.attestationSigner.kms.expectedSignerId) -}}
    {{- fail "production-kms kms.expectedSignerId must be 66 lowercase compressed-pubkey hex characters" -}}
  {{- end -}}
  {{- if or (contains "<TODO" (index .Values.configMaps.config.data "verifier-registry.toml")) (contains "<TODO" (index .Values.configMaps.config.data "source-set.toml")) -}}
    {{- fail "production-kms policy TOML files must be populated" -}}
  {{- end -}}
{{- end -}}
{{- $_ := set .Values.persistence.config "name" (printf "%s-config" $fullname) -}}
{{- if eq .Values.attestationSigner.profile "staging-local" -}}
  {{- $secretName := default (printf "%s-env" $fullname) .Values.attestationSigner.local.wifSecretRef.name -}}
  {{- $_ := set .Values.attestationSigner.local.wifSecretRef "name" $secretName -}}
  {{- if hasKey .Values.externalSecrets "signer-env" -}}
    {{- $externalSecret := get .Values.externalSecrets "signer-env" -}}
    {{- $_ := unset .Values.externalSecrets "signer-env" -}}
    {{- $_ := set .Values.externalSecrets $secretName $externalSecret -}}
  {{- end -}}
{{- end -}}

{{- $legacyToml := dig "configMaps" "config" "data" "attestation-signer.toml" "" .Values -}}
{{- if $legacyToml -}}
{{- fail "direct configMaps.config.data.attestation-signer.toml is unsupported; regenerate values with scrollsdk and configure structured attestationSigner values" -}}
{{- end -}}

{{- $configToml := include "attestation-signer.configToml" . -}}
{{- $_ := set .Values.configMaps.config.data "attestation-signer.toml" $configToml -}}

{{- $generatedEnv := include "attestation-signer.generatedEnv" . | fromYamlArray -}}
{{- $_ := set .Values "env" (concat (.Values.env | default list) $generatedEnv) -}}

{{- if $createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | quote }}
  labels:
    app.kubernetes.io/name: {{ $fullname | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}

{{/* Render the templates */}}
{{ include "scroll.common.loader.generate" . }}
---
{{/* Explicitly include the template to render ExternalSecret resources */}}
{{- include "scrolllib.externalsecrets.tpl" . }}

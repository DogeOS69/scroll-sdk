image:
  repository: dogeos69/attestation-signer
  pullPolicy: IfNotPresent
  tag: latest # Pin to an immutable release tag or digest.

attestationSigner:
  profile: production-kms
  network: testnet # Set to dogecoin/mainnet, testnet, or regtest.
  kms:
    keyId: "<TODO>"
    region: "<TODO>"
    expectedSignerId: "<TODO>" # 66 lowercase compressed-pubkey hex chars
  productionPolicy:
    protocolInstanceId: "<TODO>"
    bridgeNamespaceId: "<TODO>"
    activeBridgeKeyHash: "<TODO>"
    supportedSigningPolicyVersions: "1"
    verifierRegistryToml: /etc/dogeos/verifier-registry.toml
    teeAllowedSignerIds: "<TODO>"
    sourceSetToml: /etc/dogeos/source-set.toml
  envelopePolicy:
    maxProofArtifacts: 4
    allowedProofTriples: "<TODO>"
  proofArtifact:
    fetchMode: http
  releasePolicy:
    allowedReleaseVersion: "<TODO>"
    allowedGitCommit: "<TODO>"
    allowedSigningPolicyVersion: "1"

configMaps:
  config:
    enabled: true
    data:
      verifier-registry.toml: |
        # <TODO: fill from the deployed verifier identities>
      source-set.toml: |
        # <TODO: fill from the production source-set topology>

persistence:
  data:
    # Per signer. Increase for sustained high request volume; the audit DB and
    # anti-double-sign ledger are retained for the lifetime of the release.
    size: 5Gi
  config:
    enabled: true
    type: configMap
    mountPath: /etc/dogeos/
    readOnly: true

# IRSA role granting kms:Sign + kms:GetPublicKey on exactly one signing key.
serviceAccount:
  create: true
  # This name is part of the EKS IRSA OIDC subject. Keep it aligned with the
  # IAM role trust policy; unlike ordinary Chart-owned names it is intentional.
  name: attestation-signer
  annotations:
    eks.amazonaws.com/role-arn: "<TODO>"

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

serviceMonitor:
  main:
    enabled: true

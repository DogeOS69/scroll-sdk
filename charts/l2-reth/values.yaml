---
role: rpc

global:
  nameOverride: ""
  fullnameOverride: ""

controller:
  replicas: 1
  strategy: RollingUpdate
  type: statefulset

image:
  repository: scrolltech/rollup-node
  pullPolicy: IfNotPresent
  tag: v1.0.7-rc6

waitForL1:
  image: scrolltech/scroll-alpine:v0.0.1

nodeKeyGenerator:
  image: scrolltech/scroll-alpine:v0.0.1

env:
  - name: RUST_BACKTRACE
    value: "1"

envFrom: []

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "8"
    memory: 32Gi

service:
  main:
    # Optional exact Kubernetes Service name. Empty keeps the default release-derived name.
    fullname: ""
    type: ClusterIP
    annotations: {}

probes:
  startup:
    enabled: true
    spec:
      periodSeconds: 10
      failureThreshold: 720
      timeoutSeconds: 1
  liveness:
    enabled: true
    spec:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6
  readiness:
    enabled: true
    spec:
      periodSeconds: 30
      timeoutSeconds: 12
      failureThreshold: 3

reth:
  networkId: "4444444"
  l1Url: http://l1-interface:8545
  l1LivenessThreshold: "2147483647"
  l1LivenessCheckInterval: "3600"
  blobS3Url: ""
  trustedPeers: ""
  builderGasLimit: ""
  engineSyncAtStartup: "false"
  engineLegacyStateRoot: true
  ipcPath: /tmp/reth.ipc
  ipcPermissions: "0600"
  logFormat: log-fmt
  verbosity: 3
  # Additional rollup-node arguments. A string is split on whitespace:
  # "--foo bar --flag" renders as ["--foo", "bar", "--flag"].
  # Use a list when an argument value itself contains spaces.
  extraArgs: []

  ports:
    http: 8545
    ws: 8546
    metrics: 6060
    p2p: 30303

  genesis:
    configMapName: genesis-config
    chainPath: /app/genesis/genesis.json
    mountPath: /app/genesis/genesis.json
    subPath: genesis.json

  data:
    size: 100Gi
    mountPath: /data
    accessMode: ReadWriteOnce
    retain: true

  nodeKey:
    mode: pvcAutoGenerate
    path: /keys/nodekey
    generatedPath: /data/nodekey
    # Defaults to <fullname>-secret-env when mode is secret.
    secretName: ""
    secretKey: RETH_NODEKEY

  signer:
    type: none
    awsKmsKeyId: ""
    localFile:
      path: /signer/sequencer-key
      # Defaults to <fullname>-secret-env when signer.type is localFile.
      secretName: ""
      secretKey: RETH_SEQUENCER_SIGNER_PRIVATE_KEY

  sequencer:
    enabled: false
    autoStart: true
    allowEmptyBlocks: false
    blockTimeMs: "3000"
    payloadBuildingDurationMs: "800"
    l1InclusionMode: finalized:2
    feeRecipient: "0x5300000000000000000000000000000000000005"

  rpc:
    sequencerUrl: ""
    trustedOnly: false
    maxOutboundPeers: ""
    maxInboundPeers: ""
    disableTransactionsBackup: false
    rollupNode: false
    rollupNodeAdmin: false
    maxConnections: ""
    maxRequestSize: ""
    maxResponseSize: ""
    maxSubscriptionsPerConnection: ""
    maxBlocksPerFilter: ""
    maxLogsPerResponse: ""
    maxTracingRequests: ""

  http:
    enabled: true
    addr: 0.0.0.0
    corsDomain: "*"
    api: eth,net,web3,rpc

  ws:
    enabled: true
    addr: 0.0.0.0
    api: eth,net,web3,rpc

  service:
    p2p:
      enabled: false
    extra: {}

  # Opt-in external P2P for a designated non-sequencer node. When enabled, the
  # chart renders <fullname>-p2p: an internet-facing AWS NLB (IP targets) that
  # forwards TCP ports.p2p to one pod of this release, <fullname>-<ordinal>.
  # See the README section "External P2P (opt-in)".
  p2pExternal:
    enabled: false
    ordinal: 0
    # Allowed peer CIDRs, enforced by the NLB security group. Required unless
    # allowOpenPeering is true.
    sourceRanges: []
    allowOpenPeering: false
    # Deployment-owned subnet and Elastic IP allocation IDs, one EIP per subnet
    # and in the same order. The chart references them and never creates them.
    subnets: []
    eipAllocations: []
    # Additional AWS Load Balancer Controller annotations.
    annotations: {}

ingress: {}
serviceMonitor: {}
externalSecrets: {}

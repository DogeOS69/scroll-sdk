nameOverride: ""
fullnameOverride: ""

controller:
  replicas: 0
  strategy: Recreate

image:
  repository: dogeos69/prover-worker
  pullPolicy: IfNotPresent
  tag: latest
  digest: ""

imagePullSecrets: []
command: []
args: []
env: []
envFrom: []

automountServiceAccountToken: false
serviceAccount:
  create: true
  name: ""
  annotations: {}

termination:
  gracePeriodSeconds: 420

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

probes:
  liveness:
    enabled: false
    spec: {}
  readiness:
    enabled: false
    spec: {}
  startup:
    enabled: false
    spec: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
runtimeClassName: ""

configMaps: {}
persistence: {}

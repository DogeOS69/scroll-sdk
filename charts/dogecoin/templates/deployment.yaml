apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dogecoin.fullname" . }}
  labels:
    {{- include "dogecoin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dogecoin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum }}
        {{- if not .Values.externalSecrets }}
        checksum/rpc-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- else }}
        checksum/external-secret-spec: {{ toJson .Values.externalSecrets | sha256sum }}
        {{- end }}
      labels:
        {{- include "dogecoin.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Inject the secret into the config file
          command:
            - /bin/sh
            - -c
            - |
              set -e  # Exit on any error
              echo "Starting Dogecoin container setup..."
              
              # Verify required files exist
              if [ ! -f "/etc/dogecoin.conf" ]; then
                echo "ERROR: dogecoin.conf not found"
                exit 1
              fi
              
              if [ ! -f "/etc/dogecoin-secrets/{{ .Values.rpcPassword.secretKey }}" ]; then
                echo "ERROR: RPC password secret not found"
                exit 1
              fi
              
              # Copy configuration file
              echo "Copying configuration file..."
              cp /etc/dogecoin.conf /tmp/dogecoin.conf
              
              # Add RPC password from secret
              echo "Adding RPC password..."
              RPC_PASSWORD=$(cat /etc/dogecoin-secrets/{{ .Values.rpcPassword.secretKey }})
              if [ -z "$RPC_PASSWORD" ]; then
                echo "ERROR: RPC password is empty"
                exit 1
              fi
              echo "rpcpassword=$RPC_PASSWORD" >> /tmp/dogecoin.conf
              
              echo "Configuration complete. Starting dogecoind..."
              exec /dogecoin/bin/dogecoind -conf=/tmp/dogecoin.conf -datadir=/dogecoin-data
          lifecycle:
            preStop:
              exec:
                command:
                  - /dogecoin/bin/dogecoin-cli
                  - -conf=/tmp/dogecoin.conf
                  - -rpcconnect=127.0.0.1
                  - {{ printf "-rpcport=%v" .Values.service.rpcPort | quote }}
                  - -rpcclienttimeout=5
                  - stop
          volumeMounts:
            - name: config-volume
              mountPath: /etc/dogecoin.conf
              subPath: dogecoin.conf
            - name: secret-volume
              mountPath: /etc/dogecoin-secrets
            - name: dogecoin-data
              mountPath: /dogecoin-data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: dogecoind
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: rpc
              containerPort: {{ .Values.service.rpcPort }}
              protocol: TCP
            - name: zmq-rawblock
              containerPort: {{ .Values.service.zmqRawBlockPort }}
              protocol: TCP
            - name: zmq-rawtx
              containerPort: {{ .Values.service.zmqRawTxPort }}
              protocol: TCP
            - name: zmq-hashtx
              containerPort: {{ .Values.service.zmqHashTxPort }}
              protocol: TCP
            - name: zmq-hashblock
              containerPort: {{ .Values.service.zmqHashBlockPort }}
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
            exec:
              command:
                {{- include "dogecoin.rpcProbeCommand" . | nindent 16 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
            tcpSocket:
              port: rpc
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
            exec:
              command:
                {{- include "dogecoin.rpcProbeCommand" . | nindent 16 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "dogecoin.fullname" . }}-config
        - name: secret-volume
          secret:
            {{- if .Values.externalSecrets }}
            {{- $secretName := "" }}
            {{- range $key, $value := .Values.externalSecrets }}
            {{- $secretName = $key }}
            {{- break }}
            {{- end }}
            secretName: {{ $secretName }}
            {{- else }}
            secretName: {{ include "dogecoin.fullname" . }}-rpc-secret
            {{- end }}
        - name: dogecoin-data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | default (printf "%s-data" .Release.Name) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

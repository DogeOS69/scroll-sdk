{{- $groups := dict -}}
{{- range $name, $binding := .Values.bindings }}
{{- if hasKey $groups $binding.targetGroupARN }}
{{- fail "Each binding must use a distinct, externally managed target group" }}
{{- end }}
{{- $_ := set $groups $binding.targetGroupARN true }}
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: {{ printf "%s-%s" ($.Release.Name | trunc 21 | trimSuffix "-") $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: alb-bindings
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  targetGroupARN: {{ $binding.targetGroupARN | quote }}
  targetType: ip
  serviceRef:
    name: {{ $binding.serviceRef.name | quote }}
    port: {{ $binding.serviceRef.port }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "dstack-controller.fullname" . }}
  labels:
    {{- include "dstack-controller.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "dstack-controller.selectorLabels" . | nindent 4 }}

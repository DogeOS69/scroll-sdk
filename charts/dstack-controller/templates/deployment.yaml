# DogeOS implementation informed by Nebius's dstack chart; see NOTICE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dstack-controller.fullname" . }}
  labels:
    {{- include "dstack-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Avoid overlapping controllers using the same SQLite database/RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dstack-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dstack-controller.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.tls.enabled }}
      annotations:
        {{- if .Values.tls.enabled }}
        checksum/tls-proxy: {{ include "dstack-controller.tlsProxyFiles" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dstack-controller.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "dstack-controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.tls.enabled }}
          # The image entrypoint binds 0.0.0.0. Keep dstack on loopback behind the TLS sidecar.
          # The entrypoint's GCP JSON and Litestream handling is skipped; validate.yaml rejects them.
          # tini is the image's own init; dstack is resolved through the image PATH.
          command: [/usr/bin/tini, --, dstack, server, --host, 127.0.0.1]
          {{- else }}
          ports:
            - name: http
              containerPort: 3000
          {{- end }}
          env:
            - name: DSTACK_SERVER_DIR
              value: /root/.dstack/server
            {{- if not .Values.defaultCredentialsEnabled }}
            # Blocks both automatic discovery and explicit default credentials.
            - name: DSTACK_DEFAULT_CREDS_DISABLED
              value: "1"
            {{- end }}
            - name: DSTACK_SERVER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.key | quote }}
            {{- if eq .Values.database.type "postgresql" }}
            - name: DSTACK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.key | quote }}
            {{- end }}
            {{- if .Values.monitoring.enabled }}
            - name: DSTACK_ENABLE_PROMETHEUS_METRICS
              value: "1"
            - name: DSTACK_OTEL_METRICS_ENABLED
              value: "1"
            - name: DSTACK_OTEL_METRICS_EXPORTERS
              value: prometheus
            - name: DSTACK_PROMETHEUS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitoring.auth.existingSecret | quote }}
                  key: {{ .Values.monitoring.auth.key | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: state
              mountPath: /root/.dstack/server
            - name: config
              mountPath: /root/.dstack/server/config.yml
              subPath: config.yml
              readOnly: true
            {{- range .Values.credentialSecrets }}
            - name: {{ printf "credentials-%s" .name }}
              mountPath: {{ printf "/etc/dstack/credentials/%s" .name }}
              readOnly: true
            {{- end }}
          startupProbe:
            {{- include "dstack-controller.probe" (dict "root" . "probe" .Values.startupProbe) | nindent 12 }}
          readinessProbe:
            {{- include "dstack-controller.probe" (dict "root" . "probe" .Values.readinessProbe) | nindent 12 }}
          livenessProbe:
            {{- include "dstack-controller.probe" (dict "root" . "probe" .Values.livenessProbe) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.tls.enabled }}
        - name: tls-proxy
          image: {{ printf "%s@%s" .Values.tls.proxy.image.repository .Values.tls.proxy.image.digest | quote }}
          imagePullPolicy: {{ .Values.tls.proxy.image.pullPolicy }}
          command: [/bin/sh, /etc/dstack-tls-proxy/run.sh]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: https
              containerPort: {{ .Values.tls.port }}
          volumeMounts:
            - name: tls-proxy-config
              mountPath: /etc/dstack-tls-proxy
              readOnly: true
            - name: tls
              mountPath: /etc/dstack-tls
              readOnly: true
            - name: tls-proxy-tmp
              mountPath: /tmp
          # Ready only when dstack answers through the proxy. Liveness checks nginx alone.
          readinessProbe:
            httpGet: {path: /, port: https, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.tls.proxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (include "dstack-controller.fullname" .) .Values.persistence.existingClaim }}
        - name: config
          secret:
            secretName: {{ .Values.serverConfig.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.serverConfig.key | quote }}
                path: config.yml
        {{- range .Values.credentialSecrets }}
        - name: {{ printf "credentials-%s" .name }}
          secret:
            secretName: {{ .secretName | quote }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ printf "%s-tls" (include "dstack-controller.fullname" .) | quote }}
            # Only the non-root proxy container mounts this volume.
            defaultMode: 0444
        - name: tls-proxy-config
          configMap:
            name: {{ printf "%s-tls-proxy" (include "dstack-controller.fullname" .) | quote }}
        - name: tls-proxy-tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

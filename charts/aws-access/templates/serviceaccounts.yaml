{{- $names := dict }}
{{- range .Values.serviceAccounts }}
{{- $name := required "serviceAccounts[].name is required" .name }}
{{- if hasKey $names $name }}
{{- fail "duplicate AWS ServiceAccount name" }}
{{- end }}
{{- $_ := set $names $name true }}
{{- $role := required "serviceAccounts[].roleArn is required" .roleArn }}
{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]+$" $role) }}
{{- fail "AWS ServiceAccount requires an IAM role ARN" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $role | quote }}
automountServiceAccountToken: false
{{- end }}

global:
  nameOverride: ""
  fullnameOverride: ""

controller:
  type: statefulset
  replicas: 1
  strategy: RollingUpdate

image:
  repository: dogeos69/proof-coordinator
  pullPolicy: Always
  tag: latest

# Dedicated ServiceAccount. Keeping a per-workload identity (rather than the
# namespace `default`) is required for cloud IAM binding — e.g. AWS IRSA for the
# S3 artifact store: set `serviceAccount.annotations.eks.amazonaws.com/role-arn`
# (see values/production.yaml).
serviceAccount:
  create: true
  # Empty derives the release fullname. Set explicitly when an IRSA trust
  # policy binds a stable namespace/ServiceAccount OIDC subject.
  name: ""
  annotations: {}

command:
  - "sh"
  - "-ec"
  - "exec proof-coordinator --config /app/conf/ProofCoordinator.toml"

# dogeos-core owns the directory names below artifact_local_root. Kubernetes
# fixes that root at /app/data/proof-artifacts; operators do not configure the
# individual materializer/cache paths. Prepare the PVC layout before the
# fail-closed coordinator validates its local staging directory.
initContainers:
  prepare-proof-data-directories:
    image: busybox:1.36.1
    command:
      - /bin/sh
      - -ec
    args:
      - >-
        mkdir -p
        '/app/data/proof-artifacts'
        '/app/data/proof-artifacts/runtime/coordinator-staging'
        '/app/data/proof-artifacts/runtime/bridge-prepared-bundles'
        '/app/data/proof-artifacts/runtime/scroll-batch-materializer-output'
        '/app/data/proof-artifacts/runtime/scroll-chunk-sidecar-scratch'
        '/app/data/proof-artifacts/runtime/scroll-batch-subprocess-scratch'
        '/app/data/proof-artifacts/runtime/scroll-batch-da-cache/blobs'
        '/app/data/proof-artifacts/runtime/bridge-da/blobs'
    volumeMounts:
      - name: data
        mountPath: /app/data

service:
  main:
    enabled: false
    ports:
      prover:
        enabled: true
        primary: true
        port: 7788
        targetPort: 7788
        protocol: TCP

defaultProbes: &default_probes
  enabled: true
  custom: true
  spec:
    httpGet:
      path: /healthz
      # dogeos-core serves the health endpoints on the prover_api listener.
      port: prover
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

probes:
  liveness:
    <<: *default_probes
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /readyz
        port: prover
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  startup:
    <<: *default_probes
    spec:
      httpGet:
        path: /healthz
        port: prover
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24

persistence:
  config:
    enabled: true
    type: configMap
    mountPath: /app/conf/
    # The proof-coordinator template creates <fullname>-config without applying
    # Helm `tpl` to the opaque TOML; content changes roll the pod by checksum.
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    size: 10Gi
    retain: true
  secrets:
    enabled: false
    type: secret
    mountPath: /run/secrets
    # Empty derives <release-fullname>-secrets.
    name: ""
    readOnly: true
  # Writable scratch space so the container can run with a read-only root
  # filesystem (see securityContext.readOnlyRootFilesystem). Sized small; all
  # durable state lives on the `data` PVC.
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
    sizeLimit: 1Gi

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Pod-level hardening. The runtime image (debian-slim) ships no non-root USER,
# so we pin an unprivileged UID/GID here; the binary is world-executable and
# only writes to the `data` PVC, whose ownership fsGroup fixes up on mount.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening. Durable state is on the `data` PVC and scratch on
# the `tmp` emptyDir, so the root filesystem can be read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceMonitor:
  main:
    enabled: false

ingress:
  main:
    enabled: false

env: []
envFrom: []
externalSecrets: {}

proofCoordinator:
  # The TOML is opaque to Helm. In production inject a native file with:
  #   --set-file proofCoordinator.config.content=ProofCoordinator.toml
  # Alternatively point at a separately managed ConfigMap.
  config:
    content: ""
    existingConfigMap: ""
    key: ProofCoordinator.toml
    required: false

configMaps:
  config:
    # A dedicated template renders opaque content without evaluating it via tpl.
    enabled: false
    data: {}

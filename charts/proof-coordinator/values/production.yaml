---
# Production-oriented overrides for proof-coordinator. Replace every <TODO>
# before deploying; the service fails closed on malformed verifier pins, missing
# secret files, unsafe plaintext posture, and invalid worker-visible URLs.
#
# Layering contract (Figment in the binary: TOML file, then env overlay):
#   - proofCoordinator.config.content: opaque TOML supplied with --set-file.
#   - env (DOGEOS_PROOF_COORDINATOR_*): per-deployment scalars. This is the
#     part deployment tooling (scroll-sdk-cli) generates; `__` separates TOML
#     sections, e.g. ARTIFACT_STORE__BUCKET -> [artifact_store] bucket.
#   - secrets: mounted files via externalSecrets, referenced by *_file keys.
global:
  nameOverride: proof-coordinator
  fullnameOverride: proof-coordinator

image:
  repository: dogeos69/proof-coordinator
  pullPolicy: IfNotPresent
  tag: TODO_TAG_TO_REPLACE

command:
  - sh
  - -ec
  - exec proof-coordinator --config /app/conf/ProofCoordinator.toml

proofCoordinator:
  config:
    content: ""
    existingConfigMap: ""
    key: ProofCoordinator.toml
    required: true

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 9400
        targetPort: 9400
        protocol: TCP

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /readyz, port: http}
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet: {path: /healthz, port: http}
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24

persistence:
  config:
    enabled: true
    type: configMap
    name: proof-coordinator-config
    mountPath: /app/conf/
    readOnly: true
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    size: 10Gi
    retain: true
  secrets:
    enabled: true
    type: secret
    name: proof-coordinator-secrets
    mountPath: /app/secrets
    readOnly: true
  protocol-context:
    enabled: true
    type: configMap
    name: protocol-context-config
    mountPath: /app/protocol_context.json
    subPath: protocol_context.json
    items:
      - key: protocol_context.json
        path: protocol_context.json
    readOnly: true
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
    sizeLimit: 1Gi

initContainers:
  prepare-proof-data-directories:
    image: busybox:1.36.1
    command: [/bin/sh, -ec]
    args:
      - >-
        mkdir -p
        '/app/data/proof-artifacts'
        '/app/data/proof-artifacts/runtime/coordinator-staging'
        '/app/data/proof-artifacts/runtime/bridge-prepared-bundles'
        '/app/data/proof-artifacts/runtime/scroll-batch-materializer-output'
        '/app/data/proof-artifacts/runtime/scroll-chunk-sidecar-scratch'
        '/app/data/proof-artifacts/runtime/scroll-batch-subprocess-scratch'
        '/app/data/proof-artifacts/runtime/scroll-batch-da-cache/blobs'
        '/app/data/proof-artifacts/runtime/bridge-da/blobs'
    volumeMounts:
      - name: data
        mountPath: /app/data

resources:
  requests: {memory: 256Mi, cpu: 100m}
  limits: {memory: 1Gi, cpu: 500m}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceMonitor:
  main:
    enabled: false

ingress:
  main:
    enabled: false

configMaps:
  config:
    enabled: false
    data: {}

# Grant the pod's ServiceAccount an AWS IAM role via IRSA so the S3 artifact
# store needs no static credentials. Uncomment and set the role ARN; leave the
# annotations empty and use env/envFrom below for MinIO or static credentials.
serviceAccount:
  create: true
  name: proof-coordinator
  # Set name explicitly together with an IRSA role annotation when the IAM
  # trust policy pins a namespace/ServiceAccount OIDC subject.
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<TODO>

# Per-deployment scalars, layered over ProofCoordinator.toml by the binary's
# DOGEOS_PROOF_COORDINATOR_ env overlay. Generated/owned by deployment tooling.
# For MinIO or static S3 credentials additionally inject AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY / AWS_REGION (via secretKeyRef or envFrom); with IRSA
# none are needed.
env:
  - name: DOGEOS_PROOF_COORDINATOR_PROTOCOL_CONTEXT_JSON
    value: "/app/protocol_context.json"
  # WP proof-work API base URL. `allow_insecure_http` is required for a
  # non-loopback http:// URL — prefer https:// or service-mesh TLS if the
  # network path is not private/trusted.
  - name: DOGEOS_PROOF_COORDINATOR_PROOF_WORK_BASE_URL
    value: "http://withdrawal-processor:9300"
  - name: DOGEOS_PROOF_COORDINATOR_ALLOW_INSECURE_HTTP
    value: "true"
  - name: DOGEOS_PROOF_COORDINATOR_COORDINATOR_ID
    value: "proof-coordinator"
  # [artifact_store] S3 location.
  - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__BUCKET
    value: "<TODO>"
  - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__REGION
    value: "us-west-2"
  # Internal coordinator/WP/SDK endpoint; omit this entry for AWS S3.
  - name: DOGEOS_PROOF_COORDINATOR_ARTIFACT_STORE__ENDPOINT_URL
    value: "<TODO>"
  # Worker-visible S3 endpoint. Required when artifact_store.endpoint_url is
  # not directly acceptable to remote workers. Must be https://, unless it is
  # exactly http://127.0.0.1.
  - name: DOGEOS_PROOF_COORDINATOR_PROVER_API__PUBLIC_S3_ENDPOINT_URL
    value: "<TODO>"
envFrom: []

externalSecrets:
  # Logical local resource key; rendered as <release-fullname>-secrets.
  secrets:
    provider: aws
    data:
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: proof-work-token
        secretKey: proof-work-token
      - remoteRef:
          key: scroll/proof-coordinator-secrets
          property: prover-worker-token
        secretKey: prover-worker-token
    refreshInterval: 2m
    serviceAccount: external-secrets

# Minimal verify-only development configuration. Production deployments should
# inject dogeos-proof-topology compiler output through
# proofCoordinator.config.content.
protocol_context_json = "/app/protocol_context.json"
proof_work_base_url = "http://127.0.0.1:9300"
coordinator_id = "proof-coordinator-idle"
generation = "mock"

[artifact_store]
kind = "local_fs"
root = "/app/data/proof-artifacts"

[verifier]
enforcement = "observe"

apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-preinstalls-deploy
  labels:
    {{- include "preinstalls.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: OnFailure
  initContainers:
    - name: 1-wait-for-l2-sequencer
      image: curlimages/curl:8.20.0
      command: ["/bin/sh", "-ec"]
      args:
        - |
          # Reth rejects HTTP GET. Require a successful JSON-RPC response.
          until response=$(curl --silent --fail --connect-timeout 5 --max-time 10 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            "$L2_RPC_ENDPOINT") && \
            printf '%s' "$response" | grep -Eq '"result"[[:space:]]*:[[:space:]]*"0x[0-9a-fA-F]+"'; do
            echo "Waiting for L2 JSON-RPC readiness..."
            sleep 2
          done
          echo "L2 JSON-RPC is ready."
      envFrom:
        {{- toYaml .Values.envFrom | nindent 8 }}
  containers:
    - name: preinstalls-deploy
      image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
      args:
        - $(L2_RPC_ENDPOINT)
      envFrom:
        {{- toYaml .Values.envFrom | nindent 8 }}

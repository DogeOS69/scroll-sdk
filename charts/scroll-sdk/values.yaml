scroll-common:
  enabled: true

scroll-monitor:
  enabled: true
  grafana:
    enabled: true
    ingress:
      enabled: false
      ingressClassName: alb
      hosts:
        - grafana.scrollsdk
  loki:
    enabled: true
  alloy:
    enabled: true
  kube-prometheus-stack:
    enabled: true
    alertmanager:
      enabled: false

admin-system-backend:
  enabled: false

admin-system-cron:
  enabled: false

admin-system-dashboard:
  enabled: false
  ingress:
    main:
      ingressClassName: alb
      enabled: false
      hosts:
        - host: admin-system-dashboard.scrollsdk
          paths:
            - path: /
              pathType: Prefix

postgresql:
  enabled: true
  nameOverride: postgresql
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    postgresPassword: "qwerty12345"
  volumePermissions:
    enabled: true
  primary:
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenDeleted: Delete
      whenScaled: Delete
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false
    resources:
      requests:
        cpu: 1
        memory: 512Mi
      limits:
        cpu: 3
        memory: 1024Mi
    extendedConfiguration: |
      max_connections = 400
  tls:
    enabled: true
    autoGenerated: true

db:
  pg_host: "postgresql"
  pg_user: "postgres"
  pg_password: "qwerty12345"
  pg_port: "5432"
  bridge_history_password: "test1234"
  chain_monitor_password: "test1234"
  gas_oracle_password: "test1234"
  rollup_node_password: "test1234"
  rpc_gateway_password: "test1234"

---
l1-devnet:
  enabled: true
  ingress:
    main:
      ingressClassName: alb
      enabled: false
      hosts:
        - host: l1-devnet.scrollsdk
          paths:
            - path: /
              pathType: Prefix

blockscout:
  enabled: true
  blockscout-stack:
    config:
      prometheus:
        ingressWhitelist:
          enabled: false
    blockscout:
      ingress:
        enabled: false
        className: alb
    frontend:
      replicaCount: 1
      ingress:
        enabled: false
        className: alb

bridge-history-api:
  enabled: false
  ingress:
    main:
      enabled: false
      primary: true
      annotations: {}
      labels: {}
      ingressClassName: alb

global:
  nameOverride: &app_name fee-oracle
  fullnameOverride: *app_name

controller:
  type: statefulset
  replicas: 1
  strategy: RollingUpdate

image:
  repository: dogeos69/fee-oracle
  pullPolicy: Always
  tag: 102925-00

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 8080
      metrics:
        enabled: true
        port: 9090

# /health and /ready call the Ethereum DA RPC and the price exchanges
# inline, each bounded by a 5s internal timeout, so a handler can take
# ~10s to answer while an upstream is slow. /health still returns 200
# with status "degraded" in that case. timeoutSeconds must stay above
# that bound, or upstream slowness turns into liveness restarts.
defaultProbes: &default_probes
  enabled: true
  custom: true
  spec:
    httpGet:
      path: "/health"
      port: http
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3

probes:
  liveness:
    <<: *default_probes
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: "/ready"
        port: http
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: "/ready"
        port: http
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 20

# Resource configuration
resources:
  requests:
    memory: "256Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "200m"

# Persistent storage configuration
persistence:
  data:
    enabled: true
    type: pvc
    mountPath: /data
    accessMode: ReadWriteOnce
    size: 1Gi

command: ["/usr/local/bin/fee_oracle"]

# Application env/config is intentionally supplied by deployment values such as
# examples/values/fee-oracle-production.yaml.

# Monitoring configuration
serviceMonitor:
  main:
    enabled: true
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

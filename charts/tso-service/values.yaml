global:
  nameOverride: &app_name tso-service
  fullnameOverride: *app_name

controller:
  type: statefulset
  replicas: 1
  strategy: RollingUpdate

image:
  repository: dogeos69/tso-service
  pullPolicy: Always
  tag: 110625-00

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 3000

defaultProbes: &default_probes
  enabled: true
  custom: true
  spec:
    httpGet:
      path: "/health"
      port: http

probes:
  liveness:
    <<: *default_probes
  readiness:
    <<: *default_probes
  startup:
    <<: *default_probes
    spec:
      httpGet:
        path: "/health"
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 12

# Application env/config is intentionally supplied by deployment values such as
# examples/values/tso-service-production.yaml.

# Resource configuration
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Monitoring configuration
serviceMonitor:
  main:
    enabled: false

# Public edge. Only /health and the transport-signed /signer/* routes are
# public; every other TSO route (/propose, /register-*, /status, /metrics and
# the unprefixed callbacks used by in-cluster signers) stays in-cluster.
# ingressClassName "alb" (AWS Load Balancer Controller) or "nginx"; see
# values/production.yaml for the annotations each one needs.
ingress:
  main:
    enabled: true
    primary: true
    annotations: {}
    labels: {}
    ingressClassName: "nginx"
    hosts:
      - host: tso.scrollsdk
        paths:
          - path: /health
            pathType: Exact
          - path: /signer
            pathType: Prefix

# Ingress NetworkPolicy for the TSO API port. The TSO routes are unauthenticated
# by design (see the dogeos-core tso_service README, "Trust boundary"); this
# policy is the access control. Disabled by default so an upgrade cannot cut
# signer callbacks or metrics scraping before the selectors below are set.
# Enable it in every deployment that runs on a NetworkPolicy-enforcing CNI.
# All lists hold NetworkPolicyPeer entries (podSelector / namespaceSelector).
# The API, /health and /metrics share one port, so every listed peer reaches
# every route. withdrawalProcessor and signers are required when enabled.
# edge admits the ALB subnet CIDRs (or ingress proxy pods). The Ingress
# restricts public paths; this L4 policy cannot filter HTTP routes.
networkPolicy:
  enabled: false
  port: 3000
  allowFrom:
    withdrawalProcessor: []   # e.g. [{podSelector: {matchLabels: {app.kubernetes.io/name: <wp>}}}]
    signers: []               # signer pods that post signature callbacks
    edge: []                  # public Ingress sources, e.g. [{ipBlock: {cidr: <ALB subnet CIDR>}}]
    operators: []             # optional: operator tooling / ad-hoc port-forward source
    monitoring: []            # optional: Prometheus, scrapes /metrics on the shared port

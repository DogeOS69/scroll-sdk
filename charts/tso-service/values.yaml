global:
  nameOverride: &app_name tso-service
  fullnameOverride: *app_name

controller:
  type: statefulset
  replicas: 1
  strategy: RollingUpdate

image:
  repository: dogeos69/tso-service
  pullPolicy: Always
  tag: 110625-00

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 3000
      # Dedicated scrape port. Also set METRICS_PORT to the same value in env
      # so the application serves /metrics there and stops serving it on http.
      metrics:
        enabled: false
        port: 9100

defaultProbes: &default_probes
  enabled: true
  custom: true
  spec:
    httpGet:
      path: "/health"
      port: http

probes:
  liveness:
    <<: *default_probes
  readiness:
    <<: *default_probes
  startup:
    <<: *default_probes
    spec:
      httpGet:
        path: "/health"
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 12

# Application env/config is intentionally supplied by deployment values such as
# examples/values/tso-service-production.yaml.

# Resource configuration
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Monitoring configuration
serviceMonitor:
  main:
    enabled: false

ingress:
  main:
    enabled: true
    primary: true
    annotations: {}
    labels: {}
    ingressClassName: "nginx"
    hosts:
      - host: tso.scrollsdk
        paths:
          - path: /
            pathType: Prefix

# Ingress NetworkPolicy for the TSO API port. The TSO routes are unauthenticated
# by design (see the dogeos-core tso_service README, "Trust boundary"); this
# policy is the access control. Disabled by default so an upgrade cannot cut
# signer callbacks or metrics scraping before the selectors below are set.
# Enable it in every deployment that runs on a NetworkPolicy-enforcing CNI.
# All lists hold NetworkPolicyPeer entries (podSelector / namespaceSelector).
# withdrawalProcessor and signers are required when enabled. With
# metricsPort = 0 (default) /metrics shares the API port, so every listed peer,
# monitoring included, reaches every route. Set metricsPort to the dedicated
# scrape port (METRICS_PORT) and monitoring is allowed on that port only.
networkPolicy:
  enabled: false
  port: 3000
  metricsPort: 0
  allowFrom:
    withdrawalProcessor: []   # e.g. [{podSelector: {matchLabels: {app.kubernetes.io/name: <wp>}}}]
    signers: []               # signer pods that post signature callbacks
    operators: []             # optional: operator tooling / ad-hoc port-forward source
    monitoring: []            # optional: Prometheus, scrapes /metrics

{{- /*
Ingress allow-list for the TSO API port. The TSO routes (/propose,
/register-signer, /register-script-pubkey, /reject-signatures,
/submit-*-signatures) carry no caller authentication by design; access control
is this policy. /health, /status and /metrics share the same port, so any peer
allowed here can reach every route. Edge peers admit the ingress proxy;
only the Ingress paths limit public callers to /health and signed /signer/*.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $from := .Values.networkPolicy.allowFrom }}
{{- if empty $from.withdrawalProcessor }}
{{- fail "networkPolicy.allowFrom.withdrawalProcessor must contain at least one peer" }}
{{- end }}
{{- if empty $from.signers }}
{{- fail "networkPolicy.allowFrom.signers must contain at least one peer" }}
{{- end }}
{{- $peers := concat
      (required "networkPolicy.allowFrom.withdrawalProcessor must list the withdrawal-processor pods" $from.withdrawalProcessor)
      (required "networkPolicy.allowFrom.signers must list the signer pods (signature callbacks)" $from.signers)
      ($from.edge | default list)
      ($from.operators | default list)
      ($from.monitoring | default list) }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ include "scroll.common.lib.chart.names.fullname" . }}
  labels: {{- include "scroll.common.lib.metadata.allLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "scroll.common.lib.metadata.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from: {{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.port }}
{{- end }}

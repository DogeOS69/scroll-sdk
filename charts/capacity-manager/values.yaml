fullnameOverride: capacity-manager
# Zero pauses reconciliation; existing GPU runs continue billing.
replicaCount: 1
prepared: false
image:
  repository: ghcr.io/dogeos69/capacity-manager
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
manager:
  workerIdPrefix: ""
  workerImage: ""
  workerCommand: ""
  # Deprecated: dstack project secret holding the retired shared worker token,
  # only for capacity-manager images older than dogeos-core #1598 running
  # against coordinators older than #1591. Setting it requires
  # workerCredentialMaster: null.
  workerTokenSecret: ""
  # Worker startup evidence; this is not a manager Pod readiness probe.
  workerReadinessFile: ""
  proofWorkBaseUrl: http://withdrawal-processor:9300
  policy: ""
  pollIntervalMs: 5000
  provisioningTimeoutSeconds: 900
  failureCooldownSeconds: 120
  # False permits upgrades/restarts to adopt surviving remote workers.
  # True requires enough termination grace for leases and provider cleanup.
  scaleDownOnShutdown: false
  dstack:
    serverUrl: http://dstack-controller.dstack-system.svc:3000
    project: ""
    fleets: []
    # Empty: no run-level region filter; fleet/backend eligibility still applies.
    # Vast policies require an explicit region in Core.
    regions: []
    instanceTypes: []
    maxPricePerHourUsd: 0.8
wpAuth:
  existingSecret: proof-coordinator-secrets
  key: proof-work-token
# Coordinator-only worker-credential master: the coordinator Secret key behind
# its prover_api.worker_auth_token_file. The manager mints per-run worker
# credentials from it. Never point a Worker at this key.
workerCredentialMaster:
  existingSecret: proof-coordinator-secrets
  key: prover-worker-token
dstackAuth:
  existingSecret: capacity-manager-dstack-auth
  key: token
persistence:
  existingClaim: ""
  size: 1Gi
  storageClass: null
  retain: true
terminationGracePeriodSeconds: 960
podAnnotations: {}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}
nodeSelector: {}
tolerations: []
affinity: {}

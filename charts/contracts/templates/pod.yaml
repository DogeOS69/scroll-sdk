apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-contracts-deployment
  labels:
    {{- include "scroll-sdk.labels" $ | nindent 4 }}
spec:
  containers:
    - name: contracts-deployment
      image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
      env:
      {{- toYaml .Values.env | nindent 12 }}
      envFrom:
        {{- toYaml .Values.envFrom | nindent 10 }}
      volumeMounts:
        - mountPath: /contracts/volume
          name: config
  restartPolicy: OnFailure
  initContainers:
    - name: 1-wait-for-l1
      image: scrolltech/scroll-alpine:v0.0.1
      command:
        - /bin/sh
        - -c
        - /wait-for-l1.sh $L1_RPC_ENDPOINT
      envFrom:
        - configMapRef:
            name: contracts-deployment-env
      volumeMounts:
        - name: wait-for-l1-script
          mountPath: /wait-for-l1.sh
          subPath: wait-for-l1.sh

    - name: 2-wait-for-l2-sequencer
      image: scrolltech/scroll-alpine:v0.0.1
      command:
        - /bin/sh
        - -ec
        - |
          chain_pattern='0x[0-9a-fA-F]+'
          if [ -n "${CHAIN_ID_L2:-}" ]; then
            chain_pattern=$(printf '0x%x' "$CHAIN_ID_L2")
          fi
          until response=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            "$L2_RPC_ENDPOINT") && \
            printf '%s' "$response" | grep -Eq '"result"[[:space:]]*:[[:space:]]*"'"$chain_pattern"'"'; do
            echo 'Waiting for L2 eth_chainId matching CHAIN_ID_L2...'
            sleep 2
          done
          echo 'L2 JSON-RPC is ready.'
      envFrom:
        - configMapRef:
            name: contracts-deployment-env

  volumes:
    - configMap:
        name: scroll-smart-contracts-config
      name: config
    - configMap:
        name: wait-for-l1-script
        defaultMode: 0777
      name: wait-for-l1-script

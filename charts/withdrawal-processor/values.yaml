global:
  nameOverride: &app_name withdrawal-processor
  fullnameOverride: *app_name

controller:
  type: statefulset
  replicas: 1
  strategy: RollingUpdate

image:
  repository: dogeos69/withdrawal-processor
  pullPolicy: Always
  tag: 110325-00

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 3000
    annotations: {}

probes:
  startup:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /healthz/live
        port: http
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 2

  liveness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /healthz/live
        port: http
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 2

  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /healthz/ready
        port: http
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 2


persistence:
  data:
    enabled: true
    name: withdrawal-processor-data-pvc
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}
    retain: true

# Resource configuration
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"  # also caps glibc malloc arenas (MALLOC_ARENA_MAX), see templates/common.yaml

# Monitoring configuration
serviceMonitor:
  main:
    enabled: false

# Application env/config is intentionally supplied by deployment values such as
# examples/values/withdrawal-processor-production.yaml.

# Ingress NetworkPolicy for the withdrawal-processor. The API routes are
# unauthenticated by design (see the dogeos-core withdrawal_processor README,
# "Trust boundary"); this policy is the access control. Disabled by default so
# an upgrade cannot cut TSO callbacks or metrics scraping before the selectors
# below are set. Enable it in every deployment that runs on a
# NetworkPolicy-enforcing CNI. All lists hold NetworkPolicyPeer entries
# (podSelector / namespaceSelector). Callbacks, rotation routes, health and
# /metrics share apiPort, so every peer listed for it reaches every route.
# proofCoordinator opens proofWorkPort (bearer-token auth is enforced by the
# application there); leave it empty to keep that port closed.
networkPolicy:
  enabled: false
  apiPort: 3000
  proofWorkPort: 9300
  allowFrom:
    tso: []                   # required when enabled: tso-service pods
    operators: []             # optional: who may call the rotation routes
    monitoring: []            # optional: Prometheus, scrapes /metrics
    proofCoordinator: []      # optional: proof-coordinator pods (proof-work port)

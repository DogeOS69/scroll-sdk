{{- if .Values.tsoSigners }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "withdrawal-processor.fullname" . }}-tso-signers
  labels:
    {{- include "withdrawal-processor.labels" . | nindent 4 }}
data:
  signers.toml: |
{{- range .Values.tsoSigners }}
{{- $role := required "tsoSigners[].role is required" .role }}
{{- if not (has $role (list "Correctness" "Attestation")) }}
{{- fail (printf "tsoSigners[].role must be Correctness or Attestation; got %q" $role) }}
{{- end }}
    [[tso_signers]]
    network = "{{ .network }}"
    uri = "{{ .uri }}"
    role = "{{ $role }}"
{{- with .publicKeyOverride }}
    public_key_override = "{{ . }}"
{{- end }}
{{- with .signatureMode }}
    signature_mode = "{{ . }}"
{{- end }}
{{- end }}
{{- end }}

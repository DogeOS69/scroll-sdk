{{- if .Values.enabled }}
  {{- if and .Values.logs.enabled (empty .Values.logs.loki.url) }}
    {{- fail "logs.enabled=true requires logs.loki.url" }}
  {{- end }}
  {{- if and .Values.metrics.otlp.enabled (empty .Values.metrics.prometheusRemoteWrite.url) }}
    {{- fail "metrics.otlp.enabled=true requires metrics.prometheusRemoteWrite.url" }}
  {{- end }}
  {{- if and (gt (int .Values.alloy.controller.replicas) 1) (not .Values.alloy.alloy.clustering.enabled) }}
    {{- fail "Alloy replicas greater than one require alloy.alloy.clustering.enabled=true to avoid duplicate collection" }}
  {{- end }}
{{- end }}

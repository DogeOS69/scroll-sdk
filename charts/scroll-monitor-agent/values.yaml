enabled: true

logs:
  enabled: true
  # An empty list limits discovery to the Helm release namespace. Set explicit
  # namespaces when the collector is installed in a dedicated namespace.
  namespaces: []
  # Optional Kubernetes pod-label allowlist. Every configured label must match.
  podLabels: {}
  loki:
    url: http://loki:3100/loki/api/v1/push
    tenantId: "1"
  l1InterfaceMetrics:
    enabled: true

metrics:
  otlp:
    enabled: true
  prometheusRemoteWrite:
    url: http://prometheus-prometheus:9090/api/v1/write
    jobPrefix: scroll-sdk

alloy:
  fullnameOverride: grafana-alloy
  alloy:
    configMap:
      create: false
      name: grafana-alloy-config
      key: config.alloy
    clustering:
      enabled: false
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
  controller:
    type: statefulset
    replicas: 1
    autoscaling:
      enabled: false
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: scroll-sdk
    interval: 15s

# Status-page automation. Default is offline/disabled; see docs/status-page-automation.md.
statusPage:
  enabled: false  # [OPERATOR] Set true before CLI generation.
  environment: ""  # [OPERATOR] Explicit testnet, mainnet or devnet; not the Dogecoin network.
  sources:
    frontends: frontends-production.yaml  # [OPERATOR] Filename in this values directory.
    frontendsConfig: frontends-config.yaml  # [SOURCE] Read actual REACT_APP_BRIDGE_API_URI and verify chain ID; empty disables inference.
    sequencer: l2-reth-sequencer-production.yaml  # [SOURCE] Select the effective sequencer file (e.g. ...-0.yaml), not an inactive/base template.
    publicRpc: l2-reth-rpc-public-production.yaml  # [OPERATOR] Select the ENABLED public RPC release.
    blockscout: blockscout-production.yaml  # [OPERATOR] Deployed Blockscout; L2Scan excluded.
    scheme: https  # [OPERATOR] Actual external scheme; no domain substitution.
    bridgePath: /bridge  # [CONVENTION] Public route, appended to frontend ingress host.
  grafana:
    orgId: 1  # [OPERATOR] Organization in scroll-monitor's Grafana, not Instatus.
    contactPointName: instatus-public  # [LEGACY] Bootstrap name; publication uses per-component names.
    receiverUid: instatus-public-webhook  # [LEGACY] Bootstrap UID; retained for existing installations.
    webhookSecretRef:
      name: instatus-grafana-webhook  # [LEGACY] Bootstrap Secret; component references are generated below.
      key: url  # [LEGACY] Bootstrap Secret data key.
  # [OPERATOR] Independent component modes: manual, observe or automatic.
  # Automatic is the default; configure inputs and webhook bindings before deployment.
  publication:
    observationContactPointName: slack-alerts  # [OPERATOR] Existing INTERNAL Slack contact point; configure its Secret-backed receiver.
    maintenanceWindows: []  # [OPERATOR] Per-component UTC windows; see production values.
    delivery:
      enabled: true  # Validate health and recovery before forwarding component webhooks.
      image: python:3.12.11-alpine3.22  # [DEFAULT] Standard-library runtime; no custom image build.
      storageClassName: ""  # [OPERATOR] Empty uses cluster default; durable state must survive redeployment.
      storageSize: 1Gi  # [DEFAULT] One SQLite delivery journal, single replica.
    incidents:
      manageTemplates: true  # [OPERATOR] CLI --apply sets templates on this network's managed integrations.
      notifySubscribers: false  # [OPERATOR] Opt in after incident wording and delivery acceptance.
    heartbeat:
      enabled: false  # [OPERATOR] Enable independent Instatus detection of lost monitoring.
      alertIds: []  # [OPERATOR] Instatus monitor alert destination IDs; required when enabled.
      # [GENERATED] Cron monitor: 180s period + 180s grace, no public component/incident.
      # [PRIVATE GENERATED] secrets/status-page/heartbeat.json and heartbeat.secret.yaml.
    health:
      failureFor: 5m  # [DEFAULT] Continuous failure confirmation.
      recoveryFor: 10m  # [DEFAULT] Continuous fresh health before recovery; resets on restart/gaps.
      freshnessSeconds: 120  # [DEFAULT] Maximum observation/snapshot age.
      minimumProbeLocations: 2  # [EXTERNAL MODE ONLY] Independent locations; unused in alloy mode.
      maxBlockAgeSeconds: 120  # [OPERATOR] Confirm continuous block production and normal block period.
      maxRpcLatencySeconds: 2  # [DEFAULT] p95 threshold after at least 10 samples within 5 minutes.
      maxIndexLagSeconds: 120  # [DEFAULT] Explorer indexed block vs canonical RPC block time.
      maxNodeLagSeconds: 120  # [DEFAULT] Follower/canary lag measured in canonical block time.
      depositDeadlineSeconds: 0  # [REQUIRED FOR BUILTIN] Set confirmed normal processing deadline; 0 means unconfigured.
      wfStallSeconds: 3600  # [DEFAULT] No WF progress with overdue queued/in-flight work; affects BOTH deposits and withdrawals.
      withdrawalDeadlineSeconds: 0  # [REQUIRED FOR BUILTIN] Count only protocol-eligible, unfulfilled withdrawals.
      batchPublicationDeadlineSeconds: 0  # [REQUIRED FOR BUILTIN] Include time awaiting transaction confirmation.
      ethDaSubmitterJobRegex: eth-da-submitter  # [OPERATOR] Prometheus job for the actual publisher.
      withdrawalProcessorJobRegex: withdrawal-processor  # [OPERATOR] Withdrawal role only; exclude proof-work-only replicas.
    nodeSync:
      mode: external  # [OPERATOR] Set official and select deployed sources below to use in-cluster followers.
      namespace: ""  # [OPERATOR] Node namespace; empty uses scroll-monitor's Helm namespace.
      image: python:3.12.11-alpine3.22  # [DEFAULT] Read-only RPC collector; no Instatus credentials.
      reference: {}  # [SOURCE] Exactly one ACTIVE sequencer release (one replica, allowEmptyBlocks: true).
      # reference: {values: l2-reth-sequencer-production.yaml, release: l2-reth-sequencer, role: sequencer}
      followers: []  # [SOURCE] Select effective values/release pairs, including numbered bootnode files when deployed.
      # followers:
      #   - {values: l2-reth-bootnode-production.yaml, release: l2-reth-bootnode, role: bootnode}
      #   - {values: l2-reth-rpc-production.yaml, release: l2-reth-rpc, role: internal-rpc}
      #   - {values: l2-reth-rpc-public-production.yaml, release: l2-reth-rpc-public, role: public-rpc}
      # [DERIVED] Service name, HTTP port, replica count and chain ID come from each selected values file.
      # Optional per-source service overrides templated/custom names. replicas: 0 excludes intentional standby.
      # All selected follower Pods must be observed. A missing/stale reference produces unknown.
    probes:
      websocketImage: node:22.23.3-alpine3.23  # [DEFAULT] Auxiliary container in the existing Alloy Pod when WSS is configured.
      mode: alloy  # [OPERATOR] Existing Alloy probes public entrypoints; external retains browser/chain-aware probes.
      # [SCOPE] Alloy checks HTTP/TLS, RPC chain ID/block-number patterns and API availability.
      # Browser rendering and indexing freshness require external checks.
      # WebSocket uses the Alloy helper; continuous sequencing uses the official reference collector.
      # CLI narrows public descriptions/readiness accordingly; unsupported built-ins stay unready.
      # Automatic publication in alloy mode requires heartbeat.enabled + internal alertIds above.
      alloyChecks: []  # [OPTIONAL] Additional GET body assertions using RE2, combined with all generated checks.
      # - {component: bridge-portal, url: 'https://YOUR_PUBLIC_API/health', bodyRegex: ['"status"\s*:\s*"ok"']}
      # URLs must use public DNS/ingress with valid TLS, without privileged allowlisting or credentials.
      # [GENERATED] generated.alloyProbes modules/targets/revision; never deploy a separate probe chart in alloy mode.
      metricsTargets: []  # [OPERATOR] EXTERNAL ONLY: Private host:port per location; empty in alloy mode.
      # Empty if your existing private federation/remote-write already supplies the probe metrics.
      sequencingMode: auto  # [DERIVED] Selected reth.sequencer.allowEmptyBlocks; on-demand requires a custom eligible-work rule.
      # Set bridgeChecks: disabled in Alloy mode when the legacy history API is retired.
      # This explicitly monitors page availability only; auto still requires the API.
      bridgeChecks: auto  # [DERIVED] Frontend history /txs API; Alloy uses URLs only. JSON path/type overrides require external mode.
      explorerApiUrls: []  # [GENERATED/OPERATOR] CLI can derive Blockscout backend ingress; [] requires an override.
      explorerSelector: ""  # [OPERATOR] EXTERNAL ONLY: Reviewed CSS selector proving rendered explorer data.
      nodeRpcUrl: ""  # [OPERATOR] Independently operated sync canary; override per external probe location.
      nodeDependencyChecks: []  # [OPERATOR] Semantic JSON checks for public bootstrap/DA dependencies.
    # [REQUIRED BEFORE AUTOMATIC] Set components.<key>.affectedStatus after reviewing
    # that rule's impact: DEGRADEDPERFORMANCE / PARTIALOUTAGE / MAJOROUTAGE.
    # No implicit severity. A binary built-in does NOT dynamically distinguish them.
    # Mixed latency/availability rules need separate severity evidence for dynamic grading.
    components:
      public-rpc: {mode: automatic, rule: {builtin: true}}
      sequencing: {mode: automatic, rule: {builtin: true}}
      deposits: {mode: automatic, affectedStatus: MAJOROUTAGE, rule: {builtin: true}}
      withdrawals: {mode: automatic, affectedStatus: MAJOROUTAGE, rule: {builtin: true}}
      batch-publication: {mode: automatic, rule: {builtin: true}}
      node-sync: {mode: automatic, rule: {builtin: true}}
      bridge-portal: {mode: automatic, rule: {builtin: true}}
      block-explorer: {mode: automatic, rule: {builtin: true}}
    # Custom rule alternative: {builtin: false, expr: '<EXACTLY_ONE_0_OR_1_SERIES>', for: 5m}
    # 0=healthy, 1=affected, absent=unknown; expression must enforce source completeness/freshness.
    # [GENERATED] Per-component instatus-<key> contact point, rule UID status-<key>.
    # [PRIVATE GENERATED] Secret instatus-<key>-webhook, key url; secrets/status-page/<key>.binding.json and .secret.yaml.
    # --apply --create-webhook creates/reuses one integration per automatic component.
    # EXTERNAL ONLY: --probe-values values/status-page-probe-production.yaml exports deep-probe values.
  instatus:
    workspaceSlug: 6wxpx  # [OPERATOR] Existing DogeOS workspace; validated by --plan/--apply.
    pageId: ""  # [GENERATED] Shared dogeos page ID; same for all three deployments.
    subdomain: dogeos  # [CONVENTION] One public page for Mainnet, Testnet and Devnet.
    pageName: DogeOS  # [SHARED] Keep page name/branding identical across deployments.
    groupId: ""  # [GENERATED] Discovered from the group named Mainnet/Testnet/Devnet.
    # [ONE-TIME SETUP] DogeOS network groups already exist; reuse them on every deployment.
    # For a NEW page only, initialize missing groups in the Instatus dashboard.
    # Public REST API can attach components to groups; group creation requires the dashboard.
    branding:  # [SHARED DEFAULTS] Official DogeOS brand assets; {} leaves existing branding unchanged.
      # Upload the logo in Instatus Look & feel; omitted here to preserve that URL.
      # Raw GitHub logo URLs are rejected by the public page image optimizer.
      faviconUrl: https://raw.githubusercontent.com/DogeOS69/web-images/main/dogeos_favicon.png
      websiteUrl: https://www.dogeos.com/
    email: ""  # [OPERATOR] Page owner email; required only when creating a page.
    initialStatus: OPERATIONAL  # [DEFAULT] Initial state for NEW components only; existing live status is preserved.
    # This initializes the page; it is not a health-check result. Override if needed.
    # Allowed: OPERATIONAL, UNDERMAINTENANCE, DEGRADEDPERFORMANCE, PARTIALOUTAGE, MAJOROUTAGE.
    showUptime: false  # [OPERATOR] Enable after public alert coverage/history is ready.
    componentIds: {}  # [GENERATED] Persisted by --apply; may map existing component keys to IDs.
  # [GENERATED] catalog and generated are written by the CLI; do not edit manually.
  # Native grafana.envValueFrom and grafana.alerting are generated too.
  # [SECRET] INSTATUS_API_KEY is an environment variable used by CLI --plan/--apply only.
  # Legacy bootstrap (without publication block): scrollsdk setup status-page --plan --create-webhook, then --apply --create-webhook.
  # [PRIVATE GENERATED] secrets/status-page/binding.json + grafana.secret.yaml.
  # Keep that directory in private backups; ordinary --apply reuses it.
  # Apply grafana.secret.yaml to the existing Grafana namespace separately.
  # Existing URL: --apply --webhook-url-file /private/instatus-grafana.url.
  # [GENERATED] generated.webhookRequested prevents replacement if private state is lost.
  # Neither API key, webhook URL nor integration ID belongs in this YAML.

monitoring:
  datasources:
    prometheus:
      name: Prometheus
      uid: scroll-prometheus
      url: http://prometheus-prometheus:9090
    loki:
      enabled: true
      name: Loki
      uid: scroll-loki
      url: http://loki:3100
      tenantId: "1"

grafana:
  enabled: true
  fullnameOverride: grafana
  nameOverride: grafana
  deploymentStrategy:
    type: Recreate
  adminUser: admin
  adminPassword: scroll-sdk
  grafana.ini:
    unified_alerting:
      enabled: true
    # SMTP transport is configured here; recipients are edited in Contact points.
    smtp:
      enabled: false
  # Set smtp.existingSecret for SMTP user/password (keys: user, password).
  smtp:
    existingSecret: ""
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'kubernetes'
          orgId: 1
          folder: 'kubernetes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes/
        - name: 'dogeos'
          orgId: 1
          folder: 'dogeos'
          type: file
          disableDeletion: false
          allowUiUpdates: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/dogeos/
        - name: 'reth'
          orgId: 1
          folder: 'reth'
          type: file
          disableDeletion: false
          allowUiUpdates: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/reth/
        - name: 'blockscout'
          orgId: 1
          folder: 'blockscout'
          type: file
          disableDeletion: false
          allowUiUpdates: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/blockscout/
  dashboardsConfigMaps:
    kubernetes: grafana-kubernetes-dashboards
    dogeos: grafana-dogeos-dashboards
    reth: grafana-reth-dashboards
    blockscout: grafana-blockscout-dashboards
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - "grafana.scrollsdk"
  extraConfigmapMounts:
    - name: grafana-datasources
      mountPath: /etc/grafana/provisioning/datasources/scroll-datasources.yaml
      subPath: datasources.yaml
      configMap: grafana-datasources-config
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
    annotations:
      "helm.sh/resource-policy": keep

dashboards:
  bundled:
    # Set false when dashboard ConfigMaps are managed outside this chart and
    # referenced through grafana.dashboardsConfigMaps.
    enabled: true

grafanaAlerting:
  # Seed editable, enabled Grafana-managed application rules via the HTTP API.
  # Untouched expressions/thresholds follow chart upgrades; UI edits and pause
  # state are preserved. Legacy rules without a baseline report drift safely.
  enabled: true
  # Explicit rule-name -> boolean overrides. Unlike default pause state, these
  # also apply to existing chart-managed rules. Remove an override for UI control.
  pauseRules: {}
  folderUID: scroll-monitor-alerts
  folderTitle: Scroll Monitor Alerts
  logs:
    # Error/fatal/panic levels or plain error/panic prefixes in the last 5m.
    # Excludes the retired rollup explorer and its exporter module.
    # Only installed when the Grafana Loki datasource is enabled.
    enabled: true
  # Empty uses the bundled Grafana service. Include a subpath if configured.
  url: ""
  # Optional Grafana service-account token Secret (key: token). Otherwise the
  # job uses grafana.admin.existingSecret or the chart's Grafana admin Secret.
  authSecret: ""
  image: python:3.12.11-alpine3.22
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# TSO is scraped by default. Disable this supplemental monitor only when the
# TSO chart already owns a monitor or TSO is intentionally absent.
# Supplemental monitors for services whose own chart does not create one.
# Enable only one monitor per endpoint to avoid duplicate scraping. These
# discover Services in the scroll-monitor release namespace, using named ports.
additionalServiceMonitors:
  tso:
    enabled: true
    selector:
      matchLabels:
        app.kubernetes.io/name: tso-service
        app.kubernetes.io/instance: tso-service
    endpoints:
      - port: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

# Extended per-service diagnostics are created in Grafana but start paused.
# Existing Grafana rules retain their UI pause state on every upgrade.
# Prometheus fallback omits these rules while paused=true.
serviceAlerts:
  enabled: true
  paused: true

dogecoinIndexerAlerts:
  # Alert when an indexer's synced height stays unchanged for 2 minutes.
  # Generator: match the actual Prometheus job names; no confirmation input needed.
  jobRegex: "l1-interface|withdrawal-processor"

businessAlerts:
  enabled: true
  jobMaxAgeSeconds: 900
  proofStuckFor: 5m
  recoveryFor: 15m
  signerFailureFor: 5m
  publicationDeadlineSeconds: 3600
  # Optional exact quorum checks. Copy thresholds from the active bridge policy;
  # registration roles are case-sensitive (e.g. Correctness, Attestation).
  # Runtime signing timeout/blocked-work alerts are always included.
  requiredSignersByRole: {}

balanceMonitoring:
  enabled: true
  feeWallet:
    enabled: true
    # Total canonical unredeemed UTXOs, not reservation-adjusted spendable funds.
    minimumDoge: 100
    jobRegex: ".*withdrawal-processor.*"
  ethereum:
    feeOracle:
      enabled: true
      minimumEth: 5
      address: ""
      # Fee oracle submits to its configured L2 RPC. Override for another chain.
      rpcUrl: http://l2-rpc:8545
      expectedChainId: ""
    ethDaSubmitter:
      enabled: true
      minimumEth: 0.1
      address: ""
      rpcUrl: ""
      expectedChainId: ""
  exporter:
    enabled: true
    image: python:3.12.11-alpine3.22
    imagePullPolicy: IfNotPresent
    imagePullSecrets: []
    intervalSeconds: 60
    rpcTimeoutSeconds: 10
    # Optional Secret of SCROLL_BALANCE_* environment variables, for RPC secrets.
    # Explicit nonempty ethereum.* values take precedence over this Secret.
    envFromSecret: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

prometheusRules:
  # Fallback for external Grafana / Prometheus-only deployments. Suppressed when
  # bundled Grafana alerting is enabled, so application alerts evaluate once.
  enabled: true
  labels: {}

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: 'filesystem'
    limits_config:
      retention_period: 14d
    compactor:
      retention_enabled: true
      compaction_interval: 10m
      delete_request_store: filesystem
      retention_delete_delay: 2h
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      enableStatefulSetAutoDeletePVC: false
  read:
    replicas: 0
  backend:
    replicas: 0
  write:
    replicas: 0

alloy:
  enabled: true
  logs:
    enabled: true
    namespaces: []
    podLabels: {}
    loki:
      url: http://loki:3100/loki/api/v1/push
      tenantId: "1"
    l1InterfaceMetrics:
      enabled: true
  metrics:
    otlp:
      enabled: true
    prometheusRemoteWrite:
      url: http://prometheus-prometheus:9090/api/v1/write
      jobPrefix: scroll-sdk
  fullnameOverride: grafana-alloy
  alloy:
    configMap:
      create: false
      name: grafana-alloy-config
      key: config.alloy
    clustering:
      enabled: false
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
  controller:
    type: statefulset
    replicas: 1
    autoscaling:
      enabled: false
  serviceMonitor:
    enabled: true
    interval: 15s

kube-prometheus-stack:
  enabled: true
  nameOverride: prometheus
  fullnameOverride: prometheus
  prometheus:
    enabled: true
    prometheusSpec:
      enableRemoteWriteReceiver: true
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      serviceMonitorSelector:
        matchExpressions:
          - key: app.kubernetes.io/instance
            operator: Exists
      # Scope discovery to the Helm release namespace without requiring
      # monitoring-specific labels on application ServiceMonitors.
      serviceMonitorNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ['{{ .Release.Namespace }}']
      # Blockscout frontend exports through a PodMonitor, without a `release`
      # label. Use the same namespace-scoped discovery contract as Services.
      podMonitorSelector:
        matchExpressions:
          - key: app.kubernetes.io/instance
            operator: Exists
      podMonitorNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'

  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  grafana:
    enabled: false

  prometheus-node-exporter:
    nameOverride: node-exporter
    fullnameOverride: node-exporter
  kube-state-metrics:
    nameOverride: kube-state-metrics
    fullnameOverride: kube-state-metrics

# The bundled Dstack/GPU dashboard is always available, even without metrics.
# Optional internal dstack alerts and log collection. Apply values/dstack.yaml as an overlay
# to also allow ServiceMonitor discovery in the controller namespace.
dstack:
  enabled: false
  namespace: dstack-system
  # Must match the controller Deployment name (prefer fullnameOverride).
  controllerName: dstack-controller
  alerts:
    enabled: true
    unavailableFor: 2m
    failedRunsThreshold: 3
  # Optional always-on host Alloy collectors; empty inventory permits autoscaling to zero.
  # Stable host IDs, explicitly retired from this list on decommission.
  gpuHosts:
    enabled: false
    expectedHosts: []
    staleAfterSeconds: 180
    unavailableFor: 5m
    diskAvailableRatio: 0.1

# EKS exposes managed scheduler/controller-manager metrics through the API server.
# Also disable kubeScheduler.serviceMonitor.enabled and
# kubeControllerManager.serviceMonitor.enabled in kube-prometheus-stack when
# enabling this profile. Keep their enabled/defaultRules switches on.
eksControlPlane:
  enabled: false

# Receiver credentials remain in your existing Alertmanager configuration/Secret.
# Set true to reject upgrades whose inline configuration still drops all alerts.
# With alertmanagerSpec.useExistingSecret=true, verify the referenced Secret
# separately; Helm cannot inspect it during an offline render.
infrastructureAlerts:
  requireReceiver: false

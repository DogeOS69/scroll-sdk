monitoring:
  datasources:
    prometheus:
      name: Prometheus
      uid: scroll-prometheus
      url: http://prometheus-prometheus:9090
    loki:
      enabled: true
      name: Loki
      uid: scroll-loki
      url: http://loki:3100
      tenantId: "1"

grafana:
  enabled: true
  fullnameOverride: grafana
  nameOverride: grafana
  deploymentStrategy:
    type: Recreate
  adminUser: admin
  adminPassword: scroll-sdk
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'scroll'
          orgId: 1
          folder: 'scroll'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/scroll/
        - name: 'kubernetes'
          orgId: 1
          folder: 'kubernetes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes/
        - name: 'dogeos'
          orgId: 1
          folder: 'dogeos'
          type: file
          disableDeletion: false
          allowUiUpdates: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/dogeos/
        - name: 'reth'
          orgId: 1
          folder: 'reth'
          type: file
          disableDeletion: false
          allowUiUpdates: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/reth/
        - name: 'blockscout'
          orgId: 1
          folder: 'blockscout'
          type: file
          disableDeletion: false
          allowUiUpdates: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/blockscout/
  dashboardsConfigMaps:
    scroll: grafana-scroll-dashboards
    kubernetes: grafana-kubernetes-dashboards
    dogeos: grafana-dogeos-dashboards
    reth: grafana-reth-dashboards
    blockscout: grafana-blockscout-dashboards
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - "grafana.scrollsdk"
  extraConfigmapMounts:
    - name: grafana-datasources
      mountPath: /etc/grafana/provisioning/datasources/scroll-datasources.yaml
      subPath: datasources.yaml
      configMap: grafana-datasources-config
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
    annotations:
      "helm.sh/resource-policy": keep

dashboards:
  bundled:
    # Set false when dashboard ConfigMaps are managed outside this chart and
    # referenced through grafana.dashboardsConfigMaps.
    enabled: true

prometheusRules:
  # Metric alerts are independent of the bundled Grafana instance and can be
  # consumed by any Prometheus Operator watching this namespace.
  enabled: true
  labels: {}

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: 'filesystem'
    limits_config:
      retention_period: 14d
    compactor:
      retention_enabled: true
      compaction_interval: 10m
      delete_request_store: filesystem
      retention_delete_delay: 2h
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      enableStatefulSetAutoDeletePVC: false
  read:
    replicas: 0
  backend:
    replicas: 0
  write:
    replicas: 0

alloy:
  enabled: true
  logs:
    enabled: true
    namespaces: []
    podLabels: {}
    loki:
      url: http://loki:3100/loki/api/v1/push
      tenantId: "1"
    l1InterfaceMetrics:
      enabled: true
  metrics:
    otlp:
      enabled: true
    prometheusRemoteWrite:
      url: http://prometheus-prometheus:9090/api/v1/write
      jobPrefix: scroll-sdk
  fullnameOverride: grafana-alloy
  alloy:
    configMap:
      create: false
      name: grafana-alloy-config
      key: config.alloy
    clustering:
      enabled: false
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
  controller:
    type: statefulset
    replicas: 1
    autoscaling:
      enabled: false
  serviceMonitor:
    enabled: true
    interval: 15s

kube-prometheus-stack:
  enabled: true
  nameOverride: prometheus
  fullnameOverride: prometheus
  prometheus:
    enabled: true
    prometheusSpec:
      enableRemoteWriteReceiver: true
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      alerting:
        alertmanagers:
          - name: alertmanager-main
            namespace: default
            port: web
      serviceMonitorSelector:
        matchExpressions:
          - key: app.kubernetes.io/instance
            operator: Exists
      # Scope discovery to the Helm release namespace without requiring
      # monitoring-specific labels on application ServiceMonitors.
      serviceMonitorNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'

  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  grafana:
    enabled: false

  prometheus-node-exporter:
    nameOverride: node-exporter
    fullnameOverride: node-exporter
  kube-state-metrics:
    nameOverride: kube-state-metrics
    fullnameOverride: kube-state-metrics

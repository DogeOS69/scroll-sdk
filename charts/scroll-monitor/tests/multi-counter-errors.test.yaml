rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: EthDASubmitterFailures with simultaneous flat historical counters
  interval: 1m
  input_series:
  - series: eth_da_submitter_submission_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  - series: eth_da_submitter_cycle_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  - series: eth_da_submitter_lifecycle_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  - series: eth_da_submitter_l2_reorg_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="EthDASubmitterFailures",alertstate="firing"}) or
      vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
- name: EthDASubmitterFailures with simultaneous counters and one increasing
  interval: 1m
  input_series:
  - series: eth_da_submitter_submission_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  - series: eth_da_submitter_cycle_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  - series: eth_da_submitter_lifecycle_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 100x30
  - series: eth_da_submitter_l2_reorg_failures_total{namespace="monitoring",job="l2-reth",instance="one"}
    values: 0+1x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="EthDASubmitterFailures",alertstate="firing"}) or
      vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1

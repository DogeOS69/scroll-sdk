# Behavioral PromQL fixtures; service exposition belongs in the service source repository.
rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: WithdrawalProcessorMetricsTargetDown fires
  interval: 1m
  input_series:
  - series: up{job="withdrawal-processor",instance="bad"}
    values: '0x60'
  promql_expr_test:
  - expr: sum(ALERTS{alertname="WithdrawalProcessorMetricsTargetDown",alertstate="firing"})
    eval_time: 45m
    exp_samples:
    - labels: '{}'
      value: 1
- name: WithdrawalProcessorMetricsTargetDown stays healthy
  interval: 1m
  input_series:
  - series: up{job="withdrawal-processor",instance="bad"}
    values: 1x60
  promql_expr_test:
  - expr: sum(ALERTS{alertname="WithdrawalProcessorMetricsTargetDown",alertstate="firing"})
    eval_time: 45m
    exp_samples: []
- name: WithdrawalProcessor unready running pod
  interval: 1m
  input_series:
  - series: kube_pod_status_ready{namespace="n",pod="withdrawal-processor-abc",condition="true"}
    values: '0x60'
  - series: kube_pod_status_phase{namespace="n",pod="withdrawal-processor-abc",phase="Running"}
    values: 1x60
  promql_expr_test:
  - expr: sum(ALERTS{alertname="WithdrawalProcessorPodNotReady",alertstate="firing"})
    eval_time: 45m
    exp_samples:
    - labels: '{}'
      value: 1
- name: WithdrawalProcessor completed pod excluded
  interval: 1m
  input_series:
  - series: kube_pod_status_ready{namespace="n",pod="withdrawal-processor-abc",condition="true"}
    values: '0x60'
  - series: kube_pod_status_phase{namespace="n",pod="withdrawal-processor-abc",phase="Succeeded"}
    values: 1x60
  promql_expr_test:
  - expr: sum(ALERTS{alertname="WithdrawalProcessorPodNotReady",alertstate="firing"})
    eval_time: 45m
    exp_samples: []

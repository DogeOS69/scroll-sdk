rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: Deployment unavailable then recovered
  interval: 1m
  input_series:
  - series: kube_deployment_spec_replicas{namespace="monitoring",deployment="worker"}
    values: 2x20
  - series: kube_deployment_status_replicas_available{namespace="monitoring",deployment="worker"}
    values: 0x3 2x16
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessDeploymentUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessDeploymentUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="BusinessDeploymentUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessDeploymentReplicasDegraded",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Deployment partial capacity
  interval: 1m
  input_series:
  - series: kube_deployment_spec_replicas{namespace="monitoring",deployment="worker"}
    values: 2x20
  - series: kube_deployment_status_replicas_available{namespace="monitoring",deployment="worker"}
    values: 1x20
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessDeploymentUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessDeploymentReplicasDegraded",alertstate="firing"}) or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessDeploymentReplicasDegraded",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Deployment intentionally scaled to zero

- name: Job attempts vs terminal failure
  interval: 1m
  input_series:
  - series: kube_job_status_failed{namespace="monitoring",job_name="backup"}
    values: 2x20
  - series: kube_job_failed{namespace="monitoring",job_name="backup",condition="true"}
    values: 0x5 1x14
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessJobFailed",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessJobFailed",alertstate="firing"}) or vector(0)
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 1
- name: other namespace workloads ignored
  interval: 1m
  input_series:
  - series: kube_deployment_spec_replicas{namespace="other",deployment="worker"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="other",deployment="worker"}
    values: '0x20'
  - series: kube_job_failed{namespace="other",job_name="backup",condition="true"}
    values: 1x20
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessDeploymentUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessJobFailed",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
- name: readiness recovery resets crash loop pending
  interval: 1m
  input_series:
  - series: kube_pod_container_status_waiting_reason{namespace="monitoring",pod="worker-0",uid="uid-1",container="app",reason="CrashLoopBackOff"}
    values: 1x20
  - series: kube_pod_status_ready{namespace="monitoring",pod="worker-0",uid="uid-1",condition="true"}
    values: 0x3 1x16
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessPodCrashLooping",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessPodCrashLooping",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
- name: repeated restarts threshold
  interval: 1m
  input_series:
  - series: kube_pod_container_status_restarts_total{namespace="monitoring",pod="worker-0",uid="uid-1",container="app"}
    values: 0x3 1 2 3x15
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessPodRepeatedRestarts",alertstate="firing"}) or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessPodRepeatedRestarts",alertstate="firing"}) or vector(0)
    eval_time: 7m
    exp_samples:
    - labels: '{}'
      value: 1
- name: unready running pod then deletion
  interval: 1m
  input_series:
  - series: kube_pod_status_ready{namespace="monitoring",pod="worker-0",uid="uid-1",condition="true"}
    values: '0x20'
  - series: kube_pod_status_phase{namespace="monitoring",pod="worker-0",uid="uid-1",phase="Running"}
    values: 1x20
  - series: kube_pod_deletion_timestamp{namespace="monitoring",pod="worker-0",uid="uid-1"}
    values: _ _ _ _ _ _ _ _ _ _ _ _ 720x8
  promql_expr_test:
  - expr: count(ALERTS{alertname="BusinessPodNotReady",alertstate="firing"}) or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="BusinessPodNotReady",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="BusinessPodNotReady",alertstate="firing"}) or vector(0)
    eval_time: 13m
    exp_samples:
    - labels: '{}'
      value: 0

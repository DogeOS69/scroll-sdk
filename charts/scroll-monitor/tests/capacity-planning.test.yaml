rule_files:
- rules.yaml
evaluation_interval: 5m
tests:
- name: NodeDisk forecast with initial free 1000
  interval: 5m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a",mountpoint="/data",device="/dev/sda",fstype="ext4"}
    values: 10000x100
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a",mountpoint="/data",device="/dev/sda",fstype="ext4"}
    values: 1000-5x100
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a",mountpoint="/data",device="/dev/sda",fstype="ext4"}
    values: '0x100'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskFillingUp",alertstate="firing"}) or vector(0)
    eval_time: 5h
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeDiskFillingUp",alertstate="firing"}) or vector(0)
    eval_time: 6h
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeDiskFillingUp",alertstate="firing"}) or vector(0)
    eval_time: 6h30m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeDiskFillingUpCritical",alertstate="firing"}) or vector(0)
    eval_time: 6h
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeDiskFillingUpCritical",alertstate="firing"}) or vector(0)
    eval_time: 6h5m
    exp_samples:
    - labels: '{}'
      value: 0

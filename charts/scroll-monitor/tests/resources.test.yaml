rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: node memory available 10 percent
  interval: 1m
  input_series:
  - series: node_memory_MemTotal_bytes{job="node-exporter",instance="node-a:9100"}
    values: 100x30
  - series: node_memory_MemAvailable_bytes{job="node-exporter",instance="node-a:9100"}
    values: 10x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeMemoryUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeMemoryUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeMemoryUsageHighCritical",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 0
- name: node memory available 11 percent

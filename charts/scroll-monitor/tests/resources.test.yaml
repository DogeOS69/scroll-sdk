- name: node memory spike recovers before pending duration
  interval: 1m
  input_series:
  - series: node_memory_MemTotal_bytes{job="node-exporter",instance="node-a:9100"}
    values: 100x30
  - series: node_memory_MemAvailable_bytes{job="node-exporter",instance="node-a:9100"}
    values: 3x3 50x26
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeMemoryUsageHighCritical",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeMemoryUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 0
- name: container memory 84 percent limit
  interval: 1m
  input_series:
  - series: container_memory_working_set_bytes{job="kubelet",metrics_path="/metrics/cadvisor",namespace="monitoring",pod="worker-0",container="app",image="fake",instance="node-a"}
    values: 84x30
  - series: kube_pod_container_resource_limits{namespace="monitoring",pod="worker-0",container="app",resource="memory",unit="byte"}
    values: 100x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="ContainerMemoryUsageHigh",alertstate="firing"}) or vector(0)

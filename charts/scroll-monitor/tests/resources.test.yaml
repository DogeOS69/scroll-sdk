- name: node high CPU sustained not spike
  interval: 1m
  input_series:
  - series: node_cpu_seconds_total{job="node-exporter",instance="node-a",cpu="0",mode="idle"}
    values: 0+3x30
  - series: node_cpu_seconds_total{job="node-exporter",instance="node-a",cpu="1",mode="idle"}
    values: 0+3x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeCPUUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeCPUUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 16m
    exp_samples:
    - labels: '{}'
      value: 1

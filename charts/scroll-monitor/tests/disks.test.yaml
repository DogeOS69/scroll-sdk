rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: node at 80 percent stays healthy because kubelet image garbage collection owns that range
  interval: 1m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 100x40
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 20x40
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: '0x40'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 35m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeDiskUsageHighCritical",alertstate="firing"}) or vector(0)
    eval_time: 35m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeDataDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 35m
    exp_samples:
    - labels: '{}'
      value: 0
- name: node below 85 remains healthy
  interval: 1m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 100x40
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 15.1x40
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: '0x40'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 35m
    exp_samples:
    - labels: '{}'
      value: 0
- name: node fires exactly at 85 percent after thirty minutes

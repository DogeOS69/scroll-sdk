rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: node fires exactly at 80 percent after five minutes
  interval: 1m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 100x10
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 20x10
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: '0x10'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
- name: node below 80 remains healthy
  interval: 1m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 100x10
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 20.1x10
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: '0x10'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 0
- name: node above 80 fires
  interval: 1m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 100x10
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 10x10
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: '0x10'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
- name: node cleanup resolves alert
  interval: 1m
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 100x10
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: 10x5 30x5
  - series: node_filesystem_readonly{job="node-exporter",instance="node-a:9100",device="/dev/sda1",mountpoint="/",fstype="ext4"}
    values: '0x10'
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeDiskUsageHigh",alertstate="firing"}) or vector(0)
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 0

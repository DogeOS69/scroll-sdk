rule_files:
- ../alerts/dogeos.yaml
evaluation_interval: 1m
tests:
- name: ProtocolStateWFTxNumberStalled-flat-zero
  interval: 1m
  input_series:
  - series: withdrawal_processor_protocol_state_wf_tx_number{job="withdrawal-processor",namespace="monitoring"}
    values: 0+0x120
  alert_rule_test:
  - eval_time: 59m
    alertname: ProtocolStateWFTxNumberStalled
    exp_alerts: []
  - eval_time: 60m
    alertname: ProtocolStateWFTxNumberStalled
    exp_alerts:
    - exp_labels:
        job: withdrawal-processor
        namespace: monitoring
        severity: critical
      exp_annotations:
        summary: Protocol State WF Tx Number has not increased for 60 minutes.
        description: Job withdrawal-processor in namespace monitoring has made no
          Protocol State WF Tx Number progress for 60 minutes. Check the service and
          its upstream dependencies.
  - eval_time: 90m
    alertname: ProtocolStateWFTxNumberStalled
    exp_alerts:
    - exp_labels:
        job: withdrawal-processor
        namespace: monitoring
        severity: critical
      exp_annotations:
        summary: Protocol State WF Tx Number has not increased for 60 minutes.
        description: Job withdrawal-processor in namespace monitoring has made no
          Protocol State WF Tx Number progress for 60 minutes. Check the service and
          its upstream dependencies.

rule_files:
- ../alerts/dogeos.yaml
evaluation_interval: 1m
tests:
- name: EthDASubmitterFailures-only-one-counter-exists
  interval: 1m
  input_series:
  - series: eth_da_submitter_submission_failures_total
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EthDASubmitterFailures
    exp_alerts:
    - exp_labels:
        severity: critical
        service: eth-da-submitter
      exp_annotations:
        summary: Ethereum DA submitter is reporting failures.
        description: 10 submission, cycle, lifecycle, or L2 reorg failure(s) were recorded in the last 10 minutes. Check the submitter logs for the failing stage, then its Ethereum RPC and signer responses.
- name: EthDASubmitterFailures-no-error
  interval: 1m
  input_series:
  - series: eth_da_submitter_submission_failures_total
    values: 0+0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EthDASubmitterFailures
    exp_alerts: []
- name: FeeOracleErrors-only-one-counter-exists
  interval: 1m
  input_series:
  - series: fee_oracle_chain_rpc_errors_total
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: FeeOracleErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        service: fee-oracle
      exp_annotations:
        summary: Fee oracle is reporting errors.
        description: 10 update, computation, or chain RPC error(s) were recorded in the last 10 minutes. Check fee-oracle logs for the failing stage and its RPC endpoints.
- name: FeeOracleErrors-no-error
  interval: 1m
  input_series:
  - series: fee_oracle_chain_rpc_errors_total
    values: 0+0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: FeeOracleErrors
    exp_alerts: []

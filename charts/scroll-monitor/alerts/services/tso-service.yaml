# Reviewed service-specific diagnostics. Enabled by default.
groups:
- name: dogeos.services.tso-service
  interval: 1m
  rules:
  - alert: TSOSigningCycleSlow
    timing: {"window": "10m", "latencySeconds": 120}
    timingAnnotations: {"summary": "TSO signing cycles average more than __TIME_latencySeconds__ seconds.", "description": "Completed signing cycles average more than __TIME_latencySeconds__ seconds. Check signer response paths and quorum latency."}
    expr: sum by (namespace, job, instance) (rate(tso_core_signing_cycle_latency_seconds_sum[__TIME_window__])) / sum by (namespace,
      job, instance) (rate(tso_core_signing_cycle_latency_seconds_count[__TIME_window__])) > __TIME_latencySeconds__ and sum by (namespace, job,
      instance) (increase(tso_core_signing_cycle_latency_seconds_count[__TIME_window__])) >= 5
    for: 5m
    labels:
      severity: warning
      service: tso-service
    annotations:
      summary: TSO signing cycles average more than two minutes.
      description: Completed signing cycles average more than two minutes. Check signer response paths and quorum
        latency.
  - alert: TSOSignerResponseSlow
    timing: {"window": "10m", "latencySeconds": 60}
    timingAnnotations: {"summary": "A TSO signer takes more than __TIME_latencySeconds__ seconds on average to respond.", "description": "Signer {{ $labels.signer_pubkey }} responses average more than __TIME_latencySeconds__ seconds. Check network and signer backend latency."}
    expr: sum by (namespace, job, instance, signer_pubkey) (rate(tso_core_signer_response_latency_seconds_sum[__TIME_window__]))
      / sum by (namespace, job, instance, signer_pubkey) (rate(tso_core_signer_response_latency_seconds_count[__TIME_window__]))
      > __TIME_latencySeconds__ and sum by (namespace, job, instance, signer_pubkey) (increase(tso_core_signer_response_latency_seconds_count[__TIME_window__]))
      >= 5
    for: 5m
    labels:
      severity: warning
      service: tso-service
    annotations:
      summary: A TSO signer takes more than one minute on average to respond.
      description: Signer {{ $labels.signer_pubkey }} responses average more than one minute. Check network and
        signer backend latency.
  - alert: TSORoleQuorumSlow
    timing: {"window": "10m", "latencySeconds": 120}
    timingAnnotations: {"summary": "TSO {{ $labels.role }} quorum takes more than __TIME_latencySeconds__ seconds on average.", "description": "Role {{ $labels.role }} takes more than __TIME_latencySeconds__ seconds on average to complete its required input thresholds. Check readiness and response latency of this role's signers."}
    expr: sum by (namespace, job, instance, role) (rate(tso_core_signing_role_path_latency_seconds_sum[__TIME_window__])) /
      sum by (namespace, job, instance, role) (rate(tso_core_signing_role_path_latency_seconds_count[__TIME_window__])) > __TIME_latencySeconds__
      and sum by (namespace, job, instance, role) (increase(tso_core_signing_role_path_latency_seconds_count[__TIME_window__]))
      >= 5
    for: 5m
    labels:
      severity: warning
      service: tso-service
    annotations:
      summary: TSO {{ $labels.role }} quorum takes more than two minutes on average.
      description: Role {{ $labels.role }} takes more than two minutes on average to complete its required input
        thresholds. Check readiness and response latency of this role's signers.
  - alert: TSOSigningQueueLarge
    previousExpr: "sum by (namespace, job, instance) (tso_core_transactions_by_status{status=~\"proposed|collecting_signatures|collecting_p2pkh\"}) > 100"
    expr: sum by (namespace, job, instance) (tso_core_transactions_by_status{status=~"proposed|collecting_signatures|collecting_p2pkh"} and on (namespace, job, instance) __TSO_STATUS_VALID__) > 100
    for: 15m
    labels:
      severity: warning
      service: tso-service
    annotations:
      summary: TSO pending signing work exceeds 100 transactions.
      description: Calibrate this capacity threshold against throughput. Check admission pressure, quorum availability,
        and completion rate.
  - alert: TSOShadowforkSentinelAccepted
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) (increase(tso_core_sentinel_signatures_accepted_total[__TIME_window__])) > 0
    labels:
      severity: warning
      service: tso-service
    annotations:
      summary: TSO accepted a shadowfork sentinel signature.
      description: Expected only in an intentionally configured shadowfork. Enable this rule on production signing
        lanes to detect unexpected sentinel use.

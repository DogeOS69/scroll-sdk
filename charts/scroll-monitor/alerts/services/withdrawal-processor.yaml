# Reviewed service-specific diagnostics. Enabled by default.
groups:
- name: dogeos.services.withdrawal-processor
  interval: 1m
  rules:
  - alert: WFFundingDataCorrupt
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance, lane) (increase(withdrawal_processor_wf_corrupt_funding_row_total[__TIME_window__]))
      > 0
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: Persisted WF funding data is corrupt.
      description: Inspect funding amounts, outpoints, and the affected {{ $labels.lane }} lane. Repair the durable
        data before retrying.
  - alert: WFBridgeFundingDeferred
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance, lane) (increase(withdrawal_processor_wf_lane_funding_deferred_total{reason="insufficient_bridge_funding"}[__TIME_window__]))
      > 0
    for: 15m
    labels:
      severity: warning
      service: withdrawal-processor
    annotations:
      summary: WF work remains blocked by bridge funding.
      description: Lane {{ $labels.lane }} is repeatedly withheld from scheduling. Check bridge UTXO availability
        and reservations; this differs from the fee-wallet inventory balance.
  - alert: WFOperatorIntentHeadDrift
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance, action_kind) (increase(withdrawal_processor_operator_intent_head_drift_terminal_total[__TIME_window__]))
      > 0
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: A rotation request was terminalized after replay-head drift.
      description: Review {{ $labels.action_kind }} and submit a fresh operator request with a new idempotency key
        after reconciling the canonical head.
  - alert: WFProofGateInvariantViolation
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) ((label_replace(increase(withdrawal_processor_bridge_gate_checks_total{outcome="invariant_error"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_gate_checks_total", "", "")
      or label_replace(increase(withdrawal_processor_bridge_envelope_enrichment_total{outcome="invariant_error"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_envelope_enrichment_total", "", "")
      or label_replace(increase(withdrawal_processor_bridge_local_runtime_total{outcome="invariant_error"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_local_runtime_total", "", "")
      or label_replace(increase(withdrawal_processor_scroll_batch_gate_checks_total{outcome="invariant_error"}[__TIME_window__]), "error_counter", "withdrawal_processor_scroll_batch_gate_checks_total", "", "")
      or label_replace(increase(withdrawal_processor_bridge_witness_runtime_total{outcome="invariant_error"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_witness_runtime_total", "", "")))
      > 0
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: A WF proof gate or witness invariant failed.
      description: Inspect bridge witness, attestation evidence, and proof-gate diagnostics. Do not bypass the gate.
  - alert: WFWitnessInvariantViolation
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) (increase(withdrawal_processor_bridge_witness_runtime_invariant_total[__TIME_window__]))
      > 0
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: Bridge witness materialization hit a terminal invariant.
      description: Inspect persisted witness inputs and the proof control plane before resubmission.
  - alert: WFProofRuntimeUnavailable
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) ((label_replace(increase(withdrawal_processor_bridge_gate_checks_total{outcome=~"retryable_error|backend_unavailable"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_gate_checks_total", "", "")
      or label_replace(increase(withdrawal_processor_bridge_envelope_enrichment_total{outcome=~"retryable_error|backend_unavailable"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_envelope_enrichment_total", "", "")
      or label_replace(increase(withdrawal_processor_bridge_local_runtime_total{outcome=~"retryable_error|backend_unavailable"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_local_runtime_total", "", "")
      or label_replace(increase(withdrawal_processor_scroll_batch_gate_checks_total{outcome=~"retryable_error|backend_unavailable"}[__TIME_window__]), "error_counter", "withdrawal_processor_scroll_batch_gate_checks_total", "", "")
      or label_replace(increase(withdrawal_processor_bridge_witness_runtime_total{outcome=~"retryable_error|backend_unavailable"}[__TIME_window__]), "error_counter", "withdrawal_processor_bridge_witness_runtime_total", "", "")))
      > 0
    for: 10m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: WF proof dependencies keep failing.
      description: Check prover backends, artifact access, and control-plane RPCs. Ordinary not_ready and skipped
        outcomes are excluded.
  - alert: WFWitnessArtifactMissing
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) (increase(withdrawal_processor_bridge_witness_runtime_artifact_bytes_missing_total[__TIME_window__]))
      > 0
    for: 5m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: Bridge witness artifact bytes remain unavailable.
      description: Check materialization receipts and artifact storage before retrying the WF build.
  - alert: WFTSOHandoffRecoveryFailures
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) ((label_replace(increase(withdrawal_processor_tso_handoff_recovery_failures_total[__TIME_window__]), "error_counter", "withdrawal_processor_tso_handoff_recovery_failures_total", "", "")
      or label_replace(increase(withdrawal_processor_tso_handoff_recovery_age_probe_failures_total[__TIME_window__]), "error_counter", "withdrawal_processor_tso_handoff_recovery_age_probe_failures_total", "", "")))
      > 0
    for: 5m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: TSO handoff recovery cannot complete or observe its backlog.
      description: Check TSO job lookup, callback correlation, and durable job storage.
  - alert: WFTSOHandoffRecoveryBlocked
    timing: {"maxAgeSeconds": 900}
    expr: withdrawal_processor_tso_handoff_recovery_blocked_age_seconds > __TIME_maxAgeSeconds__
    for: 5m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: A stale TSO handoff blocks dispatch.
      description: The oldest blocking handoff has waited {{ $value | humanizeDuration }}. Check recovery enablement, TSO state,
        and callback delivery.
  - alert: WFL2ProofPipelineFailing
    expr: withdrawal_processor_l2_proof_pipeline_consecutive_failures > 0
    for: 5m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: The L2 proof pipeline keeps failing.
      description: Inspect the pipeline error class and data-source availability.
  - alert: WFL2ProofPipelineStale
    timing: {"maxAgeSeconds": 900}
    expr: (time() - withdrawal_processor_l2_proof_pipeline_last_success_timestamp_seconds > __TIME_maxAgeSeconds__) and on (namespace,
      job, instance) (withdrawal_processor_l2_proof_pipeline_enabled == 1)
    for: 5m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: The enabled L2 proof pipeline has no recent successful pass.
      description: Check its worker loop and proof-control storage. Disabled pipelines are excluded.
  - alert: WFBuildQueueStalled
    previousExpr:
      - "withdrawal_processor_protocol_job_oldest_age_seconds{status=~\"queued|building|built|failed_retryable|bug\"} > 1800"
      - "(withdrawal_processor_protocol_job_oldest_age_seconds{status=~\"queued|building|built|failed_retryable|bug\"} and on (namespace, job, instance) __WP_JOBS_VALID__) > 1800"
    # Fall back per target only if it exposes none of the head-aware series.
    # Invalid head observations must not resurrect historical failures.
    timing: {"maxAgeSeconds": 1800}
    expr: >-
      (
        (withdrawal_processor_protocol_job_head_oldest_age_seconds{status=~"queued|building|built|failed_retryable|bug"}
          and on (namespace, job, instance) __WP_JOB_HEAD_VALID__)
        or
        ((withdrawal_processor_protocol_job_oldest_age_seconds{status=~"queued|building|built|failed_retryable|bug"}
          and on (namespace, job, instance) __WP_JOBS_VALID__)
          unless on (namespace, job, instance)
          (withdrawal_processor_protocol_job_head_oldest_age_seconds
            or withdrawal_processor_protocol_snapshot_valid{source="job_head"}
            or withdrawal_processor_protocol_snapshot_timestamp_seconds{source="job_head"}))
      ) > __TIME_maxAgeSeconds__
    for: 10m
    labels:
      severity: critical
      service: withdrawal-processor
    annotations:
      summary: A WF job is stuck before successful TSO handoff.
      description: Oldest {{ $labels.action_kind }} job in {{ $labels.status }} has waited {{ $value | humanizeDuration }}. Inspect
        funding, proof gates, and scheduler errors.
  - alert: WFProtocolMetricsReadFailure
    timing: {"window": "5m"}
    expr: sum by (namespace, job, instance) (increase(withdrawal_processor_protocol_metrics_scrape_errors_total[__TIME_window__]))
      > 0
    for: 5m
    labels:
      severity: warning
      service: withdrawal-processor
    annotations:
      summary: Withdrawal processor protocol metrics cannot read their source state.
      description: Other gauges may be stale. Check database access and metrics refresh errors.
  - alert: WFDatabasePoolSlow
    timing: {"window": "10m", "latencySeconds": 1}
    timingAnnotations: {"summary": "Withdrawal processor database checkout averages more than __TIME_latencySeconds__ seconds.", "description": "Database checkout averages more than __TIME_latencySeconds__ seconds with at least five observations in __TIME_window__. Check pool saturation and long transactions."}
    expr: sum by (namespace, job, instance) (rate(withdrawal_processor_db_pool_checkout_wait_seconds_sum[__TIME_window__]))
      / sum by (namespace, job, instance) (rate(withdrawal_processor_db_pool_checkout_wait_seconds_count[__TIME_window__]))
      > __TIME_latencySeconds__ and sum by (namespace, job, instance) (increase(withdrawal_processor_db_pool_checkout_wait_seconds_count[__TIME_window__]))
      >= 5
    for: 5m
    labels:
      severity: warning
      service: withdrawal-processor
    annotations:
      summary: Withdrawal processor database checkout averages more than 1 second.
      description: Database checkout averages more than one second with at least five observations in ten minutes.
        Check pool saturation and long transactions.

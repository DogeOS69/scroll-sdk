# Reviewed service-specific diagnostics. New Grafana rules are paused by default.
groups:
- name: dogeos.services.l2-reth
  interval: 1m
  rules:
  - alert: L2RethMetricsTargetDown
    expr: up{job=~".*l2-reth.*"} == 0
    for: 5m
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: A l2-reth metrics target cannot be scraped.
      description: Inspect target {{ $labels.instance }} in job {{ $labels.job }}, the metrics listener, ServiceMonitor,
        and network policy. A removed target requires the Kubernetes workload alerts.
  - alert: L2RethPodNotReady
    expr: kube_pod_status_ready{condition="true",pod=~".*l2-reth.*"} == 0 and on (namespace, pod) kube_pod_status_phase{phase=~"Pending|Running"}
      == 1
    for: 10m
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: A l2-reth pod is not ready.
      description: Inspect pod {{ $labels.pod }} readiness, startup, configuration, and dependency health. Completed
        Job pods are excluded.
  - alert: L2RethNoPeers
    expr: reth_network_connected_peers{job=~".*l2-reth.*"} == 0
    for: 10m
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: An L2 Reth node has no connected peers.
      description: Check static peers, discovery, firewall rules, and network ID. Leave paused for nodes intentionally
        deployed without peers.
  - alert: L2RethHeadStalled
    expr: max_over_time((reth_blockchain_tree_canonical_chain_height{job=~".*l2-reth.*"} > bool reth_blockchain_tree_canonical_chain_height{job=~".*l2-reth.*"}
      offset 1m)[15m:1m]) == 0 and reth_blockchain_tree_canonical_chain_height{job=~".*l2-reth.*"} offset 15m and
      reth_blockchain_tree_canonical_chain_height{job=~".*l2-reth.*"}
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: An L2 Reth canonical head has not advanced for 15 minutes.
      description: Inspect sequencer production, engine validation, derivation, and peers on {{ $labels.instance
        }}. Enable only on lanes expected to advance continuously.
  - alert: L2RethDerivationStalled
    expr: sum by (namespace, job, instance) ({__name__=~"reth_derivation_pipeline_(batch|payload_attributes)_queue_size",job=~".*l2-reth.*"})
      > 0 and (sum by (namespace, job, instance) (increase(reth_derivation_pipeline_derived_blocks{job=~".*l2-reth.*"}[15m]))
      == 0)
    for: 15m
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: L2 derivation has queued work but produces no blocks.
      description: Check L1 Interface batch data, blob availability, payload validation, and the derivation loop.
  - alert: L2RethPayloadValidationFailed
    expr: sum by (namespace, job, instance) (increase({__name__=~"reth_consensus_engine_beacon_(new_payload|forkchoice_updated)_(invalid|error)",job=~".*l2-reth.*"}[5m]))
      > 0
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: Reth rejected a payload or forkchoice update.
      description: Inspect engine validation errors and canonical data before replaying the affected payload.
  - alert: L2RethDownloaderErrors
    expr: sum by (namespace, job, instance) (increase({__name__=~"reth_downloaders_(headers|bodies)_(timeout|unexpected|validation)_errors",job=~".*l2-reth.*"}[5m]))
      > 0
    for: 10m
    labels:
      severity: warning
      service: l2-reth
    annotations:
      summary: Reth block downloads keep failing.
      description: Check peer health, network transport, and block validation errors.
  - alert: L2RethRPCErrors
    expr: sum by (namespace, job, instance) (rate(reth_rpc_server_calls_failed_total{job=~".*l2-reth.*"}[10m]))
      / sum by (namespace, job, instance) (rate(reth_rpc_server_calls_started_total{job=~".*l2-reth.*"}[10m])) >
      0.1 and sum by (namespace, job, instance) (increase(reth_rpc_server_calls_started_total{job=~".*l2-reth.*"}[10m]))
      >= 100
    for: 5m
    labels:
      severity: warning
      service: l2-reth
    annotations:
      summary: L2 Reth RPC failure ratio exceeds 10 percent.
      description: At least 100 calls were observed in ten minutes. Separate malformed client requests from server
        and dependency faults.
  - alert: L2RethRPCSlow
    expr: sum by (namespace, job, instance) (rate(reth_rpc_server_calls_time_seconds_sum{job=~".*l2-reth.*"}[10m]))
      / sum by (namespace, job, instance) (rate(reth_rpc_server_calls_time_seconds_count{job=~".*l2-reth.*"}[10m]))
      > 2 and sum by (namespace, job, instance) (increase(reth_rpc_server_calls_time_seconds_count{job=~".*l2-reth.*"}[10m]))
      >= 5
    for: 5m
    labels:
      severity: warning
      service: l2-reth
    annotations:
      summary: l2-reth mean operation latency exceeds 2 seconds.
      description: L2 RPC calls average more than two seconds. Inspect expensive methods and CPU, storage, and database
        contention.
  - alert: L2RethBlobStoreFailure
    expr: sum by (namespace, job, instance) (increase({__name__=~"reth_transaction_pool_blobstore_failed_(inserts|deletes)",job=~".*l2-reth.*"}[5m]))
      > 0
    labels:
      severity: critical
      service: l2-reth
    annotations:
      summary: Reth transaction-pool blob storage operations failed.
      description: Check disk space, filesystem health, and blobstore errors.
  - alert: L2RethTransactionQueueLarge
    expr: reth_transaction_pool_queued_pool_transactions{job=~".*l2-reth.*"} > 1000
    for: 15m
    labels:
      severity: warning
      service: l2-reth
    annotations:
      summary: The Reth queued transaction pool exceeds 1000 transactions.
      description: Check nonce gaps, gas prices, account balances, and admission pressure. Calibrate against normal
        traffic.
  - alert: L2RethL1ReorgObserved
    expr: sum by (namespace, job, instance) (increase(reth_l1_watcher_reorgs{job=~".*l2-reth.*"}[5m])) > 0
    labels:
      severity: warning
      service: l2-reth
    annotations:
      summary: The L2 derivation watcher observed an L1 reorg.
      description: Inspect watcher reorg depth and canonical recovery. Expected shallow reorganizations may not
        warrant paging.

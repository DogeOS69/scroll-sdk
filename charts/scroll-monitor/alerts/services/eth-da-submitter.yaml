# Reviewed service-specific diagnostics. Enabled by default.
groups:
- name: dogeos.services.eth-da-submitter
  interval: 1m
  rules:
  - alert: EthDAQueueValidationIncomplete
    expr: eth_da_submitter_l2_queue_state_validation_complete == 0
    for: 15m
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA L2 queue-state validation has not completed.
      description: Inspect startup queue validation, durable chain evidence, and reorg recovery.
  - alert: EthDAParkedReplays
    expr: eth_da_publish_parked_replays > 0
    for: 15m
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA replay or replacement rows remain parked.
      description: Inspect receipts, external nonce drift, and repair requirements. Parked rows may require operator
        reconciliation.
  - alert: EthDAReplaySafetyBudgetExhausted
    expr: sum by (namespace, job, instance) (increase(eth_da_publish_replay_rejection_escalations_total[5m])) >
      0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA automatic replay exhausted its safety budget.
      description: Inspect the bounded broadcast outcome and durable transaction state before manual repair.
  - alert: EthDASigningFailure
    expr: sum by (namespace, job, instance) ((label_replace(increase(eth_da_submitter_sign_failures_total[5m]), "error_counter", "eth_da_submitter_sign_failures_total", "", "")
      or label_replace(increase(eth_da_submitter_signer_startup_failures_total[5m]), "error_counter", "eth_da_submitter_signer_startup_failures_total", "", "")
      or label_replace(increase(eth_da_publish_signing_policy_rejections_total[5m]), "error_counter", "eth_da_publish_signing_policy_rejections_total", "", "")))
      > 0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA transaction signing failed or was rejected by policy.
      description: Check signer backend availability, KMS authorization, expected address, and transaction policy.
  - alert: EthDAReplacementFailure
    expr: sum by (namespace, job, instance) (increase(eth_da_publish_replacement_failures_total[5m])) > 0
    for: 5m
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA replacement transactions keep failing.
      description: Inspect fee replacement rules, nonce ownership, and provider responses. Fee-cap blocks have a
        separate existing rule.
  - alert: EthDAFeeSampleUnavailable
    expr: eth_da_publish_fee_sample_available == 0 and on (namespace, job, instance) eth_da_publish_ready_backlog
      > 0
    for: 10m
    labels:
      severity: warning
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA cannot obtain a fee sample while publication work is ready.
      description: Check the Ethereum RPC and blob fee sampling path.
  - alert: EthDAWindowBudgetBlocked
    expr: sum by (namespace, job, instance) (increase(eth_da_publish_window_budget_deferrals_total[5m])) > 0
    for: 15m
    labels:
      severity: warning
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA publication window budget repeatedly defers work.
      description: Review the configured blob budget, available window capacity, and publication deadlines.
  - alert: EthDABatchDataInvalid
    expr: sum by (namespace, job, instance) ((label_replace(increase(eth_da_submitter_chunk_created_at_corrupt_total[5m]), "error_counter", "eth_da_submitter_chunk_created_at_corrupt_total", "", "")
      or label_replace(increase(eth_da_submitter_chunk_compressed_data_compatibility_breaches_total[5m]), "error_counter", "eth_da_submitter_chunk_compressed_data_compatibility_breaches_total", "", "")
      or label_replace(increase(eth_da_submitter_batch_compressed_data_compatibility_breaches_total[5m]), "error_counter", "eth_da_submitter_batch_compressed_data_compatibility_breaches_total", "", "")
      or label_replace(increase(eth_da_submitter_first_block_exceeds_limit_total[5m]), "error_counter", "eth_da_submitter_first_block_exceeds_limit_total", "", "")
      or label_replace(increase(eth_da_submitter_first_chunk_exceeds_limit_total[5m]), "error_counter", "eth_da_submitter_first_chunk_exceeds_limit_total", "", "")))
      > 0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA batch construction encountered corrupt or unpublishable data.
      description: Inspect chunk timestamps, codec compatibility, and single-item size limits. Ordinary batch prefix
        shrinking is excluded.
  - alert: EthDALifecycleCorrelationFailure
    expr: sum by (namespace, job, instance) (increase(eth_da_submitter_lifecycle_correlation_failures_total[5m]))
      > 0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA lifecycle events cannot be correlated to durable submissions.
      description: Inspect transaction identifiers, lifecycle callbacks, and persisted submission rows.
  - alert: EthDABlobUploadRetryExhausted
    expr: eth_da_submitter_blob_upload_retry_exhausted_rows > 0
    for: 5m
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob archive uploads exhausted their retry budget.
      description: Repair archive connectivity or credentials, then reconcile the failed upload rows.
  - alert: EthDABlobArchiveConflict
    expr: eth_da_submitter_blob_upload_conflict_rows > 0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob archive rows are in a terminal conflict state.
      description: Compare archive object integrity with the canonical blob and winning upload attempt.
  - alert: EthDABlobArchiveMalformedState
    expr: sum by (namespace, job, instance) ((label_replace(increase(eth_da_submitter_blob_upload_malformed_rows_total[5m]), "error_counter", "eth_da_submitter_blob_upload_malformed_rows_total", "", "")
      or label_replace(increase(eth_da_submitter_blob_upload_recovery_missing_attempts_total[5m]), "error_counter", "eth_da_submitter_blob_upload_recovery_missing_attempts_total", "", "")
      or label_replace(increase(eth_da_submitter_blob_upload_conflict_races_total[5m]), "error_counter", "eth_da_submitter_blob_upload_conflict_races_total", "", "")))
      > 0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob archive recovery found malformed or inconsistent durable state.
      description: Inspect quarantined rows, missing winning attempts, and conflicting upload claims.
  - alert: EthDABlobUploadFailures
    expr: sum by (namespace, job, instance) (increase(eth_da_submitter_blob_upload_failures_total[5m])) > 0
    for: 10m
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob archive upload failures persist.
      description: Inspect S3 responses, permissions, object integrity, and retry backlog.
  - alert: EthDAArchiveTaskFatal
    expr: eth_da_submitter_blob_upload_task_fatal == 1
    for: 2m
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob uploader is in fatal restart backoff.
      description: Inspect fatal uploader errors or panics and verify archive durability.
  - alert: EthDASegmentationSidecarFatal
    expr: eth_da_submitter_segmentation_sidecar_task_fatal == 1
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA chunk-segmentation sidecar publisher hit a fatal condition.
      description: Inspect sidecar publication and durable chunk data.
  - alert: EthDAArchiveAnonymousWriteAllowed
    expr: sum by (namespace, job, instance) (increase(eth_da_submitter_blob_upload_anonymous_write_probe_total{outcome="allowed_success"}[5m]))
      > 0
    labels:
      severity: critical
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob archive accepted an anonymous S3 write probe.
      description: Remove public write access and verify the configured archive policy.
  - alert: EthDAArchiveWriteProbeInconclusive
    expr: sum by (namespace, job, instance) (increase(eth_da_submitter_blob_upload_anonymous_write_probe_total{outcome!~"denied|allowed_success"}[5m]))
      > 0
    labels:
      severity: warning
      service: eth-da-submitter
    annotations:
      summary: Ethereum DA blob archive write-permission probe did not confirm denial.
      description: Inspect probe configuration, network, and credentials. An inconclusive result is not proof of
        public write access.

groups:
  - name: dogeos.dstack
    interval: 30s
    rules:
      - alert: DstackMetricsUnavailable
        expr: (max(up{dstack_source="native",dstack_namespace="__DSTACK_NAMESPACE__",dstack_controller="__DSTACK_CONTROLLER__"}) == 0 or absent(up{dstack_source="native",dstack_namespace="__DSTACK_NAMESPACE__",dstack_controller="__DSTACK_CONTROLLER__"})) and on() (max(kube_deployment_spec_replicas{namespace="__DSTACK_NAMESPACE__",deployment="__DSTACK_CONTROLLER__"}) > 0)
        for: __DSTACK_UNAVAILABLE_FOR__
        labels: {severity: warning, service: dstack-controller, visibility: internal}
        annotations:
          summary: Dstack metrics cannot be collected.
          description: Check ServiceMonitor namespace discovery, metrics Secret, RBAC, endpoint latency and sample limit. Successful scraping establishes controller observability only, not GPU reachability or telemetry freshness.
      - alert: DstackRunFailures
        expr: sum by (dstack_namespace, dstack_controller, dstack_project_name) (increase(dstack_run_count_failed_total{dstack_source="native",dstack_namespace="__DSTACK_NAMESPACE__",dstack_controller="__DSTACK_CONTROLLER__"}[10m])) >= __DSTACK_FAILED_RUNS__
        labels: {severity: warning, service: dstack-controller, visibility: internal}
        annotations:
          summary: Multiple dstack runs failed in the last ten minutes.
          description: Inspect run errors and provider capacity. This is a dstack execution failure signal, not proof completion status; correlate with proof-coordinator and worker metrics.

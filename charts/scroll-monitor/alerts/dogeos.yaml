groups:
  - name: dogeos.metrics
    interval: 1m
    rules:
      - alert: EthDASubmitterNotReady
        expr: max(eth_da_submitter_ready) < 1 or absent(eth_da_submitter_ready)
        for: 2m
        labels:
          severity: critical
          service: eth-da-submitter
        annotations:
          summary: Ethereum DA submitter is not ready.
          description: No eth-da-submitter instance has reported ready for 2 minutes, or its readiness metric is missing. L2 batch publication to Ethereum depends on this service. Check the Pod logs, Ethereum RPC, signer backend, and metrics target.

      - alert: EthDAPublishBacklogStalled
        expr: max(eth_da_publish_ready_backlog > 0 and eth_da_publish_oldest_ready_age_seconds > 3600) > 0
        for: 5m
        labels:
          severity: critical
          service: eth-da-submitter
        annotations:
          summary: Ethereum DA publication backlog is older than one hour.
          description: 'The oldest of {{ $value | printf "%.0f" }} ready but unpublished row(s) has waited more than one hour. Check the submitter logs, Ethereum fee limits, account balance, and RPC errors.'

      - alert: EthDASubmitterFailures
        # Error counters are created lazily. Summing one selector avoids an
        # absent counter erasing the other counters through vector addition.
        expr: sum(increase({__name__=~"eth_da_submitter_(submission|cycle|lifecycle|l2_reorg)_failures_total"}[10m])) > 0
        labels:
          severity: critical
          service: eth-da-submitter
        annotations:
          summary: Ethereum DA submitter is reporting failures.
          description: '{{ $value | printf "%.0f" }} submission, cycle, lifecycle, or L2 reorg failure(s) were recorded in the last 10 minutes. Check the submitter logs for the failing stage, then its Ethereum RPC and signer responses.'

      - alert: WithdrawalInboxWorkerFailures
        expr: max(withdrawal_processor_eth_da_inbox_worker_consecutive_failures) > 0
        for: 5m
        labels:
          severity: critical
          service: withdrawal-processor
        annotations:
          summary: Withdrawal processor cannot read the Ethereum DA inbox.
          description: 'The inbox worker has failed {{ $value | printf "%.0f" }} consecutive time(s). New L2 batch data is not ingested until it recovers. Check the withdrawal-processor logs and its Ethereum RPC.'

      - alert: WithdrawalInboxWorkerStale
        expr: (time() - max(withdrawal_processor_eth_da_inbox_worker_last_observed_timestamp_seconds) > 900) or absent(withdrawal_processor_eth_da_inbox_worker_last_observed_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
          service: withdrawal-processor
        annotations:
          summary: Withdrawal processor has not observed the Ethereum DA inbox for 15 minutes.
          description: The inbox worker's last observation is older than 15 minutes, or its metric is missing. Check that withdrawal-processor is running, then its inbox worker logs and Ethereum RPC.

      - alert: L1InterfaceNotReady
        expr: max(l1_interface_service_ready) < 1 or absent(l1_interface_service_ready)
        for: 2m
        labels:
          severity: critical
          service: l1-interface
        annotations:
          summary: L1 Interface is not ready.
          description: No l1-interface instance has reported ready for 2 minutes, or its readiness metric is missing. Check the Pod logs, Dogecoin RPC, database, and protocol replay status.

      - alert: FeeOracleStale
        previousExpr: (time() - max(fee_oracle_ethereum_da_oracle_value_latest_computed_at_ms / 1000) > 900) or absent(fee_oracle_ethereum_da_oracle_value_latest_computed_at_ms)
        expr: time() - max(fee_oracle_ethereum_da_oracle_value_latest_computed_at_ms / 1000) > 900
        for: 5m
        labels:
          severity: critical
          service: fee-oracle
        annotations:
          summary: Fee oracle value has not been updated for 15 minutes.
          description: The latest Ethereum DA oracle value was computed more than 15 minutes ago, so L2 fees may not reflect current DA costs. Check fee-oracle logs, its Ethereum and price-feed RPCs, and the update transaction signer.
        previousAnnotations:
          description: The latest computed value is stale or the metric is absent.

      - alert: FeeOracleMetricMissing
        expr: absent(fee_oracle_ethereum_da_oracle_value_latest_computed_at_ms)
        for: 5m
        labels:
          severity: warning
          service: fee-oracle
        annotations:
          summary: Fee oracle freshness cannot be evaluated because its metric is missing.
          description: Check whether fee-oracle is deployed, its ServiceMonitor is selected, and its metrics endpoint exports the computation timestamp. Missing telemetry does not establish a stale oracle value. Pause this rule if fee-oracle is intentionally absent.

      - alert: FeeOracleErrors
        expr: sum(increase({__name__=~"fee_oracle_(updates_failed|errors|chain_rpc_errors)_total"}[10m])) > 0
        labels:
          severity: warning
          service: fee-oracle
        annotations:
          summary: Fee oracle is reporting errors.
          description: '{{ $value | printf "%.0f" }} update, computation, or chain RPC error(s) were recorded in the last 10 minutes. Check fee-oracle logs for the failing stage and its RPC endpoints.'

      - alert: TSONoRegisteredSigners
        previousExpr:
          - sum(tso_core_registered_signers_count) < 1 or absent(tso_core_registered_signers_count)
          - sum(tso_core_registered_signers_count) < 1
        expr: max by (namespace, job, instance) (tso_core_registered_signers_count and on (namespace, job, instance) __TSO_REGISTRY_VALID__) < 1
        for: 5m
        labels:
          severity: critical
          service: tso-service
        annotations:
          summary: TSO has no registered signers.
          description: TSO reports zero registered signers in a valid registry snapshot, so no bridge transaction can be signed. Check signer registration, signer connectivity to TSO, and TSO logs.
        previousAnnotations:
          description: TSO reports fewer than one registered signer or the metric is absent.

      - alert: TSOSignerMetricMissing
        previousExpr: "absent(tso_core_registered_signers_count)"
        previousAnnotations:
          summary: "TSO signer count cannot be evaluated because its metric is missing."
          description: "Check the TSO ServiceMonitor, Prometheus target discovery, and /metrics endpoint. Missing telemetry does not establish that there are no registered signers."
        expr: absent(tso_core_registered_signers_count) or ((tso_core_registered_signers_count or on (namespace, job, instance) up{job=~".*tso-service.*"}) unless on (namespace, job, instance) __TSO_REGISTRY_VALID__)
        for: 5m
        labels:
          severity: warning
          service: tso-service
        annotations:
          summary: TSO signer count cannot be evaluated because its observation is unavailable.
          description: Check registry snapshot validity, its success timestamp, the TSO ServiceMonitor, and target discovery. Missing, invalid, or stale telemetry does not establish that there are no registered signers.

      # Keep the alert name for the existing Grafana UID. The rolling window
      # includes a comparison with its left boundary and requires real samples.
      - alert: DogecoinIndexerLag
        previousExpr:
          - clamp_min(scalar(max(dogecoin_synced_headers_total)) - max by (job) (indexer_dogecoin_last_synced_block), 0) > 12
          - __LEGACY_INDEXER_LAG_EXPR__
        previousFor: 10m
        expr: >-
          max by (namespace, job, instance) (
            (changes(__INDEXER_METRIC__[2m]) == 0)
            and (count_over_time(__INDEXER_METRIC__[2m]) >= 2)
            and (__INDEXER_METRIC__ == __INDEXER_METRIC__ offset 2m)
          )
        for: 0s
        labels:
          severity: warning
          service: embedded-dogecoin-indexer
        annotations:
          summary: Embedded Dogecoin indexer in {{ $labels.job }} has not advanced for 2 minutes.
          description: Job {{ $labels.job }} instance {{ $labels.instance }} has reported the same last synced Dogecoin block for 2 minutes. Check the indexer logs and Dogecoin RPC availability.
        previousAnnotations:
          summary:
            - Embedded Dogecoin indexer {{ $labels.job }} is more than 12 headers behind the node.
            - Embedded Dogecoin indexer {{ $labels.job }} is more than __INDEXER_MAX_EXCESS_LAG__ blocks behind its confirmed target.
          description:
            - Job {{ $labels.job }} currently lags by {{ $value }} blocks.
            - Job {{ $labels.job }} has {{ $value }} blocks of excess lag after subtracting its configured Dogecoin confirmation depth from the node block height.

      # Compare gauges at one-minute intervals. A decrease is not progress.
      # Require an hour of history and a currently present series; do not add
      # another pending hour on top of this rolling 60-minute window.
      - alert: ProtocolStateWFTxNumberStalled
        expr: >-
          max_over_time((
            max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_wf_tx_number"})
            > bool
            max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_wf_tx_number"} offset 1m)
          )[60m:1m]) == 0
          and max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_wf_tx_number"} offset 60m)
          and max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_wf_tx_number"})
        labels:
          severity: critical
        annotations:
          summary: Protocol state has not recorded a new WF transaction for 60 minutes.
          description: 'Job {{ $labels.job }} in namespace {{ $labels.namespace }} has not observed a new WF transaction in protocol state for 60 minutes. If deposits or withdrawals are pending, they are not settling. Check this job''s Dogecoin indexing and protocol replay; if both are current, check withdrawal-processor WF jobs, TSO signing, and broadcast.'

      # Compare gauges at one-minute intervals. A decrease is not progress.
      # Require an hour of history and a currently present series; do not add
      # another pending hour on top of this rolling 60-minute window.
      - alert: ReplayHeadWFTxNumberStalled
        expr: >-
          max_over_time((
            max by (namespace, job) (withdrawal_processor_protocol_replay_wf_tx_number)
            > bool
            max by (namespace, job) (withdrawal_processor_protocol_replay_wf_tx_number offset 1m)
          )[60m:1m]) == 0
          and max by (namespace, job) (withdrawal_processor_protocol_replay_wf_tx_number offset 60m)
          and max by (namespace, job) (withdrawal_processor_protocol_replay_wf_tx_number)
        labels:
          severity: critical
        annotations:
          summary: Withdrawal processor replay head has not advanced for 60 minutes.
          description: 'Job {{ $labels.job }} in namespace {{ $labels.namespace }} has not replayed a new WF transaction for 60 minutes. If deposits or withdrawals are pending, they are not settling. Check replay status and Dogecoin indexing in this job; if both are current, check WF jobs, TSO signing, and broadcast.'

      # Compare gauges at one-minute intervals. A decrease is not progress.
      # Require an hour of history and a currently present series; do not add
      # another pending hour on top of this rolling 60-minute window.
      - alert: L2BatchHeightStalled
        expr: >-
          max_over_time((
            max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_l2_batch_height"})
            > bool
            max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_l2_batch_height"} offset 1m)
          )[60m:1m]) == 0
          and max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_l2_batch_height"} offset 60m)
          and max by (namespace, job) ({__name__=~"(l1_interface|withdrawal_processor)_protocol_state_l2_batch_height"})
        labels:
          severity: critical
        annotations:
          summary: Protocol state has not recorded a new L2 batch for 60 minutes.
          description: 'Job {{ $labels.job }} in namespace {{ $labels.namespace }} has not observed a higher L2 batch in protocol state for 60 minutes. Check Ethereum DA publication, L2 proof generation, and AdvanceL2 WF jobs. If ProtocolStateWFTxNumberStalled is also firing, start with WF jobs and TSO signing.'

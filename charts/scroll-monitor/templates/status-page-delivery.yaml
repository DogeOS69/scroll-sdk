{{- $status := .Values.statusPage }}
{{- if and $status.enabled (has (int (($status.generated | default dict).version | default 0)) (list 2 3)) (($status.publication | default dict).delivery | default dict).enabled }}
{{- $config := ($status.generated | default dict).delivery | default dict }}
{{- if or (not (hasKey $config "components")) (ne (toJson $config) (toJson $status.generated.componentPublication.delivery)) }}
{{- fail "statusPage delivery requires regenerated CLI configuration" }}
{{- end }}
{{- if ne $config.prometheusUrl .Values.monitoring.datasources.prometheus.url }}
{{- fail "statusPage delivery Prometheus URL changed; regenerate" }}
{{- end }}
{{- $runtime := deepCopy $config }}
{{- $_ := set $runtime "sourceNamespace" ($config.sourceNamespace | default .Release.Namespace) }}
{{- if $config.components }}
{{- $name := printf "%s-status-delivery" .Release.Name | trunc 63 | trimSuffix "-" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  delivery.json: {{ $runtime | toJson | quote }}
  delivery.py: |
{{ .Files.Get "scripts/status-page-delivery.py" | indent 4 }}
  status_page_health.py: |
{{ .Files.Get "scripts/status_page_health.py" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $status.publication.delivery.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $status.publication.delivery.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: scroll-status-delivery, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scroll-status-delivery, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ $runtime | toJson | sha256sum }}
        checksum/script: {{ printf "%s%s" (.Files.Get "scripts/status-page-delivery.py") (.Files.Get "scripts/status_page_health.py") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: delivery
          image: {{ $status.publication.delivery.image | quote }}
          command: [python3, /config/delivery.py]
          ports: [{name: http, containerPort: 9110}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          env:
            {{- range $key, $component := $config.components }}
            {{- if eq ($component.mode | default "automatic") "automatic" }}
            - name: {{ $component.webhookEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "instatus-%s-webhook" $key }}
                  key: url
            {{- end }}
            {{- end }}
            {{- if $config.heartbeatEnabled }}
            - name: INSTATUS_MONITORING_HEARTBEAT_URL
              valueFrom:
                secretKeyRef: {name: instatus-monitoring-heartbeat, key: url}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 120
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: state
          persistentVolumeClaim: {claimName: {{ $name }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: scroll-status-delivery, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  selector: {app.kubernetes.io/name: scroll-status-delivery, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 9110, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: scroll-status-delivery, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: {{ .Release.Name }}}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 9110}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: {release: {{ .Release.Name }}, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: scroll-status-delivery, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints: [{port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s}]
{{- end }}
{{- end }}

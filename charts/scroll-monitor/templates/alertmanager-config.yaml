{{- if eq .Values.alerting.backend "prometheus" }}
{{- $am := .Values.alerting.alertmanager }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $am.configSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: scroll-monitor
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-alerts
      group_by: [alertname, namespace, job, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers: ['alertname=~"Watchdog|InfoInhibitor"']
    receivers:
      - name: 'null'
      - name: slack-alerts
        {{- if $am.slack.existingSecret }}
        slack_configs:
          - api_url_file: {{ printf "/etc/alertmanager/secrets/%s/%s" $am.slack.existingSecret $am.slack.secretKey | quote }}
            {{- with $am.slack.channel }}
            channel: {{ . | quote }}
            {{- end }}
            send_resolved: true
            title: '{{ "{{ template \"scroll-monitor.slack.title\" . }}" }}'
            title_link: '{{ "{{ template \"scroll-monitor.slack.titlelink\" . }}" }}'
            text: '{{ "{{ template \"scroll-monitor.slack.text\" . }}" }}'
        {{- end }}
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity=~"warning|info"']
        equal: [namespace, alertname]
      - source_matchers: ['severity="warning"']
        target_matchers: ['severity="info"']
        equal: [namespace, alertname]
      - source_matchers: ['alertname="InfoInhibitor"']
        target_matchers: ['severity="info"']
        equal: [namespace]
    templates: ['/etc/alertmanager/config/*.tmpl']
  notifications.tmpl: |
{{ printf "%s\n%s" (.Files.Get "notifications/annotation-helpers.tmpl") (.Files.Get "notifications/alertmanager-slack.tmpl") | replace "__GRAFANA_URL__" (trimSuffix "/" $am.grafanaURL) | replace "__DATASOURCE_UID__" $am.datasourceUID | replace "__ENVIRONMENT__" ($am.environment | default .Values.statusPage.environment) | indent 4 }}
{{- end }}

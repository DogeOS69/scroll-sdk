{{- if and (hasKey .Values "promtail") ((index .Values "promtail").enabled | default false) }}
  {{- fail "promtail has been removed; use the bundled Grafana Alloy collector" }}
{{- end }}
{{- range $name, $paused := .Values.grafanaAlerting.pauseRules }}
{{- if not (kindIs "bool" $paused) }}
{{- fail (printf "grafanaAlerting.pauseRules.%s must be a boolean" $name) }}
{{- end }}
{{- end }}
{{- $stack := index .Values "kube-prometheus-stack" }}
{{- range $section := list "diskAlerts" "resourceAlerts" "businessPodAlerts" }}
{{- $settings := index $.Values $section }}
{{- if not (kindIs "bool" $settings.enabled) }}
{{- fail (printf "%s.enabled must be a boolean" $section) }}
{{- end }}
{{- if $settings.enabled }}
{{- range $key, $value := $settings }}
{{- if hasSuffix "Percent" $key }}
{{- if or (not (regexMatch "^([0-9]+)(\\.[0-9]+)?$" (toString $value))) (le (float64 $value) 0.0) (gt (float64 $value) 100.0) }}
{{- fail (printf "%s.%s must be greater than 0 and at most 100" $section $key) }}
{{- end }}
{{- end }}
{{- if hasSuffix "For" $key }}
{{- if not (regexMatch "^[1-9][0-9]*[smh]$" (toString $value)) }}
{{- fail (printf "%s.%s must be a positive duration (s, m or h)" $section $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.diskAlerts.enabled }}
{{- $d := .Values.diskAlerts }}
{{- if or (ge (float64 $d.usagePercent) (float64 $d.criticalUsagePercent)) (ge (float64 $d.inodeWarningPercent) (float64 $d.inodeCriticalPercent)) }}
{{- fail "diskAlerts warning thresholds must be below critical thresholds" }}
{{- end }}
{{- if or (not (regexMatch "^[1-9][0-9]*$" (toString $d.predictionWarningHours))) (not (regexMatch "^[1-9][0-9]*$" (toString $d.predictionCriticalHours))) (le (int $d.predictionWarningHours) (int $d.predictionCriticalHours)) }}
{{- fail "diskAlerts prediction hours must be positive integers with warning greater than critical" }}
{{- end }}
{{- end }}
{{- if .Values.resourceAlerts.enabled }}
{{- $r := .Values.resourceAlerts }}
{{- if or (ge (float64 $r.nodeMemoryWarningPercent) (float64 $r.nodeMemoryCriticalPercent)) (ge (float64 $r.containerMemoryWarningPercent) (float64 $r.containerMemoryCriticalPercent)) }}
{{- fail "resourceAlerts memory warning thresholds must be below critical thresholds" }}
{{- end }}
{{- end }}
{{- if or .Values.businessPodAlerts.enabled .Values.resourceAlerts.enabled }}
{{- if empty .Values.businessPodAlerts.podNameRegex }}
{{- fail "businessPodAlerts.podNameRegex must select the business pods" }}
{{- end }}
{{- if or (not $stack.enabled) (not $stack.kubeStateMetrics.enabled) }}
{{- fail "businessPodAlerts/resourceAlerts requires kube-prometheus-stack and kubeStateMetrics enabled" }}
{{- end }}
{{- end }}
{{- if .Values.businessPodAlerts.enabled }}
{{- if or (empty .Values.businessPodAlerts.workloadNameRegex) (not (regexMatch "^[1-9][0-9]*$" (toString .Values.businessPodAlerts.restartThreshold))) }}
{{- fail "businessPodAlerts requires workloadNameRegex and a positive integer restartThreshold" }}
{{- end }}
{{- end }}
{{- if .Values.eksControlPlane.enabled }}
{{- if or (not $stack.enabled) (not $stack.prometheus.enabled) }}
{{- fail "eksControlPlane requires the bundled Prometheus" }}
{{- end }}
{{- if or $stack.kubeScheduler.serviceMonitor.enabled $stack.kubeControllerManager.serviceMonitor.enabled }}
{{- fail "eksControlPlane requires kube-prometheus-stack.kubeScheduler.serviceMonitor.enabled=false and kubeControllerManager.serviceMonitor.enabled=false to avoid duplicate targets" }}
{{- end }}
{{- if or (not $stack.kubeScheduler.enabled) (not $stack.kubeControllerManager.enabled) }}
{{- fail "eksControlPlane requires kubeScheduler.enabled and kubeControllerManager.enabled to retain their monitoring rules" }}
{{- end }}
{{- end }}
{{- if .Values.infrastructureAlerts.requireReceiver }}
{{- if not $stack.alertmanager.enabled }}
{{- fail "infrastructureAlerts.requireReceiver requires the bundled Alertmanager" }}
{{- end }}
{{- if not $stack.alertmanager.alertmanagerSpec.useExistingSecret }}
{{- $configured := false }}
{{- $defaultReceiver := $stack.alertmanager.config.route.receiver }}
{{- range $receiver := $stack.alertmanager.config.receivers }}
{{- if eq $receiver.name $defaultReceiver }}
{{- range $key, $value := $receiver }}
{{- if and (hasSuffix "_configs" $key) (not (empty $value)) }}
{{- $configured = true }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $configured }}
{{- fail "infrastructureAlerts.requireReceiver: configure a default Alertmanager receiver with a notification integration, or provide alertmanagerSpec.useExistingSecret" }}
{{- end }}
{{- end }}
{{- end }}
{{- if empty .Values.dogecoinIndexerAlerts.jobRegex }}
{{- fail "dogecoinIndexerAlerts.jobRegex must select the indexer jobs" }}
{{- end }}
{{- if .Values.balanceMonitoring.enabled }}
{{- range $account := .Values.balanceMonitoring.ethereum }}
{{- if not (kindIs "bool" $account.enabled) }}
{{- fail "balanceMonitoring.ethereum account enabled flags must be booleans" }}
{{- end }}
{{- if lt (float64 $account.minimumEth) 0.0 }}
{{- fail "balanceMonitoring Ethereum thresholds must be nonnegative" }}
{{- end }}
{{- end }}
{{- if lt (float64 .Values.balanceMonitoring.feeWallet.minimumDoge) 0.0 }}
{{- fail "balanceMonitoring.feeWallet.minimumDoge must be nonnegative" }}
{{- end }}
{{- if .Values.balanceMonitoring.exporter.enabled }}
{{- if or (lt (int .Values.balanceMonitoring.exporter.intervalSeconds) 1) (gt (int .Values.balanceMonitoring.exporter.intervalSeconds) 120) }}
{{- fail "balance exporter intervalSeconds must be 1..120 to meet freshness checks" }}
{{- end }}
{{- if or (lt (int .Values.balanceMonitoring.exporter.rpcTimeoutSeconds) 1) (gt (int .Values.balanceMonitoring.exporter.rpcTimeoutSeconds) 15) }}
{{- fail "balance exporter rpcTimeoutSeconds must be 1..15" }}
{{- end }}
{{- end }}
{{- end }}
{{- range $role, $threshold := .Values.businessAlerts.requiredSignersByRole }}
{{- if or (not (regexMatch "^[A-Za-z][A-Za-z0-9_]*$" $role)) (not (regexMatch "^[1-9][0-9]*$" (toString $threshold))) }}
{{- fail "businessAlerts.requiredSignersByRole requires role names and positive integer thresholds" }}
{{- end }}
{{- end }}
{{- if and .Values.alloy.enabled .Values.alloy.logs.enabled (empty .Values.alloy.logs.loki.url) }}
  {{- fail "alloy.logs.enabled=true requires alloy.logs.loki.url" }}
{{- end }}
{{- if and .Values.alloy.enabled .Values.alloy.metrics.otlp.enabled (empty .Values.alloy.metrics.prometheusRemoteWrite.url) }}
  {{- fail "alloy.metrics.otlp.enabled=true requires alloy.metrics.prometheusRemoteWrite.url" }}
{{- end }}
{{- if and .Values.alloy.enabled (gt (int .Values.alloy.controller.replicas) 1) (not .Values.alloy.alloy.clustering.enabled) }}
  {{- fail "Alloy replicas greater than one require alloy.alloy.clustering.enabled=true to avoid duplicate collection" }}
{{- end }}
{{- if and .Values.alloy.enabled .Values.alloy.logs.enabled (not .Values.loki.enabled) }}
  {{- fail "Alloy log collection requires loki.enabled=true" }}
{{- end }}
{{- if and .Values.alloy.enabled .Values.alloy.metrics.otlp.enabled (not (index .Values "kube-prometheus-stack").enabled) }}
  {{- fail "Alloy OTLP collection requires kube-prometheus-stack.enabled=true" }}
{{- end }}
{{- if and .Values.grafana.enabled (not (index .Values "kube-prometheus-stack").enabled) }}
  {{- fail "standalone Grafana requires kube-prometheus-stack.enabled=true" }}
{{- end }}
{{- if and .Values.grafana.enabled .Values.monitoring.datasources.loki.enabled (not .Values.loki.enabled) }}
  {{- fail "the bundled Grafana Loki datasource requires loki.enabled=true; disable monitoring.datasources.loki.enabled when logs are not installed" }}
{{- end }}

{{- if .Values.dstack.enabled }}
{{- range $value := list .Values.dstack.namespace .Values.dstack.controllerName }}
{{- if or (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $value)) (gt (len $value) 63) }}
{{- fail "dstack namespace/controllerName must be Kubernetes DNS labels" }}
{{- end }}
{{- end }}
{{- if or (not (regexMatch "^[1-9][0-9]*[smh]$" .Values.dstack.alerts.unavailableFor)) (not (regexMatch "^[1-9][0-9]*$" (toString .Values.dstack.alerts.failedRunsThreshold))) }}
{{- fail "dstack alerts require a positive duration and failedRunsThreshold" }}
{{- end }}
{{- if .Values.dstack.gpuHosts.enabled }}
{{- range .Values.dstack.gpuHosts.expectedHosts }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" .) }}
{{- fail "dstack.gpuHosts.expectedHosts must contain stable host IDs" }}
{{- end }}
{{- end }}
{{- if or (lt (int .Values.dstack.gpuHosts.staleAfterSeconds) 60) (not (regexMatch "^[1-9][0-9]*[smh]$" .Values.dstack.gpuHosts.unavailableFor)) (le (float64 .Values.dstack.gpuHosts.diskAvailableRatio) 0.0) (ge (float64 .Values.dstack.gpuHosts.diskAvailableRatio) 1.0) }}
{{- fail "dstack.gpuHosts requires staleAfterSeconds >= 60, a positive duration, and diskAvailableRatio between 0 and 1" }}
{{- end }}
{{- if ne (len .Values.dstack.gpuHosts.expectedHosts) (len (uniq .Values.dstack.gpuHosts.expectedHosts)) }}
{{- fail "dstack.gpuHosts.expectedHosts must be unique" }}
{{- end }}
{{- end }}
{{- end }}

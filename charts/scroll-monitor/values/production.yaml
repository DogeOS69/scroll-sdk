# Status-page automation. Default is offline/disabled; see docs/status-page-automation.md.
statusPage:
  enabled: false  # [OPERATOR] Set true before CLI generation.
  environment: ""  # [OPERATOR] Explicit testnet, mainnet or devnet; not the Dogecoin network.
  sources:
    frontends: frontends-production.yaml  # [OPERATOR] Filename in this values directory.
    publicRpc: l2-reth-rpc-public-production.yaml  # [OPERATOR] Select the ENABLED public RPC release.
    blockscout: blockscout-production.yaml  # [OPERATOR] Deployed Blockscout; L2Scan excluded.
    scheme: https  # [OPERATOR] Actual external scheme; no domain substitution.
    bridgePath: /bridge  # [CONVENTION] Public route, appended to frontend ingress host.
  grafana:
    orgId: 1  # [OPERATOR] Organization in scroll-monitor's Grafana, not Instatus.
    contactPointName: instatus-public  # [LEGACY] Bootstrap name; publication uses per-component names.
    receiverUid: instatus-public-webhook  # [LEGACY] Bootstrap UID; retained for existing installations.
    webhookSecretRef:
      name: instatus-grafana-webhook  # [LEGACY] Bootstrap Secret; component references are generated below.
      key: url  # [LEGACY] Bootstrap Secret data key.
  # [OPERATOR] Independent component modes: manual, observe or automatic.
  # Observe is the default. Missing evidence never means Operational.
  publication:
    observationContactPointName: grafana-default-email  # Existing INTERNAL receiver; configure real SMTP/contact delivery.
    delivery:
      enabled: true  # Validate health and recovery before forwarding component webhooks.
      image: python:3.12.11-alpine3.22  # [DEFAULT] Standard-library runtime; no custom image build.
      storageClassName: ""  # [OPERATOR] Empty uses cluster default; durable state must survive redeployment.
      storageSize: 1Gi  # [DEFAULT] One SQLite delivery journal, single replica.
    incidents:
      manageTemplates: true  # [OPERATOR] CLI --apply sets templates on this network's managed integrations.
      affectedStatus: DEGRADEDPERFORMANCE  # [DEFAULT] One severity per component; operators can escalate.
      notifySubscribers: false  # [OPERATOR] Opt in after incident wording and delivery acceptance.
    heartbeat:
      enabled: false  # [OPERATOR] Enable independent Instatus detection of lost monitoring.
      alertIds: []  # [OPERATOR] Instatus monitor alert destination IDs; required when enabled.
      # [GENERATED] Cron monitor: 60s period + 180s grace, no public component/incident.
      # [PRIVATE GENERATED] secrets/status-page/heartbeat.json and heartbeat.secret.yaml.
    health:
      failureFor: 5m  # [DEFAULT] Continuous failure confirmation.
      recoveryFor: 10m  # [DEFAULT] Continuous fresh health before recovery; resets on restart/gaps.
      freshnessSeconds: 120  # [DEFAULT] Maximum observation/snapshot age.
      minimumProbeLocations: 2  # [OPERATOR] Actual independent locations, not replicas.
      maxBlockAgeSeconds: 120  # [OPERATOR] Confirm continuous block production and normal block period.
      maxRpcLatencySeconds: 2  # [DEFAULT] p95 threshold after at least 10 samples within 5 minutes.
      maxIndexLagSeconds: 120  # [DEFAULT] Explorer indexed block vs canonical RPC block time.
      maxNodeLagSeconds: 120  # [DEFAULT] External canary node vs canonical RPC block time.
      depositDeadlineSeconds: 0  # [REQUIRED FOR BUILTIN] Set confirmed normal processing deadline; 0 means unconfigured.
      withdrawalDeadlineSeconds: 0  # [REQUIRED FOR BUILTIN] Count only protocol-eligible, unfulfilled withdrawals.
      batchPublicationDeadlineSeconds: 0  # [REQUIRED FOR BUILTIN] Include time awaiting transaction confirmation.
      ethDaSubmitterJobRegex: eth-da-submitter  # [OPERATOR] Prometheus job for the actual publisher.
      withdrawalProcessorJobRegex: withdrawal-processor  # [OPERATOR] Withdrawal role only; exclude proof-work-only replicas.
    probes:
      metricsTargets: []  # [OPERATOR] Private reachable host:port per external location; CLI merges the Prometheus scrape job.
      # Empty if your existing private federation/remote-write already supplies the probe metrics.
      sequencingMode: unconfigured  # [OPERATOR] continuous or on-demand; on-demand requires custom eligible-work rule.
      bridgeChecks: []  # [OPERATOR] Required public API checks: [{url: https://..., path: [field], equals: value}].
      explorerApiUrls: []  # [GENERATED/OPERATOR] CLI can derive Blockscout backend ingress; [] requires an override.
      explorerSelector: ""  # [OPERATOR] Reviewed CSS selector proving rendered explorer data, e.g. a block link.
      nodeRpcUrl: ""  # [OPERATOR] Independently operated sync canary; override per external probe location.
      nodeDependencyChecks: []  # [OPERATOR] Semantic JSON checks for public bootstrap/DA dependencies.
    components:
      public-rpc: {mode: observe, rule: {builtin: true}}
      sequencing: {mode: observe, rule: {builtin: true}}
      deposits: {mode: observe, rule: {builtin: true}}
      withdrawals: {mode: observe, rule: {builtin: true}}
      batch-publication: {mode: observe, rule: {builtin: true}}
      node-sync: {mode: observe, rule: {builtin: true}}
      bridge-portal: {mode: observe, rule: {builtin: true}}
      block-explorer: {mode: observe, rule: {builtin: true}}
    # Custom rule alternative: {builtin: false, expr: '<EXACTLY_ONE_0_OR_1_SERIES>', for: 5m}
    # 0=healthy, 1=affected, absent=unknown; expression must enforce source completeness/freshness.
    # [GENERATED] Per-component instatus-<key> contact point, rule UID status-<key>.
    # [PRIVATE GENERATED] Secret instatus-<key>-webhook, key url; secrets/status-page/<key>.binding.json and .secret.yaml.
    # --apply --create-webhook creates/reuses one integration per automatic component.
    # --probe-values values/status-page-probe-production.yaml exports external probe values.
  instatus:
    workspaceSlug: 6wxpx  # [OPERATOR] Existing DogeOS workspace; validated by --plan/--apply.
    pageId: ""  # [GENERATED] Shared dogeos page ID; same for all three deployments.
    subdomain: dogeos  # [CONVENTION] One public page for Mainnet, Testnet and Devnet.
    pageName: DogeOS  # [SHARED] Keep page name/branding identical across deployments.
    groupId: ""  # [GENERATED] Discovered from the group named Mainnet/Testnet/Devnet.
    # [ONE-TIME SETUP] In Instatus, create each network group with a Public RPC component.
    # Public REST API can attach components to groups; group creation requires the dashboard.
    branding:  # [SHARED DEFAULTS] Official DogeOS brand assets; {} leaves existing branding unchanged.
      # Upload the logo in Instatus Look & feel; omitted here to preserve that URL.
      # Raw GitHub logo URLs are rejected by the public page image optimizer.
      faviconUrl: https://raw.githubusercontent.com/DogeOS69/web-images/main/dogeos_favicon.png
      websiteUrl: https://www.dogeos.com/
    email: ""  # [OPERATOR] Page owner email; required only when creating a page.
    initialStatus: OPERATIONAL  # [DEFAULT] Initial state for NEW components only; existing live status is preserved.
    # This initializes the page; it is not a health-check result. Override if needed.
    # Allowed: OPERATIONAL, UNDERMAINTENANCE, DEGRADEDPERFORMANCE, PARTIALOUTAGE, MAJOROUTAGE.
    showUptime: false  # [OPERATOR] Enable after public alert coverage/history is ready.
    componentIds: {}  # [GENERATED] Persisted by --apply; may map existing component keys to IDs.
  # [GENERATED] catalog and generated are written by the CLI; do not edit manually.
  # Native grafana.envValueFrom and grafana.alerting are generated too.
  # [SECRET] INSTATUS_API_KEY is an environment variable used by CLI --plan/--apply only.
  # Legacy bootstrap (without publication block): scrollsdk setup status-page --plan --create-webhook, then --apply --create-webhook.
  # [PRIVATE GENERATED] secrets/status-page/binding.json + grafana.secret.yaml.
  # Keep that directory in private backups; ordinary --apply reuses it.
  # Apply grafana.secret.yaml to the existing Grafana namespace separately.
  # Existing URL: --apply --webhook-url-file /private/instatus-grafana.url.
  # [GENERATED] generated.webhookRequested prevents replacement if private state is lost.
  # Neither API key, webhook URL nor integration ID belongs in this YAML.

grafana:
  # Optional Instatus native webhook; no custom publisher or management API key.
  # Create the referenced Secret in Grafana's namespace with the URL generated
  # by CLI --apply --create-webhook or Instatus > Apps > Grafana. Never inline the URL.
  # Manual alternative when statusPage.enabled=false: uncomment BOTH blocks.
  # When statusPage.enabled=true, the CLI generates these fields; leave this example commented.
  # BEGIN OPTIONAL INSTATUS CONFIG
  # envValueFrom:
  #   INSTATUS_GRAFANA_WEBHOOK_URL:
  #     secretKeyRef:
  #       name: instatus-grafana-webhook # [OPERATOR] Existing Secret name.
  #       key: url # [OPERATOR] Data key containing the generated webhook URL.
  # alerting:
  #   instatus-contact-points.yaml:
  #     apiVersion: 1 # [FIXED] Grafana provisioning format.
  #     contactPoints:
  #       - orgId: 1 # [OPERATOR] Grafana org containing the alert rules; default 1.
  #         name: instatus-public # [CONVENTION] Keep stable; used by future routes.
  #         receivers:
  #           - uid: instatus-public-webhook # [CONVENTION] Stable, unused receiver UID.
  #             type: webhook # [FIXED] Native Grafana webhook receiver.
  #             disableResolveMessage: false # [FIXED] Send recovery notifications.
  #             settings:
  #               url: $INSTATUS_GRAFANA_WEBHOOK_URL # [FIXED] Resolved by Grafana at startup.
  #               httpMethod: POST # [FIXED]
  # END OPTIONAL INSTATUS CONFIG
  # File-provisioned contact points are read-only in the UI. Alternatively keep
  # these blocks commented and create the contact point entirely in Grafana UI.
  # Secret rotation requires restarting Grafana. Add selective routing only after
  # public alert/component mappings are agreed; do not forward all managed alerts.
  # See examples/scroll-monitor-configuration.md for field ownership and setup.
  # Email requires an SMTP transport. Create grafana-smtp with keys user and
  # password, then uncomment smtp below and smtp settings in grafana.ini.
  # smtp:
  #   existingSecret: grafana-smtp
  grafana.ini:
    # smtp:
    #   enabled: true
    #   host: smtp.example.com:587
    #   from_address: alerts@example.com
    #   from_name: Scroll Monitor
    #   startTLS_policy: MandatoryStartTLS
    server:
      domain: grafana.scrollsdk
      root_url: "https://grafana.scrollsdk"
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Application alerts are editable in Grafana. Configure Slack and email in
# Alerting > Contact points, using the built-in Grafana Alertmanager.
dashboards:
  bundled:
    enabled: true
grafanaAlerting:
  enabled: true
prometheusRules:
  enabled: true  # Fallback when Grafana alerting is disabled.

# Balance settings consumed by the configuration generator. Public addresses
# and RPC URLs become SCROLL_BALANCE_* environment variables in the exporter.
# No private key is required. Replace <TODO> before deployment.
# Generator input sources and Secret keys: examples/scroll-monitor-configuration.md.
balanceMonitoring:
  enabled: true
  feeWallet:
    enabled: true
    minimumDoge: 100
    jobRegex: ".*withdrawal-processor.*"
  ethereum:
    feeOracle:
      address: "<TODO>"  # Canonical l2GasOracleSender public signer address.
      rpcUrl: "<TODO>"  # config.toml general.L2_RPC_ENDPOINT (reachable from the exporter).
      expectedChainId: "<TODO>"  # config.toml general.CHAIN_ID_L2; keep as a string.
      minimumEth: 5
    ethDaSubmitter:
      address: "<TODO>"  # Canonical l1CommitSender public signer address.
      rpcUrl: "https://ethereum-sepolia-rpc.publicnode.com"  # Sepolia example; generate from ethereumDa.submitterRpcUrl.
      expectedChainId: "<TODO>"  # doge-config ethereumDa.chainId; keep as a string.
      minimumEth: 0.1
  exporter:
    enabled: true
    # For credentialed RPCs, set this to an existing Secret name and explicitly
    # set the corresponding ethereum.<account>.rpcUrl to "" (not <TODO>).
    # Keys: SCROLL_BALANCE_FEE_ORACLE_RPC_URL and/or SCROLL_BALANCE_ETH_DA_SUBMITTER_RPC_URL.
    envFromSecret: ""
    intervalSeconds: 60
    rpcTimeoutSeconds: 10

# Generator/operator decision: enable only when TSO is deployed and its own
# chart does not create a ServiceMonitor. The TSO production example already
# enables an application-owned monitor; legacy deployments may need this one.
# Derive selector labels and named ports from the generated TSO Service.
additionalServiceMonitors:
  tso:
    enabled: false
    selector:
      matchLabels:
        app.kubernetes.io/name: tso-service
        app.kubernetes.io/instance: tso-service
    endpoints:
      - port: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

serviceAlerts:
  enabled: true
  paused: true

dogecoinIndexerAlerts:
  # Alert when an indexer's synced height stays unchanged for 2 minutes.
  # Generator: match the actual Prometheus job names; no confirmation input needed.
  jobRegex: "l1-interface|withdrawal-processor"

businessAlerts:
  enabled: true
  # Populate from the active bridge policy for exact per-role quorum checks.
  requiredSignersByRole: {}

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: '2024-01-01'
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      enableStatefulSetAutoDeletePVC: false
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  gateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  read:
    replicas: 0
  backend:
    replicas: 0
  write:
    replicas: 0
  lokiCanary:
    enabled: false
  test:
    enabled: false
  resultsCache:
    enabled: false
  chunksCache:
    enabled: false

alloy:
  alloy:
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      # [DEFAULT] Discover application PodMonitors (including Blockscout frontend)
      # only in this deployment namespace, matching the chart's ServiceMonitor scope.
      podMonitorSelector:
        matchExpressions:
          - key: app.kubernetes.io/instance
            operator: Exists
      podMonitorNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
      enableRemoteWriteReceiver: true
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 8Gi
  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  kube-state-metrics:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 300m
        memory: 400Mi
  # Legacy fixed-address Scroll balance-checker rules were retired. Application
  # notifications are configured in Grafana; add only current custom rules here.
  additionalPrometheusRules: []

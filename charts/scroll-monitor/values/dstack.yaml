# Apply AFTER production.yaml. Controller is an independent release.
dstack:
  enabled: true
  namespace: dstack-system
  controllerName: dstack-controller
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      serviceMonitorNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ['{{ .Release.Namespace }}', dstack-system]
